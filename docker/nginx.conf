user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
# Nginx error messages can contain the complete request URI (reset/OAuth tokens).
# Keep request-derived raw errors out of hosted logs; status/latency remain below.
error_log /dev/null crit;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not log URLs, query strings, Referer, headers or request bodies.
    log_format main '$request_method $status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    server {
        listen 10000 default_server;
        listen [::]:10000 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Static welcome/PWA probes hit this endpoint repeatedly while Render wakes.
        # Serving it in Nginx keeps those probes out of Laravel/PHP-FPM entirely.
        location = /health {
            access_log off;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "X-Canovia-Ready, X-PaceKeeper-Ready" always;
            add_header X-Canovia-Ready "1" always;
            add_header X-PaceKeeper-Ready "1" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 204;
        }

        # Hashed Vite assets can be cached aggressively.
        location /build/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Keep PWA control files fresh so deployments are picked up quickly.
        location = /sw.js {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /app.webmanifest {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "no-cache" always;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only Laravel's front controller may execute PHP.
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
