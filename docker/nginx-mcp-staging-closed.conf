# STAGING ONLY: web, static assets and legacy /health must all stay
# closed until separately approved. Production Nginx is unchanged.
# The only open endpoint is Laravel's /up readiness probe.
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'rt=$request_time';
    access_log /dev/stdout main;
    server_tokens off;

    server {
        listen 10000 default_server;
        listen [::]:10000 default_server;
        server_name _;
        root /var/www/html/public;

        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /up {
            # Run the real staging Laravel DB-readiness middleware. Never
            # serve a synthetic OK response at the Nginx boundary.
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            # Prevent direct access to PHP front controller, including
            # a request via /index.php?anything. Only internally rewritten
            # /up may reach FPM.
            if ($request_uri != "/up") {
                return 503 "Staging service unavailable.";
            }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
        }

        # No static-file exception: /health, /build, /sw.js and even
        # /index.php are closed. Nginx must not bypass Laravel isolation.
        location / {
            return 503 "Staging service unavailable.";
        }
    }
}
