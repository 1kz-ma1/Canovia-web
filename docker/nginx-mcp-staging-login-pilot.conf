# STAGING ONLY: allowlisted synthetic login and optional IdP linking.
# No general Canovia routing, static PWA, registration or public MCP.
# OAuth callbacks carry authorization codes in query strings: NEVER log
# $request, $request_uri, $args, $query_string or request bodies here.
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    log_format stage_pilot_safe '$remote_addr [$time_local] $request_method $status rt=$request_time';
    access_log /dev/stdout stage_pilot_safe;
    server_tokens off;

    server {
        listen 10000 default_server;
        listen [::]:10000 default_server;
        server_name _;
        root /var/www/html/public;
        client_max_body_size 256k;

        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /up {
            try_files $uri /index.php?$query_string;
        }
        location = /login {
            try_files $uri /index.php?$query_string;
        }
        location = /account {
            try_files $uri /index.php?$query_string;
        }
        location = /logout {
            try_files $uri /index.php?$query_string;
        }
        location ^~ /account/mcp/ {
            try_files $uri /index.php?$query_string;
        }

        # The standalone login and account pilot use inline CSS and no JS.
        # /build and all other normal app assets remain denied by location /.

        # Internal rewrite only. External /index.php is never a route.
        location = /index.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
        }

        location / {
            return 503 "Staging service unavailable.";
        }
    }
}
