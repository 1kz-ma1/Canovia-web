name: V55.4 Validate

on:
  push:
    branches:
      - feature/v55-4-map-exploration-surface

jobs:
  map-exploration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V55.4 PHP
        run: php -l app/Services/HomeSurfacePreference.php && php -l app/Http/Controllers/AuthController.php && php -l tests/Feature/MapExplorationSurfaceV554Test.php && php -l tests/Feature/CanoviaHomeSurfacePreferenceV433Test.php && php -l tests/Feature/CanoviaHomeSurfaceV432Test.php && php -l tests/Feature/FullscreenMapShellV452Test.php && php -l tests/Feature/MobileMapUsabilityPolishV455Test.php

      - name: Compile Blade
        run: php artisan view:cache

      - name: V55.4 Map Exploration Surface
        run: php artisan test tests/Feature/MapExplorationSurfaceV554Test.php

      - name: Legacy Home preference compatibility
        run: php artisan test tests/Feature/CanoviaHomeSurfacePreferenceV433Test.php

      - name: Home Explore surface regression
        run: php artisan test tests/Feature/CanoviaHomeSurfaceV432Test.php

      - name: Fullscreen Map regression
        run: php artisan test tests/Feature/FullscreenMapShellV452Test.php

      - name: Mobile Map regression
        run: php artisan test tests/Feature/MobileMapUsabilityPolishV455Test.php

      - name: Instant Navigation regression
        run: php artisan test tests/Feature/InstantNavigationV4120Test.php tests/Feature/InstantNavigationFragmentV4121Test.php

      - name: V55.3 Current Action Home regression
        run: php artisan test tests/Feature/CurrentActionHomeUxV553Test.php

      - name: Web real-device regression
        run: php artisan test tests/Feature/WebRealDeviceFinishV5198Test.php

      - name: First-run regression
        run: php artisan test tests/Feature/FirstRunUxV4123Test.php
