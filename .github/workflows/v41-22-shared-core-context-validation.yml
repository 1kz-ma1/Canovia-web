name: V41.22 shared core context validation

on:
  push:
    branches:
      - feature/v41-22-shared-core-context

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: node --check resources/js/instant-navigation.mjs
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php -l app/Services/CoreContextService.php
      - run: php -l app/Services/HomePageDataService.php
      - run: php -l app/Services/RoadmapPageDataService.php
      - run: php -l app/Services/CalendarPageDataService.php
      - run: php -l app/Services/TimelinePageDataService.php
      - run: php -l app/Http/Controllers/CoreFragmentBundleController.php
      - run: php -l app/Services/PlanOwnershipService.php
      - run: php artisan view:cache
      - run: php artisan test tests/Feature/SharedCoreContextV4122Test.php tests/Feature/InstantNavigationFragmentV4121Test.php tests/Feature/InstantNavigationV4120Test.php tests/Feature/PerformanceStep2V4119Test.php tests/Feature/NavigationPerformanceV4118Test.php tests/Feature/PerformanceObservabilityV4117Test.php tests/Feature/DashboardGuidanceV395Test.php tests/Feature/DashboardCalendarNavigationTest.php tests/Feature/LivingRoadmapAccountTest.php tests/Feature/InboxFoundationV4113Test.php
      - run: node --test tests/js/instant-start-v391.test.mjs
