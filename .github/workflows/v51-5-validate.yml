name: V51.5 temporary validation

on:
  push:
    branches:
      - feature/v51-5-companion-deep-integration

permissions:
  contents: read

jobs:
  companion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.5 deep integration
        run: php artisan test tests/Feature/CompanionDeepIntegrationV515Test.php

      - name: Companion foundation regression
        run: php artisan test tests/Feature/CanoviaCompanionV4115Test.php

      - name: Companion apply regression
        run: php artisan test tests/Feature/CanoviaCompanionMutationApplyV4115Test.php

      - name: Companion continuity regression
        run: php artisan test tests/Feature/CanoviaCompanionContinuityV4115Test.php

      - name: Primary navigation regression
        run: php artisan test tests/Feature/PrimaryNavigationCompanionV510Test.php
