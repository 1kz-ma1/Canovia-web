name: E858 Transport Offline Preflight

on:
  pull_request:
    branches: [audit/e858-source-bound-readiness]
    paths:
      - 'scripts/ci/e858_transport_preflight/**'
      - 'tests/ci/test_e858_transport_preflight.py'
      - '.github/workflows/e858-transport-offline-preflight.yml'
      - 'docs/development/integration/2026-10-18-b/e858-transport-offline-preflight.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-regression:
    uses: ./.github/workflows/integration-migration-safety.yml
  fixed-diagnostic-regression:
    uses: ./.github/workflows/integration-schema-diagnostics.yml
  offline:
    name: Transport offline safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate immutable dependency checkout (never patch inherited guards)
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/audit/e858-source-bound-readiness)" = be89af9a2cb4b13ef16579d2570f4a5605a711b8
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/e858-base"
          git -C "$RUNNER_TEMP/e858-base" checkout --quiet --detach be89af9a2cb4b13ef16579d2570f4a5605a711b8
          for ref in main production release/2026-10-19-e858b9c8 release/2026-10-19-c09a8fc7 audit/e858-source-bound-readiness; do
            git -C "$RUNNER_TEMP/e858-base" update-ref "refs/remotes/origin/$ref" "$(git rev-parse "refs/remotes/origin/$ref")"
          done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Synthetic environment only
        run: |
          if [ ! -f .env ]; then printf '%s\n' '# Synthetic CI only.' > .env; fi
      - name: Original fixed dependency Python contract (33 cases, before)
        working-directory: ${{ runner.temp }}/e858-base
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_audit.py -v
      - name: New transport adversarial contracts
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_transport_preflight.py -v
      - name: Original fixed dependency Python contract (33 cases, after; not independent coverage)
        working-directory: ${{ runner.temp }}/e858-base
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_audit.py -v
      - run: >-
          php artisan test tests/Feature/Release20TransitionPreflightTest.php
          tests/Feature/IntegratedRelease20MigrationSafetyTest.php
          tests/Feature/ReleaseSchemaLedgerFenceTest.php
          tests/Feature/LearningContextWatchPersistenceTest.php
          tests/Feature/McpOAuthAccountLinkTest.php --fail-on-skipped --colors=never
  mysql:
    name: Transport disposable (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate immutable dependency checkout (never patch inherited guards)
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/audit/e858-source-bound-readiness)" = be89af9a2cb4b13ef16579d2570f4a5605a711b8
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/e858-base"
          git -C "$RUNNER_TEMP/e858-base" checkout --quiet --detach be89af9a2cb4b13ef16579d2570f4a5605a711b8
          for ref in main production release/2026-10-19-e858b9c8 release/2026-10-19-c09a8fc7 audit/e858-source-bound-readiness; do
            git -C "$RUNNER_TEMP/e858-base" update-ref "refs/remotes/origin/$ref" "$(git rev-parse "refs/remotes/origin/$ref")"
          done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Synthetic environment only
        run: |
          if [ ! -f .env ]; then printf '%s\n' '# Synthetic CI only.' > .env; fi
      - name: Own disposable loopback MySQL only
        env:
          SERIES: ${{ matrix.series }}
        run: |
          set -euo pipefail
          if [ "$SERIES" = '8.0' ]; then name=canovia-integration-80; port=13380; else name=canovia-integration-84; port=13384; fi
          docker run -d --name "$name" --label canovia.integration=2026-10-16 \
            -p "127.0.0.1:$port:3306" -e MYSQL_ROOT_PASSWORD=ci-only-root-password \
            -e MYSQL_DATABASE=canovia_p0_ci -e MYSQL_USER=canovia_ci \
            -e MYSQL_PASSWORD=ci-only-ephemeral-password "mysql:$SERIES" --log-bin-trust-function-creators=1
          for attempt in $(seq 1 60); do
            if docker exec -e MYSQL_PWD=ci-only-ephemeral-password "$name" mysql --protocol=TCP -h127.0.0.1 -u canovia_ci -Nse 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Share installed dependencies with private fixed checkout
        run: |
          ln -s "$GITHUB_WORKSPACE/vendor" "$RUNNER_TEMP/e858-base/vendor"
          printf '%s\n' '# Synthetic dependency CI only.' > "$RUNNER_TEMP/e858-base/.env"
      - name: Rebuild both fixed dependency boundaries twice (base tooling, not new code)
        env:
          SERIES: ${{ matrix.series }}
        working-directory: ${{ runner.temp }}/e858-base
        run: python3 -B scripts/ci/e858_audit_mysql.py --series "$SERIES"
      - name: New bounded loopback metadata transport (no live target ingress)
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -I -B scripts/ci/e858_transport_preflight/disposable.py "$SERIES"
      - name: Retain existing All20 negative and interrupted-DDL coverage
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -B scripts/ci/release20_transition_mysql.py --series "$SERIES"
      - name: Real disposable MCP identity replay and retained grants audit
        env:
          SERIES: ${{ matrix.series }}
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: canovia_mcp_lock_ci
          DB_USERNAME: canovia_ci
          DB_PASSWORD: ci-only-ephemeral-password
          DB_URL: ''
          DATABASE_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          CANOVIA_MCP_DISPOSABLE_LOCK_CI: '1'
          CANOVIA_PUBLIC_RELEASE_LEVEL: '0'
          CANOVIA_NATIVE_AI_DRIVER: disabled
          FEATURE_CANOVIA_AI: 'false'
        run: |
          set -euo pipefail
          if [ "$SERIES" = '8.0' ]; then name=canovia-integration-80; export DB_PORT=13380; else name=canovia-integration-84; export DB_PORT=13384; fi
          test "$(docker inspect --format '{{index .Config.Labels "canovia.integration"}}' "$name")" = 2026-10-16
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = canovia_mcp_lock_ci
          docker exec -e MYSQL_PWD=ci-only-root-password "$name" mysql -uroot \
            -e "CREATE DATABASE canovia_mcp_lock_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON canovia_mcp_lock_ci.* TO 'canovia_ci'@'%';"
          php artisan migrate --force --no-interaction
          php artisan test tests/Feature/McpDatabaseLockContentionTest.php tests/Feature/McpMigrationRollbackSafetyTest.php --fail-on-skipped --stop-on-failure --colors=never
