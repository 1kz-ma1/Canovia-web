name: V58.3 Study Workspace Surfaces Validation

on:
  push:
    branches:
      - feature/v58-3-study-workspace-surfaces
  pull_request:
    branches:
      - main

jobs:
  study-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/StudyWorkspaceController.php
          php -l app/Services/StudyWorkspaceViewService.php
          php -l tests/Feature/StudyWorkspaceFocusedSurfacesV583Test.php
          php -l tests/Feature/StudyWorkspaceV543Test.php
          php -l tests/Feature/StudyStateFirstWorkspaceV5613Test.php
          php -l tests/Feature/StudyMethodRecommendationV5615Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.3 focused Study surfaces
        run: php artisan test tests/Feature/StudyWorkspaceFocusedSurfacesV583Test.php
      - name: Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php
      - name: Study State First regression
        run: php artisan test tests/Feature/StudyStateFirstWorkspaceV5613Test.php
      - name: Study Method Recommendation regression
        run: php artisan test tests/Feature/StudyMethodRecommendationV5615Test.php
      - name: V58.2 Mode Top regression
        run: php artisan test tests/Feature/SpecializedWorkspaceTopsV582Test.php
      - name: Workspace Mode regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePersistenceV542Test.php tests/Feature/WorkspaceModeOnboardingV547Test.php tests/Feature/MobileWorkspaceModeEntryV566Test.php
      - name: Desktop shell regression
        run: php artisan test tests/Feature/DesktopHeaderDensityV579Test.php
