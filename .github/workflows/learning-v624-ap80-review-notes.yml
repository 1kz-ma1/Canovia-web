name: Learning V6.24 AP80 Human Review Notes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learning-v624-ap80-review-notes.yml'
      - 'app/Services/ApExamCandidateHumanReviewIntakeService.php'
      - 'app/Console/Commands/InspectApExamCandidateHumanReviewNotes.php'
      - 'tests/Feature/ApExamCandidateHumanReviewIntakeV624Test.php'
      - 'app/Services/ApExamCandidateQualityReviewService.php'
      - 'app/Services/ApExamCandidateRevisionPreviewService.php'
      - 'resources/learning_review/**'
      - 'resources/question_packs/ap/ap-a-2026-cbt-80-candidate-v2.json'
      - 'docs/development/LEARNING_AP80_HUMAN_REVIEW_NOTES_V6_24_2026_10_15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ap80-draft-review-v624:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up disposable offline Laravel environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "NATIVE_AI_DRIVER=disabled" >> .env
          php artisan key:generate --force --no-interaction
          php -l app/Services/ApExamCandidateHumanReviewIntakeService.php
          php -l app/Console/Commands/InspectApExamCandidateHumanReviewNotes.php
          php -l tests/Feature/ApExamCandidateHumanReviewIntakeV624Test.php
      - name: AP80 notes, original candidate gates and prior workbook regression
        run: |
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array \
          php artisan test \
            tests/Feature/ApExamCandidateHumanReviewIntakeV624Test.php \
            tests/Feature/ApExamCandidateQualityReviewTest.php \
            tests/Feature/ApExamCandidateRevisionPreviewTest.php \
            tests/Feature/ApExamCandidateBundleAuditTest.php \
            tests/Feature/StudyOfficialSyllabusReviewWorkbookV623Test.php
      - name: Evidence limit
        run: |
          echo "Synthetic-only review notes and existing AP80 candidate protections checked."
          echo "No independent expert/rights signoff, exam equivalence, import, publication, production deploy or device acceptance."
