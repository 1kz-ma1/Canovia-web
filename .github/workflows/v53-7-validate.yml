name: V53.7 Validate

on:
  push:
    branches:
      - feature/v53-7-developer-evidence-sync

jobs:
  developer-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V53.7 PHP
        run: find app/Intelligence app/Jobs/ProcessGitHubWebhookDelivery.php app/Services/GitHubDevelopmentEvidenceService.php app/Services/GitHubWebhookService.php app/Services/GitHubRepositoryWriter.php app/Services/GitHubReturnEvidenceService.php app/Http/Controllers/GitHubWebhookController.php app/Models/GitHubWebhookDelivery.php app/Models/TaskEvidence.php database/migrations/2026_10_04_000600_add_routing_targets_to_github_webhook_deliveries_table.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: V53.7 Development Evidence
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php

      - name: V46.7 GitHub Return regression
        run: php artisan test tests/Feature/GitHubReturnEvidenceV467Test.php

      - name: V46.8 GitHub Evidence Decision regression
        run: php artisan test tests/Feature/GitHubEvidenceDecisionV468Test.php

      - name: V46.10 GitHub Webhook regression
        run: php artisan test tests/Feature/GitHubWebhookReturnSyncV4610Test.php

      - name: V46.0 GitHub Workflow regression
        run: php artisan test tests/Feature/GitHubWorkflowHubV460Test.php

      - name: V53.0 Intelligence contract regression
        run: php artisan test tests/Unit/IntelligenceContractV530Test.php

      - name: V53.5 Study Intelligence regression
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php

      - name: V53.6 Adaptive Action regression
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php

      - name: Feature Access regression
        run: php artisan test tests/Feature/FeatureAccessV406Test.php
