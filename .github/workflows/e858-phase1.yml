name: E858 Phase1 Observe Only

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/e858_phase1/**'
      - 'scripts/ci/e858_phase1_host.py'
      - 'scripts/ci/e858_r1_driver_host.py'
      - 'scripts/ci/e858_phase1_review.py'
      - 'scripts/ci/e858_private_archive.py'
      - 'scripts/ci/e858_tls/transport.py'
      - 'scripts/ci/e858_tls/control_contract.py'
      - 'scripts/ci/e858_tls_host.py'
      - 'scripts/ci/e858_b_offline.py'
      - 'tests/ci/test_e858_phase1.py'
      - 'tests/ci/test_e858_r1_tty.py'
      - 'tests/ci/test_e858_r1_adapter.py'
      - 'tests/ci/test_e858_r1_driver.py'
      - 'tests/ci/test_e858_phase1_review.py'
      - 'tests/ci/test_e858_private_candidate.py'
      - 'tests/ci/test_e858_private_root.py'
      - 'tests/ci/test_e858_private_acl.py'
      - 'tests/ci/test_e858_private_operator.py'
      - 'tests/ci/test_e858_private_entry.py'
      - 'tests/ci/test_e858_private_archive_closure.py'
      - 'tests/ci/test_e858_private_runtime_lock.py'
      - 'tests/ci/test_e858_private_native_runtime.py'
      - 'tests/ci/test_e858_private_acceptance.py'
      - 'scripts/ci/e858_native_runtime_review.py'
      - '.github/workflows/e858-phase1.yml'
      - 'docs/development/integration/2026-10-18-b/e858-real-audit-route-safety.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Phase1 offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-15, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install PyMySQL==1.1.2 cryptography==46.0.3
      - name: B1 supervised entry delta (synthetic roots and PTYs)
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_b1_operator.py -v
      - name: B1 supervised entry delta
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_b1_operator.py -v
      - name: Private adapter delta without connection
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_candidate.py -v
      - name: Inert private-root FD boundary (synthetic only)
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_root.py -v
      - name: Inert Darwin native ACL observation (synthetic only)
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_acl.py -v
      - name: Inert operator foreground observation (synthetic only)
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_operator.py -v
      - name: Owner adoption gap stays HOLD with forged synthetic receipts
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_acceptance.py -v
      - name: Supervised B entry FD ACL and TTY rehearsal (offline only)
        run: python3 -B -m unittest discover -s tests/ci -p test_e858_private_entry.py -v
      - name: Accepted adapter and driver scope
        id: accepted-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- scripts/ci/e858_phase1/runtime.py scripts/ci/e858_phase1/protocol.py scripts/ci/e858_phase1/fixtures.py scripts/ci/e858_phase1/r1_tty.py scripts/ci/e858_phase1/r1_adapter.py scripts/ci/e858_phase1/r1_driver.py scripts/ci/e858_phase1/r1_driver_fixtures.py scripts/ci/e858_tls scripts/ci/e858_b_offline.py scripts/ci/p0_mysql_metadata_grants_guard.py tests/ci/test_e858_r1_adapter.py tests/ci/test_e858_r1_driver.py; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'ACCEPTED_26_13_UNCHANGED_REUSED'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Changed accepted adapter or driver regression
        if: steps.accepted-scope.outputs.run == 'true'
        run: |
          python3 -B -m unittest discover -s tests/ci -p test_e858_r1_driver.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_r1_adapter.py -v
      - name: Phase1 SQL privacy and close contracts with unchanged B and TLS guards
        run: |
          python3 -B -m unittest discover -s tests/ci -p test_e858_phase1_review.py -v
          python3 -I -B scripts/ci/e858_phase1_review.py --tooling-sha "$(git rev-parse HEAD)"
          python3 -B -m unittest discover -s tests/ci -p test_e858_r1_tty.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_phase1.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b_control.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_isolated_tls.py -v
      - name: Reproducible inert archive and import closure
        env:
          BUILD_DIR: ${{ runner.temp }}/e858-inert-candidate
        run: |
          mkdir -m 700 "$BUILD_DIR"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$BUILD_DIR" PyMySQL==1.1.2
          python3 -I -B scripts/ci/e858_private_archive.py --tooling-sha "$(git rev-parse HEAD)" --wheel "$BUILD_DIR/pymysql-1.1.2-py3-none-any.whl" --output "$BUILD_DIR/candidate.zip"
          python3 -I -B scripts/ci/e858_private_archive.py --tooling-sha "$(git rev-parse HEAD)" --wheel "$BUILD_DIR/pymysql-1.1.2-py3-none-any.whl" --output "$BUILD_DIR/repeated.zip"
          cmp "$BUILD_DIR/candidate.zip" "$BUILD_DIR/repeated.zip"
          python3 -B -m unittest discover -s tests/ci -p test_e858_private_archive_closure.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_private_runtime_lock.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_private_native_runtime.py -v
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 -I -B scripts/ci/e858_native_runtime_review.py > "$BUILD_DIR/native-observation.json"
            python3 -I -B -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["execution_allowed"] is False and x["runtime_complete"] is False' "$BUILD_DIR/native-observation.json"
          else
            test "$(python3 -I -B scripts/ci/e858_native_runtime_review.py ignored-arg 2>/dev/null | grep -c INERT_NATIVE_RUNTIME_OBSERVATION_BLOCKED)" -eq 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: inert-candidate-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/e858-inert-candidate/candidate.zip
          if-no-files-found: error
          retention-days: 7
  mysql:
    name: Phase1 TLS (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install cryptography==46.0.3
      - name: Reuse accepted Phase1 wire evidence when transport is unchanged
        id: wire-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Review inventory/docs do not require a fresh synthetic wire audit.
          # Missing base/dispatch/unknown diff defaults to the existing wire run.
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- scripts/ci/e858_phase1/runtime.py scripts/ci/e858_phase1/protocol.py scripts/ci/e858_phase1/fixtures.py scripts/ci/e858_phase1/r1_tty.py scripts/ci/e858_phase1/r1_adapter.py scripts/ci/e858_phase1/r1_driver.py scripts/ci/e858_phase1/r1_driver_fixtures.py scripts/ci/e858_phase1_host.py scripts/ci/e858_r1_driver_host.py scripts/ci/e858_tls scripts/ci/e858_tls_host.py scripts/ci/e858_b_offline.py scripts/ci/p0_mysql_metadata_grants_input.py scripts/ci/p0_mysql_metadata_grants_guard.py scripts/ci/release488_runtime_ddl_restore_gate.py scripts/ci/integrated_release20_audit.py scripts/ci/p0_mysql_full_ledger_offline_check.py tests/ci/test_e858_phase1.py tests/ci/test_e858_r1_tty.py tests/ci/test_e858_r1_adapter.py tests/ci/test_e858_r1_driver.py; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'PHASE1_WIRE_UNCHANGED_NOT_RUN_REUSE_817_39599644167'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Phase1 plus R1 real driver delta on the same owned TLS network
        if: steps.wire-scope.outputs.run == 'true'
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -I -B scripts/ci/e858_r1_driver_host.py --series "$SERIES" --tooling-sha "$(git rev-parse HEAD)"
      - run: test -z "$(git status --porcelain)"
