name: V41.17 performance observability validation

on:
  push:
    branches:
      - feature/v41-17-performance-observability

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php -l app/Support/RequestPerformance.php
      - run: php -l app/Http/Middleware/MeasurePagePerformance.php
      - run: php -l app/Providers/AppServiceProvider.php
      - run: php -l bootstrap/app.php
      - run: php -l config/performance.php
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Feature/PerformanceObservabilityV4117Test.php tests/Feature/InboxFoundationV4113Test.php tests/Feature/BehaviorTrackingTest.php
