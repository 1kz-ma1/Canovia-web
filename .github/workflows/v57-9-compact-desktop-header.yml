name: V57.9 Compact Desktop Header Validation

on:
  push:
    branches:
      - feature/v57-9-compact-desktop-header
  pull_request:
    branches:
      - main

jobs:
  compact-desktop-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l tests/Feature/DesktopHeaderDensityV579Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V57.9 desktop header density
        run: php artisan test tests/Feature/DesktopHeaderDensityV579Test.php
      - name: Workspace Mode bar regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePolishTelemetryV548Test.php
      - name: Mobile Workspace Mode regression
        run: php artisan test tests/Feature/MobileWorkspaceModeEntryV566Test.php
      - name: Workspace persistence regression
        run: php artisan test tests/Feature/WorkspaceModePersistenceV542Test.php
      - name: Home shell regression
        run: php artisan test tests/Feature/ActionHomeDensityV5197Test.php tests/Feature/WebRealDeviceFinishV5198Test.php
      - name: Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/DeveloperHomeV573Test.php
