name: V41.15 Step 4 Validation

on:
  push:
    branches:
      - feature/v41-15d-companion-continuity
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: PHP syntax
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Blade cache
        run: php artisan view:cache

      - name: Companion routes
        run: php artisan route:list --name=companion

      - name: Full regression
        run: php artisan test
