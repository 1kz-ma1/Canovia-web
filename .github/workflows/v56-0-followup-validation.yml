name: V56.0 Follow-up Validate

on:
  push:
    branches:
      - fix/v56-0-post-merge-convergence-regressions

jobs:
  study-exam-convergence-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: PHP lint
        run: |
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l app/Services/StudyExamConvergencePolicyService.php
          php -l app/Services/StudyPracticeStrategyService.php
          php -l app/Services/StudyTaskProgressionService.php
          php -l app/Services/StudyPracticePromptService.php
          php -l app/Services/StudyExamDateService.php
          php -l app/Intelligence/Study/StudyPlanIntelligenceService.php
          php -l tests/Feature/StudyExamConvergencePolicyV560Test.php
          php -l tests/Feature/StudyPracticeOrchestrationV401Test.php

      - run: php artisan view:cache
      - run: php artisan migrate --force

      - name: V56.0 convergence
        run: php artisan test tests/Feature/StudyExamConvergencePolicyV560Test.php

      - name: V41.4 weakness priority
        run: php artisan test tests/Feature/StudyPracticeCalibrationV414Test.php

      - name: V41.10 progression
        run: php artisan test tests/Feature/StudyTaskProgressionV4110Test.php

      - name: V40.1 orchestration
        run: php artisan test tests/Feature/StudyPracticeOrchestrationV401Test.php

      - name: Guided flow
        run: php artisan test tests/Feature/StudyPracticeGuidedFlowV4074Test.php

      - name: Question Bank
        run: php artisan test tests/Feature/QuestionBankV402Test.php tests/Feature/HybridQuestionAssemblyV4182Test.php

      - name: Native AI
        run: php artisan test tests/Feature/NativeAiPracticeV418Test.php

      - name: Study Intelligence
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php tests/Feature/StudyAdaptiveActionV536Test.php

      - name: Study Workspace
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php
