name: Production Promotion Policy Gate

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-contract:
    name: Production promotion contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check source is main from the same repository
        if: github.event_name == 'pull_request'
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = main
          test "$SOURCE_REPO" = "$TARGET_REPO"
          echo "production_promotion_source: pass"
      - uses: actions/checkout@v4
      - name: Validate metadata-only Aiven audit remains fail-closed
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/ci -p 'test_release_488_mysql_ledger_gate.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_p0_mysql_metadata_grants_guard.py' -v
          bash -n scripts/ops/p0_mysql_operator_select_only_collect.sh
          echo "metadata_only_release_gate: pass"
      - name: Confirm production schema writes on startup remain explicit
        run: |
          set -euo pipefail
          grep -Fq 'php artisan migrate --force' docker/render-start.sh
          echo "production_startup_migration_review_required: pass"
