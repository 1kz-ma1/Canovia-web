name: V42.1 Map focus validation

on:
  push:
    branches:
      - feature/v42-1-map-focus-context-surface

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php -l app/Services/MapProjectionService.php
      - run: php artisan view:cache
      - run: node --test tests/js/living-map-v421.test.mjs
      - run: php artisan test tests/Feature/CanoviaMapV420Test.php tests/Feature/CanoviaMapFocusV421Test.php tests/Feature/FirstRunUxV4123Test.php tests/Feature/ActionHierarchyV4113Test.php tests/Feature/InstantNavigationV4120Test.php tests/Feature/InstantNavigationFragmentV4121Test.php
