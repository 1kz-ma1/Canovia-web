name: Learning Watch Owner Settings (No Delivery)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Http/Controllers/LearningContextWatchSettingsController.php'
      - 'resources/views/workspace/study/context-watch-settings.blade.php'
      - 'resources/views/workspace/study/index.blade.php'
      - 'routes/web.php'
      - 'tests/Feature/LearningContextWatchSettingsTest.php'
      - 'docs/development/LEARNING_CONTEXT_WATCH_OWNER_SETTINGS_V04_2026_10_15.md'
      - '.github/workflows/learning-context-watch-owner-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Composer install without invoking app hooks
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: PHP syntax and blade compile checks
        run: |
          php -l app/Http/Controllers/LearningContextWatchSettingsController.php
          php -l tests/Feature/LearningContextWatchSettingsTest.php
      - name: Owner settings + encrypted state + change-detection regression
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan test tests/Feature/LearningContextWatchSettingsTest.php tests/Feature/LearningContextWatchPersistenceTest.php tests/Feature/LearningContextSourceCaptureTest.php tests/Unit/LearningContextChangeDetectionServiceTest.php --colors=never
