name: V41.14 Step2 Verify

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Syntax Blade and routes
        run: |
          php -l app/Http/Controllers/GoalDiscoveryController.php
          php -l app/Services/GoalContextAccessService.php
          php -l app/Services/GoalDiscoveryPolicyService.php
          php -l app/Services/GoalContextService.php
          php -l app/Http/Controllers/PlanController.php
          php -l tests/Feature/AdaptiveGoalDiscoveryV4114Test.php
          php artisan view:cache
          php artisan route:list --name=goal_discovery
      - name: Focused regression
        run: |
          php artisan test \
            tests/Feature/AdaptiveGoalDiscoveryV4114Test.php \
            tests/Feature/GoalContextFoundationV4114Test.php \
            tests/Feature/PublicBetaPolishV16Test.php \
            tests/Feature/CanoviaGuideV405Test.php \
            tests/Feature/MutationIdempotencyV390Test.php \
            tests/Feature/PlanVisualPreferencesTest.php \
            tests/Feature/AiPlanFunnelTelemetryV388Test.php \
            tests/Feature/InboxIntelligenceGuideV4113Test.php
