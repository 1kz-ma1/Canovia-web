name: V55.0 Validate

on:
  push:
    branches:
      - feature/v55-0-career-intelligence-foundation

jobs:
  career-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V55.0 PHP
        run: find app/Intelligence/Career app/Intelligence/Data/CareerIntelligenceResult.php app/Intelligence/Data/CareerAdaptiveActionResult.php app/Intelligence/Enums/IntelligenceDomain.php app/Intelligence/Adapters/TaskEvidenceAdapter.php app/Intelligence/Services/DecisionTraceStore.php app/Intelligence/Services/ActionProjectionStore.php app/Services/CareerCaptureService.php app/Http/Controllers/CareerWorkspaceController.php app/Http/Controllers/InterviewReviewController.php tests/Feature/CareerIntelligenceV550Test.php tests/Unit/IntelligenceContractV530Test.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade
        run: php artisan view:cache

      - name: V55.0 Career Intelligence
        run: php artisan test tests/Feature/CareerIntelligenceV550Test.php

      - name: Career Capture / Interview Review regression
        run: php artisan test tests/Feature/CareerCaptureInterviewReviewV413Test.php

      - name: Intelligence core contract regression
        run: php artisan test tests/Unit/IntelligenceContractV530Test.php

      - name: V54.8 Workspace Mode closeout regression
        run: php artisan test tests/Feature/WorkspaceModePolishTelemetryV548Test.php

      - name: V54.7 onboarding regression
        run: php artisan test tests/Feature/WorkspaceModeOnboardingV547Test.php

      - name: V54.6 State Change regression
        run: php artisan test tests/Feature/StateChangeFeedbackV546Test.php

      - name: V53.8 Development Intelligence regression
        run: php artisan test tests/Feature/DeveloperReadinessV538Test.php

      - name: V53.6 Study Intelligence regression
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php

      - name: Inbox Career routing regression
        run: php artisan test tests/Feature/InboxFoundationV4113Test.php
