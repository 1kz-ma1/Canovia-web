name: Production Migration Recovery Validation

on:
  push:
    branches:
      - fix/v56-8-migration-recovery
  pull_request:
    branches:
      - main

jobs:
  migration-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP and shell lint
        run: |
          php -l database/migrations/2026_10_04_000200_create_intelligence_decision_traces_table.php
          php -l database/migrations/2026_10_04_000300_create_intelligence_reasoning_runs_table.php
          php -l database/migrations/2026_10_04_000400_create_study_scope_capture_tables.php
          php -l database/migrations/2026_10_04_000500_create_intelligence_action_projections_table.php
          php -l database/migrations/2026_10_04_000600_add_routing_targets_to_github_webhook_deliveries_table.php
          php -l database/migrations/2026_10_04_000700_add_workspace_mode_preference_to_users_table.php
          php -l database/migrations/2026_10_05_000100_create_plan_execution_preferences_table.php
          php -l database/migrations/2026_10_05_000200_create_execution_activities_table.php
          php -l database/migrations/2026_10_05_000300_create_provider_connections_table.php
          php -l database/migrations/2026_10_05_000400_reconcile_intelligence_schema_constraints.php
          php -l tests/Feature/MysqlConstraintRecoveryV5611Test.php
          php -l tests/Feature/ProductionMigrationReconciliationV5610Test.php
          php -l tests/Feature/IntelligenceDecisionTraceMigrationRecoveryV568Test.php
          php -l tests/Feature/RenderStartupMigrationRetryV569Test.php
          sh -n docker/render-start.sh
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V56.11 MySQL constraint recovery
        run: php artisan test tests/Feature/MysqlConstraintRecoveryV5611Test.php
      - name: V56.10 production migration reconciliation
        run: php artisan test tests/Feature/ProductionMigrationReconciliationV5610Test.php
      - name: V56.9 Render startup retry
        run: php artisan test tests/Feature/RenderStartupMigrationRetryV569Test.php
      - name: V56.8 migration recovery
        run: php artisan test tests/Feature/IntelligenceDecisionTraceMigrationRecoveryV568Test.php
      - name: V53.2 decision readiness regression
        run: php artisan test tests/Feature/IntelligenceDecisionReadinessV532Test.php
      - name: V56.7 Action Home regression
        run: php artisan test tests/Feature/CanoviaHomeSurfaceV432Test.php
      - name: V56.6 Workspace entry regression
        run: php artisan test tests/Feature/MobileWorkspaceModeEntryV566Test.php
