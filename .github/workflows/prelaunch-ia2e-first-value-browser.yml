name: Pre-Launch IA-2e First Value End-to-End

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prelaunch-ia2e-first-value-browser.yml'
      - 'scripts/ci/prelaunch_ia2e_first_value_browser_smoke.mjs'
      - 'resources/views/plans/show.blade.php'
      - 'resources/css/app.css'
      - 'resources/js/app.js'
      - 'scripts/ci/prelaunch_ia2e_verify_first_value.php'
      - 'docs/development/PRELAUNCH_IA2E_FIRST_VALUE_BROWSER_2026_10_15.md'
      - 'app/Services/PlanDashboardWorkspaceService.php'
      - 'resources/views/plans/partials/dashboard-information-board.blade.php'
      - 'tests/Feature/PrelaunchPlanDashboardReflectionV1Test.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-value-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application deps
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
          npm run build
      - name: Pin disposable local SQLite and disable provider effects
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_ENV=testing" >> "$GITHUB_ENV"
          echo "APP_DEBUG=false" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:8797" >> "$GITHUB_ENV"
          echo "CANOVIA_IA2E_BASE_URL=http://127.0.0.1:8797" >> "$GITHUB_ENV"
          echo "CANOVIA_IA2E_BROWSER_FIXTURE=1" >> "$GITHUB_ENV"
          echo "CANOVIA_PUBLIC_RELEASE_LEVEL=1" >> "$GITHUB_ENV"
          echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
          echo "DB_DATABASE=$RUNNER_TEMP/ia2e-browser.sqlite" >> "$GITHUB_ENV"
          echo "SESSION_DRIVER=file" >> "$GITHUB_ENV"
          echo "CACHE_STORE=file" >> "$GITHUB_ENV"
          echo "QUEUE_CONNECTION=sync" >> "$GITHUB_ENV"
          echo "NATIVE_AI_DRIVER=disabled" >> "$GITHUB_ENV"
          echo "MAIL_MAILER=array" >> "$GITHUB_ENV"
          cp .env.example .env
          touch "$RUNNER_TEMP/ia2e-browser.sqlite"
      - name: Prepare synthetic isolated web application
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php -l scripts/ci/prelaunch_ia2e_verify_first_value.php
          node --check scripts/ci/prelaunch_ia2e_first_value_browser_smoke.mjs
      - name: Test Plan Dashboard reflection scope and false-progress guard
        run: php artisan test --filter=PrelaunchPlanDashboardReflectionV1Test
      - name: Install pinned headless Chromium (CI only)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          git diff --exit-code -- package-lock.json package.json
      - name: Serve isolated app on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup php artisan serve --host=127.0.0.1 --port=8797 > "$RUNNER_TEMP/ia2e-php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ia2e-php-server.pid"
          for i in $(seq 1 40); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8797/register; then exit 0; fi
            sleep 1
          done
          echo "Disposable browser server failed to start" >&2
          exit 1
      - name: Exercise Welcome to Activity Evidence and visible Plan Dashboard/Overview
        run: node scripts/ci/prelaunch_ia2e_first_value_browser_smoke.mjs
      - name: Clarify first-value browser-proof limits
        run: |
          echo "Browser: real Chromium/CSRF from Browse Welcome to owner-created Plan/Task/Evidence and Dashboard/Overview; isolated SQLite. No DB Task seeding."
          echo "NOT tested: autonomous AI first Task, Study feature, native iPhone/Safari, true human comprehension, Render/Aiven Live or production rollout."
          echo "NO release selection/production GO from browser CI."
