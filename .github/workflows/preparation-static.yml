name: Preparation Static Local-first
on:
  pull_request:
    branches: [main]
    paths: ['preparation-local/**', 'local-preview/src/repository.mjs', 'local-preview/src/backup.mjs', 'scripts/ci/preparation_static*', 'tests/browser/preparation_static*.mjs', 'config/prelaunch_interest_diagnostic.php', 'config/canovia_public_roadmap.php', 'resources/css/preparation.css', 'public/images/preparation/**', 'public/brand/canovia-wordmark.png', '.github/workflows/preparation-static.yml', 'docs/development/LOCAL_FIRST_PREVIEW*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Pure PHP bank and scorer reference; no Laravel or DB
        run: |
          php scripts/ci/preparation_static_data.php --data > "$RUNNER_TEMP/data.mjs"
          cmp preparation-local/src/data.mjs "$RUNNER_TEMP/data.mjs"
          php scripts/ci/preparation_static_data.php --vectors > "$RUNNER_TEMP/vectors.json"
      - name: Diagnostic schema and parity
        env:
          PREPARATION_VECTOR_PATH: ${{ runner.temp }}/vectors.json
        run: node --test preparation-local/test/*.test.mjs
      - name: Reproducible closed static candidate
        run: |
          python3 scripts/ci/preparation_static_build.py --out "$RUNNER_TEMP/preparation-one"
          python3 scripts/ci/preparation_static_build.py --out "$RUNNER_TEMP/preparation-two"
          cmp "$RUNNER_TEMP/preparation-one.zip" "$RUNNER_TEMP/preparation-two.zip"
          python3 scripts/ci/preparation_static_build.py --profile C --out "$RUNNER_TEMP/preparation-C"
          python3 -B scripts/ci/preparation_static_build.py --verify-zip "$RUNNER_TEMP/preparation-one.zip" --profile B
          python3 -B scripts/ci/preparation_static_build.py --verify-zip "$RUNNER_TEMP/preparation-C.zip" --profile C
      - name: Distribution source, ZIP and hostile-file boundaries
        run: python3 -B scripts/ci/preparation_static_security_test.py
      - name: Offline Render plan, staged closure and publication HOLD
        run: |
          python3 -B scripts/ci/preparation_static_render_test.py
          mkdir "$RUNNER_TEMP/render-review"
          PREP_SOURCE_SHA="$(git rev-parse HEAD)"
          for PREP_PROFILE in B C; do
            PREP_ZIP="$RUNNER_TEMP/preparation-one.zip"
            if [ "$PREP_PROFILE" = C ]; then PREP_ZIP="$RUNNER_TEMP/preparation-C.zip"; fi
            PREP_ZIP_HASH="$(sha256sum "$PREP_ZIP" | cut -d ' ' -f 1)"
            python3 -B scripts/ci/preparation_static_render.py --profile "$PREP_PROFILE" --source-sha "$PREP_SOURCE_SHA" --artifact "$PREP_ZIP" --artifact-sha256 "$PREP_ZIP_HASH" --plan-out "$RUNNER_TEMP/render-review/$PREP_PROFILE.json" --stage "$RUNNER_TEMP/render-review/.render-static-$PREP_PROFILE"
            python3 -B scripts/ci/preparation_static_render.py --profile "$PREP_PROFILE" --source-sha "$PREP_SOURCE_SHA" --artifact "$PREP_ZIP" --artifact-sha256 "$PREP_ZIP_HASH" --plan "$RUNNER_TEMP/render-review/$PREP_PROFILE.json" > "$RUNNER_TEMP/render-review/$PREP_PROFILE-report.json"
          done
      - name: Dormant B release wrapper and fail-closed staging review
        run: python3 -B scripts/ci/preparation_static_release_wrapper_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-render-offline-plans
          path: ${{ runner.temp }}/render-review/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Isolated Chromium and WebKit (no server account)
        env:
          PREPARATION_VECTOR_PATH: ${{ runner.temp }}/vectors.json
          PREPARATION_SCREENSHOTS: ${{ runner.temp }}/preparation-screenshots
        run: |
          npm install --prefix "$RUNNER_TEMP/static-browser" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          ln -s "$RUNNER_TEMP/static-browser/node_modules" node_modules
          "$RUNNER_TEMP/static-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          PREPARATION_DIRECTORY="$RUNNER_TEMP/preparation-one" BROWSER_ENGINE=chromium node tests/browser/preparation_static.mjs
          PREPARATION_DIRECTORY="$RUNNER_TEMP/preparation-one" BROWSER_ENGINE=webkit node tests/browser/preparation_static.mjs
          PREPARATION_DIRECTORY="$RUNNER_TEMP/preparation-C" BROWSER_ENGINE=chromium node tests/browser/preparation_static.mjs
          PREPARATION_DIRECTORY="$RUNNER_TEMP/preparation-C" BROWSER_ENGINE=webkit node tests/browser/preparation_static.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-synthetic-screenshots
          path: ${{ runner.temp }}/preparation-screenshots
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-static-B-C-candidates
          path: |
            ${{ runner.temp }}/preparation-one.zip
            ${{ runner.temp }}/preparation-C.zip
          retention-days: 7
      - run: test -z "$(git status --porcelain)"
