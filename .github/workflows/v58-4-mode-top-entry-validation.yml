name: V58.4 Specialized Mode Top Entry Validation

on:
  push:
    branches:
      - feature/v58-4-mode-top-entry-routing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/HomeController.php
          php -l app/Http/Controllers/WorkspaceModeController.php
          php -l routes/web.php
          php -l tests/Feature/SpecializedModeTopEntryV584Test.php
          php -l tests/Feature/WorkspaceModeBarV541Test.php
          php -l tests/Feature/WorkspaceModePersistenceV542Test.php
          php -l tests/Feature/DevelopmentWorkspaceV544Test.php
          php -l tests/Feature/WorkspaceResumeAndSessionScopeV5612Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.4 dedicated contract
        run: php artisan test tests/Feature/SpecializedModeTopEntryV584Test.php
      - name: Workspace mode entry regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePersistenceV542Test.php tests/Feature/MobileWorkspaceModeEntryV566Test.php
      - name: Specialized workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/SpecializedWorkspaceTopsV582Test.php tests/Feature/StudyWorkspaceFocusedSurfacesV583Test.php
      - name: Workspace resume regression
        run: php artisan test tests/Feature/WorkspaceResumeAndSessionScopeV5612Test.php
