name: V53.6 Validate

on:
  push:
    branches:
      - feature/v53-6-adaptive-action

jobs:
  adaptive-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V53.6 PHP
        run: find app/Intelligence app/Http/Controllers/StudyAdaptiveActionController.php app/Services/StudyAdaptiveHomeActionService.php app/Models/IntelligenceActionProjection.php database/migrations/2026_10_04_000500_create_intelligence_action_projections_table.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade views
        run: php artisan view:cache

      - name: V53.0 contract regression
        run: php artisan test tests/Unit/IntelligenceContractV530Test.php

      - name: V53.1 State / Evidence regression
        run: php artisan test tests/Feature/IntelligenceStateEvidenceV531Test.php

      - name: V53.2 Decision / Readiness regression
        run: php artisan test tests/Feature/IntelligenceDecisionReadinessV532Test.php

      - name: V53.3 Reasoning Router regression
        run: php artisan test tests/Feature/IntelligenceReasoningRouterV533Test.php

      - name: V53.4 Study Scope regression
        run: php artisan test tests/Feature/StudyScopeCaptureV534Test.php

      - name: V53.5 Study Intelligence regression
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php

      - name: V53.6 Adaptive Action
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php

      - name: Home Action regression
        run: php artisan test tests/Feature/ActionFirstV416Test.php tests/Feature/DashboardGuidanceV395Test.php

      - name: Study Practice calibration regression
        run: php artisan test tests/Feature/StudyPracticeCalibrationV414Test.php

      - name: Study Practice loop regression
        run: php artisan test tests/Feature/StudyPracticeLearningLoopV393Test.php

      - name: Study Recall regression
        run: php artisan test tests/Feature/StudyRecallV4111Test.php

      - name: Feature Access regression
        run: php artisan test tests/Feature/FeatureAccessV406Test.php

      - name: Native AI regression
        run: php artisan test tests/Feature/NativeAiPracticeV418Test.php
