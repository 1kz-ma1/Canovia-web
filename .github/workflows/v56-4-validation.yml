name: V56.4 Study Routing Validation

on:
  push:
    branches:
      - feature/v56-4-study-routing-mastery-cooldown

jobs:
  study-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/StudyTopicTaxonomyService.php
          php -l app/Services/StudyPracticeRoutingPolicyService.php
          php -l app/Services/StudyWeaknessPrioritizationService.php
          php -l app/Services/StudyExamConvergencePolicyService.php
          php -l app/Services/StudyTaskProgressionService.php
          php -l app/Services/StudyPracticeStrategyService.php
          php -l app/Services/QuestionBankStudyPracticeQuestionProvider.php
          php -l app/Services/StudyPracticePromptService.php
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l config/study.php
          php -l tests/Feature/StudyPracticeRoutingV564Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V56.4 routing
        run: php artisan test tests/Feature/StudyPracticeRoutingV564Test.php
      - name: V56.0 convergence
        run: php artisan test tests/Feature/StudyExamConvergencePolicyV560Test.php
      - name: V41.4 weakness priority
        run: php artisan test tests/Feature/StudyPracticeCalibrationV414Test.php
      - name: V56.3 exposure rotation
        run: php artisan test tests/Feature/QuestionExposureRotationV563Test.php
      - name: V56.2 official pack
        run: php artisan test tests/Feature/IpaOfficialQuestionPackV562Test.php
      - name: Question Bank
        run: php artisan test tests/Feature/QuestionBankV402Test.php
      - name: Hybrid
        run: php artisan test tests/Feature/HybridQuestionAssemblyV4182Test.php
      - name: Native AI Practice
        run: php artisan test tests/Feature/NativeAiPracticeV418Test.php
      - name: Task progression
        run: php artisan test tests/Feature/StudyTaskProgressionV4110Test.php
