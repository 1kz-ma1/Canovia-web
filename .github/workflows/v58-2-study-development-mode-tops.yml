name: V58.2 Study Developer Mode Tops Validation

on:
  push:
    branches:
      - feature/v58-2-study-development-mode-tops
  pull_request:
    branches:
      - main

jobs:
  mode-tops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/StudyWorkspaceTopController.php
          php -l app/Http/Controllers/DevelopmentWorkspaceTopController.php
          php -l app/Services/SpecializedWorkspaceTopService.php
          php -l tests/Feature/SpecializedWorkspaceTopsV582Test.php
          php -l tests/Feature/StudyWorkspaceV543Test.php
          php -l tests/Feature/DevelopmentWorkspaceV544Test.php
          php -l tests/Feature/DeveloperNavigationIAV581Test.php
          php -l routes/web.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.2 mode tops
        run: php artisan test tests/Feature/SpecializedWorkspaceTopsV582Test.php
      - name: Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php tests/Feature/StudyStateFirstWorkspaceV5613Test.php
      - name: Developer Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/DeveloperWorkspaceSurfacesV580Test.php tests/Feature/DeveloperNavigationIAV581Test.php
      - name: Developer implementation chain regression
        run: php artisan test tests/Feature/DeveloperImplementationBriefV576Test.php tests/Feature/DeveloperProviderTriageV577Test.php tests/Feature/DeveloperCodingAgentHandoffV578Test.php
      - name: Workspace Mode regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePersistenceV542Test.php tests/Feature/WorkspaceModeOnboardingV547Test.php tests/Feature/MobileWorkspaceModeEntryV566Test.php
      - name: Desktop shell regression
        run: php artisan test tests/Feature/DesktopHeaderDensityV579Test.php
