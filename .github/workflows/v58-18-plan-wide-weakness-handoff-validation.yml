name: V58.18 Plan-wide Weakness Handoff Validation

on:
  push:
    branches:
      - feature/v58-18-plan-wide-weakness-handoff

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Intelligence/Study/ApSubjectACoverageDashboardService.php
          php -l app/Services/ApSubjectAPlanWideWeaknessHandoffService.php
          php -l app/Services/StudyPracticeOrchestrator.php
          php -l app/Services/StudyPracticeStrategyService.php
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l tests/Feature/PlanWideWeaknessHandoffV5818Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.18 dedicated Plan-wide weakness handoff contract
        run: php artisan test tests/Feature/PlanWideWeaknessHandoffV5818Test.php
      - name: V58.16 AP coverage regression
        run: php artisan test tests/Feature/ApSubjectACoverageDashboardV5816Test.php
      - name: V58.17 cumulative checkpoint regression
        run: php artisan test tests/Feature/StudyPracticeCumulativeCheckpointV5817Test.php
      - name: V56.0 Study Exam Convergence regression
        run: php artisan test tests/Feature/StudyExamConvergencePolicyV560Test.php
      - name: V56.3 Question exposure rotation regression
        run: php artisan test tests/Feature/QuestionExposureRotationV563Test.php
      - name: V56.4 Study Practice routing regression
        run: php artisan test tests/Feature/StudyPracticeRoutingV564Test.php
      - name: V56.5 Practice resume fast path regression
        run: php artisan test tests/Feature/StudyPracticeResumeFastPathV565Test.php
      - name: V40.1 Study Practice orchestration regression
        run: php artisan test tests/Feature/StudyPracticeOrchestrationV401Test.php
