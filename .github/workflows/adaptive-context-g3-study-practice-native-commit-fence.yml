name: Adaptive Context G3 Study Practice Native Commit Fence

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/StudyPracticeNativeCommitFence.php'
      - 'app/Services/StudyPracticeOrchestrator.php'
      - 'app/Http/Controllers/StudyPracticeController.php'
      - 'tests/Feature/StudyPracticeNativeCommitFenceG3Test.php'
      - '.github/workflows/adaptive-context-g3-study-practice-native-commit-fence.yml'

jobs:
  study-practice-native-source-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/StudyPracticeNativeCommitFence.php
          php -l app/Services/StudyPracticeOrchestrator.php
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l tests/Feature/StudyPracticeNativeCommitFenceG3Test.php
      - name: Native study post-provider stale source tests
        run: php artisan test tests/Feature/StudyPracticeNativeCommitFenceG3Test.php
      - name: Existing Native AI and study regression
        run: |
          php artisan test \
            tests/Feature/NativeAiPracticeV418Test.php \
            tests/Feature/HybridQuestionAssemblyV4182Test.php \
            tests/Feature/StudyPracticeOrchestrationV401Test.php \
            tests/Feature/StudyPracticeDraftPersistenceV4071Test.php \
            tests/Feature/NativeAiPurposeGrantFenceV05Test.php
