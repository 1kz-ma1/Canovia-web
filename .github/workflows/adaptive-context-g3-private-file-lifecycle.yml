name: Adaptive Context G3 Private File Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/PrivateFileLifecycleService.php'
      - 'app/Services/AccountDeletionService.php'
      - 'app/Http/Controllers/PlanController.php'
      - 'tests/Feature/PrivateFileLifecycleG3Test.php'
      - 'tests/Feature/IosSoftLaunchWebReadinessV561Test.php'
      - 'tests/Feature/SafePlanResourceRecallHandoffV5811Test.php'
      - '.github/workflows/adaptive-context-g3-private-file-lifecycle.yml'

jobs:
  private-file-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canovia_file_cleanup
          POSTGRES_USER: canovia_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canovia_ci -d canovia_file_cleanup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: canovia_file_cleanup
      DB_USERNAME: canovia_ci
      DB_PASSWORD: local_ci_only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/PrivateFileLifecycleService.php
          php -l app/Services/AccountDeletionService.php
          php -l app/Http/Controllers/PlanController.php
          php -l tests/Feature/PrivateFileLifecycleG3Test.php
          php -l tests/Feature/IosSoftLaunchWebReadinessV561Test.php
          php -l tests/Feature/SafePlanResourceRecallHandoffV5811Test.php
      - name: G3 Plan and account private file lifecycle, retained Inbox and rollback
        run: php artisan test tests/Feature/PrivateFileLifecycleG3Test.php --stop-on-failure
      - name: Existing account deletion and resource private file recovery on SQLite
        # These legacy suites use RefreshDatabase's nested/rolled-back
        # transaction, so afterCommit deliberately preserves source bytes.
        # Run them under their original SQLite driver; actual post-commit
        # physical unlink is covered by the PG16 test above.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
        run: php artisan test tests/Feature/IosSoftLaunchWebReadinessV561Test.php tests/Feature/SafePlanResourceRecallHandoffV5811Test.php --stop-on-failure
