name: Adaptive Context G3 Private File Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/PrivateFileLifecycleService.php'
      - 'app/Services/PrivateFilePathFenceService.php'
      - 'app/Services/PrivateFileUploadService.php'
      - 'app/Services/PrivateFileUploadIntentService.php'
      - 'app/Services/PrivateFileUploadReconciliationPreviewService.php'
      - 'app/Services/PrivateFileReconciliationSnapshotService.php'
      - 'app/Services/PrivateFileGenerationContractService.php'
      - 'app/Services/PrivateFileGenerationEvidenceService.php'
      - 'app/Services/PrivateFileWriteReceiptHandoffService.php'
      - 'app/Services/PrivateFileSyntheticCrashMatrixService.php'
      - 'tests/Feature/PrivateFileSyntheticCrashMatrixG3Test.php'
      - 'tests/Feature/PrivateFileWriteReceiptHandoffG3Test.php'
      - 'database/migrations/2026_10_14_140000_create_private_file_generation_evidence.php'
      - 'tests/Feature/PrivateFileGenerationEvidenceG3Test.php'
      - 'tests/Feature/PrivateFileGenerationContractG3Test.php'
      - 'tests/Feature/PrivateFileUploadConsistencyProbeG3Test.php'
      - 'tests/Feature/PrivateFileUploadReconciliationPreviewG3Test.php'
      - 'database/migrations/2026_10_14_130000_create_private_file_upload_intents.php'
      - 'tests/Feature/PrivateFileUploadIntentG3Test.php'
      - 'app/Http/Controllers/InboxController.php'
      - 'app/Http/Controllers/StudyRecallCandidateController.php'
      - 'tests/Feature/PrivateFileUploadG3Test.php'
      - 'tests/Feature/InboxUploadPathFenceG3Test.php'
      - 'tests/Feature/StudyScopeCaptureV534Test.php'
      - 'tests/Feature/StudyRecallBatchIngestV588Test.php'
      - 'tests/Feature/StudyRecallCandidateV4112Test.php'
      - 'app/Services/InboxRecallMaterialTransferGuard.php'
      - 'config/canovia.php'
      - 'database/migrations/2026_10_14_120000_create_private_file_path_fences.php'
      - 'tests/Feature/PrivateFilePathFenceG3Test.php'
      - 'tests/Feature/InboxRecallMaterialTransferG3Test.php'
      - 'app/Services/PrivateFileCleanupHealthService.php'
      - 'tests/Feature/PrivateFileCleanupHealthG3Test.php'
      - 'app/Http/Controllers/StudyScopeCaptureController.php'
      - 'database/migrations/2026_10_14_100000_create_private_file_cleanup_entries.php'
      - 'tests/Feature/PrivateFileCleanupOutboxG3Test.php'
      - 'routes/console.php'
      - 'app/Services/AccountDeletionService.php'
      - 'app/Http/Controllers/PlanController.php'
      - 'app/Http/Controllers/CareerWorkspaceController.php'
      - 'tests/Feature/PrivateFileLifecycleG3Test.php'
      - 'tests/Feature/IosSoftLaunchWebReadinessV561Test.php'
      - 'tests/Feature/SafePlanResourceRecallHandoffV5811Test.php'
      - '.github/workflows/adaptive-context-g3-private-file-lifecycle.yml'

jobs:
  private-file-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canovia_file_cleanup
          POSTGRES_USER: canovia_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canovia_ci -d canovia_file_cleanup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: canovia_file_cleanup
      DB_USERNAME: canovia_ci
      DB_PASSWORD: local_ci_only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/PrivateFileLifecycleService.php
          php -l app/Services/PrivateFilePathFenceService.php
          php -l app/Services/PrivateFileUploadService.php
          php -l app/Services/PrivateFileUploadIntentService.php
          php -l app/Services/PrivateFileUploadReconciliationPreviewService.php
          php -l app/Services/PrivateFileReconciliationSnapshotService.php
          php -l app/Services/PrivateFileGenerationContractService.php
          php -l app/Services/PrivateFileGenerationEvidenceService.php
          php -l app/Services/PrivateFileWriteReceiptHandoffService.php
          php -l app/Services/PrivateFileSyntheticCrashMatrixService.php
          php -l tests/Feature/PrivateFileSyntheticCrashMatrixG3Test.php
          php -l tests/Feature/PrivateFileWriteReceiptHandoffG3Test.php
          php -l database/migrations/2026_10_14_140000_create_private_file_generation_evidence.php
          php -l tests/Feature/PrivateFileGenerationEvidenceG3Test.php
          php -l tests/Feature/PrivateFileGenerationContractG3Test.php
          php -l tests/Feature/PrivateFileUploadConsistencyProbeG3Test.php
          php -l tests/Feature/PrivateFileUploadReconciliationPreviewG3Test.php
          php -l database/migrations/2026_10_14_130000_create_private_file_upload_intents.php
          php -l tests/Feature/PrivateFileUploadIntentG3Test.php
          php -l app/Http/Controllers/InboxController.php
          php -l app/Http/Controllers/StudyRecallCandidateController.php
          php -l tests/Feature/PrivateFileUploadG3Test.php
          php -l tests/Feature/InboxUploadPathFenceG3Test.php
          php -l tests/Feature/StudyScopeCaptureV534Test.php
          php -l tests/Feature/StudyRecallBatchIngestV588Test.php
          php -l tests/Feature/StudyRecallCandidateV4112Test.php
          php -l app/Services/InboxRecallMaterialTransferGuard.php
          php -l config/canovia.php
          php -l database/migrations/2026_10_14_120000_create_private_file_path_fences.php
          php -l tests/Feature/PrivateFilePathFenceG3Test.php
          php -l tests/Feature/InboxRecallMaterialTransferG3Test.php
          php -l app/Services/PrivateFileCleanupHealthService.php
          php -l tests/Feature/PrivateFileCleanupHealthG3Test.php
          php -l app/Http/Controllers/StudyScopeCaptureController.php
          php -l database/migrations/2026_10_14_100000_create_private_file_cleanup_entries.php
          php -l tests/Feature/PrivateFileCleanupOutboxG3Test.php
          php -l routes/console.php
          php -l app/Services/AccountDeletionService.php
          php -l app/Http/Controllers/PlanController.php
          php -l app/Http/Controllers/CareerWorkspaceController.php
          php -l tests/Feature/PrivateFileLifecycleG3Test.php
          php -l tests/Feature/IosSoftLaunchWebReadinessV561Test.php
          php -l tests/Feature/SafePlanResourceRecallHandoffV5811Test.php
      - name: G3 private file lifecycle and durable retry outbox on PostgreSQL 16
        run: php artisan test tests/Feature/PrivateFileLifecycleG3Test.php tests/Feature/PrivateFileCleanupOutboxG3Test.php tests/Feature/PrivateFileCleanupHealthG3Test.php tests/Feature/PrivateFilePathFenceG3Test.php tests/Feature/InboxRecallMaterialTransferG3Test.php tests/Feature/PrivateFileUploadG3Test.php tests/Feature/PrivateFileUploadIntentG3Test.php tests/Feature/PrivateFileUploadReconciliationPreviewG3Test.php tests/Feature/PrivateFileUploadConsistencyProbeG3Test.php tests/Feature/PrivateFileGenerationContractG3Test.php tests/Feature/InboxUploadPathFenceG3Test.php tests/Feature/StudyScopeCaptureV534Test.php tests/Feature/StudyRecallBatchIngestV588Test.php tests/Feature/StudyRecallCandidateV4112Test.php --stop-on-failure
      - name: G3 opt-in Resource Recall route regression in isolated PHP process
        run: php artisan test tests/Feature/SafePlanResourceRecallHandoffV5811Test.php --stop-on-failure
      - name: G3 R17 synthetic generation evidence in isolated PHP process
        run: php artisan test tests/Feature/PrivateFileGenerationEvidenceG3Test.php --stop-on-failure
      - name: G3 R18 synthetic receipt handoff in isolated PHP process
        run: php artisan test tests/Feature/PrivateFileWriteReceiptHandoffG3Test.php --stop-on-failure
      - name: G3 R19 synthetic crash matrix in isolated final PHP process
        run: php artisan test tests/Feature/PrivateFileSyntheticCrashMatrixG3Test.php --stop-on-failure
      - name: G3 operator-only CLI dry-run and read-only health are available
        run: |
          php artisan canovia:retry-private-file-cleanup --dry-run
          # Prior fixture deliberately leaves a quarantined entry. The read-only
          # smoke validates schema/report availability; dedicated feature tests
          # assert strict exit=2 for that exact attention state.
          php artisan canovia:private-file-cleanup-health --json
          php artisan canovia:private-upload-intent-health --json
          # Operator contract is OFF by default; the deny is intentional.
          if php artisan canovia:private-file-generation-evidence-health --json; then
            echo 'R17 synthetic evidence must be disabled by default' >&2; exit 1;
          fi
          if php artisan canovia:private-file-generation-contract --json; then
            echo 'R16 generation contract must remain disabled by default' >&2; exit 1;
          fi
          # Default preview is OFF; verify it cannot inspect keys.
          if php artisan canovia:private-upload-reconcile-preview --json; then
            echo 'R14 preview must be disabled in CI by default' >&2; exit 1;
          fi
