name: V53.8 Validate

on:
  push:
    branches:
      - feature/v53-8-developer-readiness

jobs:
  developer-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V53.8 PHP
        run: find app/Intelligence/Development app/Intelligence/Data/DevelopmentIntelligenceResult.php app/Intelligence/Data/DevelopmentAdaptiveActionResult.php app/Http/Controllers/DevelopmentReadinessController.php app/Services/DevelopmentQualityGateService.php app/Jobs/ProcessGitHubWebhookDelivery.php app/Http/Controllers/ExecutionGitHubHandoffController.php app/Http/Controllers/GitHubWorkflowController.php app/Intelligence/Adapters/TaskEvidenceAdapter.php app/Intelligence/Services/DecisionTraceStore.php app/Intelligence/Services/ActionProjectionStore.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade
        run: php artisan view:cache

      - name: V53.8 Developer Readiness
        run: php artisan test tests/Feature/DeveloperReadinessV538Test.php

      - name: V53.7 Developer Evidence regression
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php

      - name: V46.7 GitHub Return regression
        run: php artisan test tests/Feature/GitHubReturnEvidenceV467Test.php

      - name: V46.8 GitHub Evidence Decision regression
        run: php artisan test tests/Feature/GitHubEvidenceDecisionV468Test.php

      - name: V46.10 GitHub Webhook regression
        run: php artisan test tests/Feature/GitHubWebhookReturnSyncV4610Test.php

      - name: V46.0 GitHub Workflow regression
        run: php artisan test tests/Feature/GitHubWorkflowHubV460Test.php

      - name: V53.0 Intelligence contract regression
        run: php artisan test tests/Unit/IntelligenceContractV530Test.php

      - name: V53.5 Study Intelligence regression
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php

      - name: V53.6 Adaptive Action regression
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php

      - name: Feature Access regression
        run: php artisan test tests/Feature/FeatureAccessV406Test.php
