        run: php artisan test tests/Feature/CapabilityActivationV5826Test.php
      - name: V58.27 Living Profile
        run: php artisan test tests/Feature/LivingProfileV5827Test.php
      - name: V58.28 Study Behavior Personalization
        run: php artisan test tests/Feature/StudyBehaviorPersonalizationV5828Test.php
      - name: V58.29 Plan Lifecycle Personalization
        run: php artisan test tests/Feature/PlanLifecyclePersonalizationV5829Test.php
      - name: V58.30 Plan Completion Fingerprint
        run: php artisan test tests/Feature/PlanCompletionFingerprintV5830Test.php
      - name: V58.31 Return After Absence
        run: php artisan test tests/Feature/ReturnAfterAbsencePersonalizationV5831Test.php
      - name: V58.32 Candidate Evidence Reopen
        run: php artisan test tests/Feature/CandidateEvidenceReopenV5832Test.php
      - name: V58.33 Study Review Cycle Personalization
        run: php artisan test tests/Feature/StudyReviewCyclePersonalizationV5833Test.php
      - name: V58.34 Long Usage Window Personalization
        run: php artisan test tests/Feature/LongUsageWindowPersonalizationV5834Test.php
      - name: Home continuity regression
        run: php artisan test tests/Feature/ModelReuseV5195Test.php tests/Feature/HomeCoreBundleCostReductionV5192Test.php
      - name: Specialized Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/DeveloperHomeV573Test.php tests/Feature/OverviewWorkspaceV545Test.php tests/Feature/CareerWorkspaceModeV551Test.php tests/Feature/CareerExplorationEntryV5860Test.php
      - name: V58.65 Overview Relevance
        run: php artisan test tests/Feature/OverviewRelevanceV5865Test.php tests/Feature/OfficialExamScopeAwareStudyV5864Test.php
      - name: V58.63 Legacy Creative Development Rescue
        run: php artisan test tests/Feature/DevelopmentCreativePlanRescueV5863Test.php tests/Feature/WorkspaceModeResolverV540Test.php
      - name: V58.69 Team Task Dependencies
        run: php artisan test tests/Feature/DevelopmentTeamTaskDependencyV5869Test.php tests/Feature/DeveloperWorkspaceSurfacesV580Test.php tests/Feature/DevelopmentCreativePlanRescueV5863Test.php
      - name: V58.74 Owner-approved Sequential Action Draft
        run: php artisan test tests/Feature/PlanActionDraftV5874Test.php tests/Feature/PlanActionDraftV5873Test.php tests/Feature/PlanActionDraftV5872Test.php tests/Feature/PlanActionDraftV5871Test.php
      - name: V58.73 Typed Evidence and Domain-aware Plan Draft
        run: php artisan test tests/Feature/PlanActionDraftV5873Test.php tests/Feature/PlanActionDraftV5872Test.php tests/Feature/PlanActionDraftV5871Test.php
      - name: V58.72 Multi-evidence Draft and Revision Diff
        run: php artisan test tests/Feature/PlanActionDraftV5872Test.php tests/Feature/PlanActionDraftV5871Test.php
      - name: V58.71 Action-grounded Draft and Owner Approval
        run: php artisan test tests/Feature/PlanActionDraftV5871Test.php tests/Feature/PlanActionFirstCreationV5866Test.php
      - name: V58.70 Plan Specialization Domain and Ownership
        run: php artisan test tests/Feature/PlanSpecializationOverrideV5870Test.php tests/Feature/PlanDomainOverrideV5868Test.php tests/Feature/PlanIntentClassificationV5867Test.php
      - name: V58.66 Action-first Plan Creation
        run: php artisan test tests/Feature/PlanDomainOverrideV5868Test.php tests/Feature/PlanIntentClassificationV5867Test.php tests/Feature/PlanActionFirstCreationV5866Test.php tests/Feature/MutationIdempotencyV390Test.php tests/Feature/PlanVisualPreferencesTest.php tests/Feature/GoalContextFoundationV4114Test.php tests/Feature/WorkspaceModeOnboardingV547Test.php tests/Feature/PublicBetaPolishV16Test.php tests/Feature/AdaptiveGoalDiscoveryV4114Test.php
