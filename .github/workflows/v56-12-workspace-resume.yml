name: V56.12 Workspace Resume Validation

on:
  push:
    branches:
      - fix/v56-12-workspace-resume-and-session-scope
      - production
  pull_request:
    branches:
      - main
      - production

# Only superseded main-target PR runs may be cancelled.
# Production pushes and production PRs use unique run IDs, so they cannot
# cancel or replace a pending release validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.base_ref == 'main' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

jobs:
  workspace-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Learning one-question pager client regression
        run: node --test tests/js/study-practice-one-question.test.mjs
      - name: Learning session draft autosave client regression
        run: node --test tests/js/learning-answer-autosave.test.mjs
      - name: PHP lint
