name: V56.12 Workspace Resume Validation

on:
  push:
    branches:
      - fix/v56-12-workspace-resume-and-session-scope
  pull_request:
    branches:
      - main

jobs:
  workspace-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/HomeController.php
          php -l app/Services/ContinuityService.php
          php -l tests/Feature/WorkspaceResumeAndSessionScopeV5612Test.php
          php -l tests/Feature/WorkspaceModePersistenceV542Test.php
          php -l tests/Feature/ReleaseLevelFoundationV5820Test.php
          php -l app/Services/ReleaseGateService.php
          php -l app/Http/Controllers/AdminReleaseGateController.php
          php -l tests/Feature/ReleaseGateInventoryV5821Test.php
          php -l app/Http/Controllers/ProductPreviewController.php
          php -l tests/Feature/ProductPreviewV5822Test.php
          php -l app/Services/EarlyAccessService.php
          php -l app/Services/EarlyAccessTelemetryService.php
          php -l app/Services/EarlyAccessInsightsService.php
          php -l app/Http/Controllers/AdminEarlyAccessController.php
          php -l app/Http/Middleware/TrackEarlyAccessVisit.php
          php -l tests/Feature/EarlyAccessObservabilityV5823Test.php
          php -l app/Models/ReleaseReviewCheck.php
          php -l app/Services/ReleaseReviewService.php
          php -l tests/Feature/ReleaseReviewV5824Test.php
          php -l database/migrations/2026_10_07_010000_create_release_review_checks_table.php
          php -l app/Http/Controllers/PersonalizationController.php
          php -l app/Services/PersonalizationContextService.php
          php -l app/Services/PersonalizationBootstrapService.php
          php -l app/Models/UserPersonalizationContext.php
          php -l tests/Feature/PersonalizationBootstrapV5825Test.php
          php -l database/migrations/2026_10_07_020000_create_user_personalization_contexts_table.php
          php -l app/Services/CapabilityActivationService.php
          php -l app/Http/Controllers/CapabilityActivationController.php
          php -l tests/Feature/CapabilityActivationV5826Test.php
          php -l app/Services/PersonalizationLivingProfileService.php
          php -l app/Http/Controllers/PersonalizationContextUpdateController.php
          php -l tests/Feature/LivingProfileV5827Test.php
          php -l app/Services/StudyBehaviorPersonalizationAdapter.php
          php -l tests/Feature/StudyBehaviorPersonalizationV5828Test.php
          php -l app/Services/PlanLifecyclePersonalizationAdapter.php
          php -l tests/Feature/PlanLifecyclePersonalizationV5829Test.php
          php -l app/Services/PlanCompletionFingerprintService.php
          php -l tests/Feature/PlanCompletionFingerprintV5830Test.php
          php -l app/Services/ReturnAfterAbsencePersonalizationAdapter.php
          php -l tests/Feature/ReturnAfterAbsencePersonalizationV5831Test.php
          php -l app/Services/DevelopmentPersonalizationSignalService.php
          php -l tests/Feature/CandidateEvidenceReopenV5832Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V56.12 workspace resume and session scope
        run: php artisan test tests/Feature/WorkspaceResumeAndSessionScopeV5612Test.php
      - name: V54.2 Workspace persistence regression
        run: php artisan test tests/Feature/WorkspaceModePersistenceV542Test.php
      - name: V58.20 Release Level foundation
        run: php artisan test tests/Feature/ReleaseLevelFoundationV5820Test.php
      - name: V58.21 Release Gate inventory
        run: php artisan test tests/Feature/ReleaseGateInventoryV5821Test.php
      - name: V58.22 Product Preview
        run: php artisan test tests/Feature/ProductPreviewV5822Test.php
      - name: V58.23 Early Access observability
        run: php artisan test tests/Feature/EarlyAccessObservabilityV5823Test.php
      - name: V58.24 Release Review
        run: php artisan test tests/Feature/ReleaseReviewV5824Test.php
      - name: V58.25 Personalization Bootstrap
        run: php artisan test tests/Feature/PersonalizationBootstrapV5825Test.php tests/Feature/FirstRunUxV4123Test.php tests/Feature/ConversationalOnboardingV4116Test.php
      - name: V58.26 Capability Activation
        run: php artisan test tests/Feature/CapabilityActivationV5826Test.php
      - name: V58.27 Living Profile
        run: php artisan test tests/Feature/LivingProfileV5827Test.php
      - name: V58.28 Study Behavior Personalization
        run: php artisan test tests/Feature/StudyBehaviorPersonalizationV5828Test.php
      - name: V58.29 Plan Lifecycle Personalization
        run: php artisan test tests/Feature/PlanLifecyclePersonalizationV5829Test.php
      - name: V58.30 Plan Completion Fingerprint
        run: php artisan test tests/Feature/PlanCompletionFingerprintV5830Test.php
      - name: V58.31 Return After Absence
        run: php artisan test tests/Feature/ReturnAfterAbsencePersonalizationV5831Test.php
      - name: V58.32 Candidate Evidence Reopen
        run: php artisan test tests/Feature/CandidateEvidenceReopenV5832Test.php
      - name: Home continuity regression
        run: php artisan test tests/Feature/ModelReuseV5195Test.php tests/Feature/HomeCoreBundleCostReductionV5192Test.php
      - name: Specialized Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/OverviewWorkspaceV545Test.php tests/Feature/CareerWorkspaceModeV551Test.php
