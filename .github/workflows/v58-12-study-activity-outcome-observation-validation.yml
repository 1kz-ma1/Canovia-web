name: V58.12 Study Activity Outcome Observation Validation

on:
  push:
    branches:
      - feature/v58-12-study-activity-outcome-observation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Intelligence/Study/StudyActivityOutcomeObservationService.php
          php -l app/Http/Controllers/StudyActivityController.php
          php -l tests/Feature/StudyActivityOutcomeObservationV5812Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.12 dedicated Activity outcome observation
        run: php artisan test tests/Feature/StudyActivityOutcomeObservationV5812Test.php
      - name: V41.10 Activity Policy regression
        run: php artisan test tests/Feature/StudyActivityPolicyV4110Test.php
      - name: V56.15 Study Method Recommendation regression
        run: php artisan test tests/Feature/StudyMethodRecommendationV5615Test.php
      - name: V58.10 Study language Activity regression
        run: php artisan test tests/Feature/StudyLanguageActivitiesV5810Test.php
      - name: V58.6 Recall Task progression regression
        run: php artisan test tests/Feature/StudyRecallTaskProgressionV586Test.php
      - name: V53.5 Study Intelligence regression
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php
