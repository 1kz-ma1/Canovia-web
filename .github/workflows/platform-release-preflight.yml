name: Platform Release Preflight (Offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/platform_release_preflight.py'
      - 'scripts/ops/platform_render_binding_phase_gate.py'
      - 'scripts/ops/g3_provider_evidence_inventory.py'
      - 'scripts/ops/g3_provider_collection_plan.py'
      - 'scripts/ops/g3_disposable_approval_packet.py'
      - 'scripts/ops/g3_owner_scope_review.py'
      - 'scripts/ops/g3_exit_decision_audit.py'
      - 'scripts/ops/platform_backup_ciphertext_check.py'
      - 'scripts/ops/platform_branch_inventory.py'
      - 'scripts/ops/platform_ci_run_triage.py'
      - 'scripts/ops/platform_ci_runtime_report.py'
      - 'scripts/ops/platform_ci_supersession_report.py'
      - 'scripts/ops/platform_workspace_test_inventory.py'
      - 'scripts/ops/platform_workspace_repeat_context.py'
      - 'scripts/ops/platform_workspace_context_intent_matrix.py'
      - 'scripts/ops/platform_workspace_r22_decision_register.py'
      - 'scripts/ops/platform_workspace_r23_v5872_scope.py'
      - 'scripts/ci/platform_workspace_scenario_equivalence.py'
      - 'scripts/ci/platform_workspace_omission_shadow_r18.py'
      - 'scripts/ci/platform_workspace_r19_negative_controls.py'
      - 'scripts/ci/platform_workspace_r20_app_mutation.py'
      - 'scripts/ci/platform_workspace_r21_five_context_matrix.py'
      - 'scripts/ci/platform_workspace_r23_creative_rescue_shadow.py'
      - 'scripts/ops/platform_workflow_yaml_check.rb'
      - 'tests/ci/test_platform_release_preflight.py'
      - 'tests/ci/test_preparation_release_preflight.py'
      - 'tests/ci/test_platform_render_binding_phase_gate.py'
      - 'tests/ci/test_g3_provider_evidence_inventory.py'
      - 'tests/ci/test_g3_provider_collection_plan.py'
      - 'tests/ci/test_g3_disposable_approval_packet.py'
      - 'tests/ci/test_g3_owner_scope_review.py'
      - 'tests/ci/test_g3_exit_decision_audit.py'
      - 'docs/development/G3_EXIT_DECISION_R31_2026_10_14.md'
      - 'docs/development/G3_PROVIDER_AUTHORIZATION_DECISION_R40_2026_10_15.md'
      - 'docs/development/G3_OWNER_SCOPE_CHECKLIST_R30_2026_10_14.md'
      - 'docs/development/G3_DISPOSABLE_APPROVAL_PACKET_R29_2026_10_14.md'
      - 'docs/development/G3_PROVIDER_COLLECTION_PLAN_R28_2026_10_14.md'
      - 'docs/development/G3_PROVIDER_EVIDENCE_HANDOFF_R27_2026_10_14.md'
      - 'tests/ci/test_platform_backup_ciphertext_check.py'
      - 'tests/ci/test_platform_branch_inventory.py'
      - 'tests/ci/test_platform_ci_run_triage.py'
      - 'tests/ci/test_platform_ci_runtime_report.py'
      - 'tests/ci/test_platform_ci_supersession_report.py'
      - 'tests/ci/test_platform_workspace_parallel_php_lint.py'
      - 'tests/ci/test_platform_workspace_test_inventory.py'
      - 'tests/ci/test_platform_workspace_repeat_context.py'
      - 'tests/ci/test_platform_workspace_context_intent_matrix.py'
      - 'tests/ci/test_platform_workspace_r22_decision_register.py'
      - 'tests/ci/test_platform_workspace_r23_v5872_scope.py'
      - 'tests/ci/test_platform_workspace_scenario_equivalence.py'
      - 'tests/ci/test_platform_workspace_scenario_order.py'
      - 'tests/ci/test_platform_workspace_omission_shadow_r18.py'
      - 'tests/ci/test_platform_workspace_r19_negative_controls.py'
      - 'tests/ci/test_platform_workspace_r20_app_mutation.py'
      - 'tests/ci/test_platform_workspace_r21_five_context_matrix.py'
      - 'tests/ci/test_platform_workspace_r23_creative_rescue_shadow.py'
      - 'tests/ci/fixtures/workspace_php_lint_expected.txt'
      - 'tests/ci/test_platform_pr_ci_supersession_contract.py'
      - 'tests/ci/test_platform_workflow_yaml_check.py'
      - '.github/workflows/**'
      - 'docs/development/PLATFORM_RELEASE_BASELINE_AND_PREFLIGHT_2026_10_14.md'
      - 'docs/development/PLATFORM_CI_AND_BRANCH_TRIAGE_2026_10_14.md'
      - 'docs/development/PLATFORM_WORKSPACE_R19_NEGATIVE_CONTROLS_2026_10_15.md'
      - 'docs/development/PLATFORM_WORKSPACE_R20_APP_MUTATION_2026_10_15.md'
      - 'docs/development/PLATFORM_WORKSPACE_R22_DECISION_REGISTER_2026_10_15.md'
      - 'docs/development/PLATFORM_WORKSPACE_R23_CREATIVE_RESCUE_SHADOW_2026_10_15.md'
      - 'docs/development/PLATFORM_WORKSPACE_R23_V5872_SCOPE_2026_10_15.md'
      - 'docs/development/PLATFORM_WORKSPACE_R21_FIVE_CONTEXT_MATRIX_2026_10_15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight-tests:
    name: Platform release preflight offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse all GitHub Actions YAML without printing source content
        run: ruby scripts/ops/platform_workflow_yaml_check.rb .github/workflows/*.yml
      - name: Compile safe preflight
        run: python3 -m py_compile scripts/ops/platform_release_preflight.py tests/ci/test_platform_release_preflight.py scripts/ops/platform_render_binding_phase_gate.py tests/ci/test_platform_render_binding_phase_gate.py scripts/ops/g3_provider_evidence_inventory.py tests/ci/test_g3_provider_evidence_inventory.py scripts/ops/g3_provider_collection_plan.py tests/ci/test_g3_provider_collection_plan.py scripts/ops/g3_disposable_approval_packet.py tests/ci/test_g3_disposable_approval_packet.py scripts/ops/g3_owner_scope_review.py tests/ci/test_g3_owner_scope_review.py scripts/ops/g3_exit_decision_audit.py tests/ci/test_g3_exit_decision_audit.py scripts/ops/platform_backup_ciphertext_check.py tests/ci/test_platform_backup_ciphertext_check.py scripts/ops/platform_branch_inventory.py scripts/ops/platform_ci_run_triage.py scripts/ops/platform_ci_runtime_report.py scripts/ops/platform_ci_supersession_report.py scripts/ops/platform_workspace_test_inventory.py scripts/ops/platform_workspace_repeat_context.py scripts/ops/platform_workspace_context_intent_matrix.py tests/ci/test_platform_workspace_context_intent_matrix.py scripts/ops/platform_workspace_r22_decision_register.py tests/ci/test_platform_workspace_r22_decision_register.py scripts/ops/platform_workspace_r23_v5872_scope.py tests/ci/test_platform_workspace_r23_v5872_scope.py scripts/ci/platform_workspace_scenario_equivalence.py scripts/ci/platform_workspace_omission_shadow_r18.py scripts/ci/platform_workspace_r19_negative_controls.py scripts/ci/platform_workspace_r20_app_mutation.py scripts/ci/platform_workspace_r21_five_context_matrix.py scripts/ci/platform_workspace_r23_creative_rescue_shadow.py tests/ci/test_platform_workspace_r23_creative_rescue_shadow.py tests/ci/test_platform_workspace_r21_five_context_matrix.py tests/ci/test_platform_workspace_r20_app_mutation.py tests/ci/test_platform_workspace_omission_shadow_r18.py tests/ci/test_platform_workspace_r19_negative_controls.py tests/ci/test_platform_workspace_scenario_equivalence.py tests/ci/test_platform_workspace_scenario_order.py tests/ci/test_platform_workspace_test_inventory.py tests/ci/test_platform_workspace_repeat_context.py tests/ci/test_platform_ci_runtime_report.py tests/ci/test_platform_ci_supersession_report.py tests/ci/test_platform_workspace_parallel_php_lint.py tests/ci/test_platform_pr_ci_supersession_contract.py tests/ci/test_platform_branch_inventory.py tests/ci/test_platform_ci_run_triage.py

      - name: R31 pinned G3 source status must remain external-evidence HOLD
        run: |
          outcome=0
          python3 scripts/ops/g3_exit_decision_audit.py --repo . --sha "$(git rev-parse HEAD)" > "$RUNNER_TEMP/g3-r31-audit.json" || outcome=$?
          test "$outcome" -eq 2
          python3 -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"g3-r31-audit.json").read_text()); assert d["result"] == "HOLD_EXTERNAL_PROOF_REQUIRED", d["result"]; assert all(s == "SOURCE_PRESENT_UNATTESTED" for s in d["local_contracts"].values()); assert d["g3_exit_accepted"] is False and d["production_release_authorized"] is False'
      - name: Validate pinned candidate and fail-closed manual gates
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_platform_release_preflight.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_preparation_release_preflight.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_render_binding_phase_gate.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_g3_provider_evidence_inventory.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_g3_provider_collection_plan.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_g3_disposable_approval_packet.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_g3_owner_scope_review.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_g3_exit_decision_audit.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_backup_ciphertext_check.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_branch_inventory.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_ci_run_triage.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_ci_runtime_report.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_ci_supersession_report.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_parallel_php_lint.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_test_inventory.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_repeat_context.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_context_intent_matrix.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r22_decision_register.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r23_v5872_scope.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_scenario_equivalence.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_scenario_order.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_omission_shadow_r18.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r19_negative_controls.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r20_app_mutation.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r21_five_context_matrix.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workspace_r23_creative_rescue_shadow.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_pr_ci_supersession_contract.py' -v
          python3 -m unittest discover -s tests/ci -p 'test_platform_workflow_yaml_check.py' -v
