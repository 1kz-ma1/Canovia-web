name: V56.7 Action Home Map Entry Pause Validation

on:
  push:
    branches:
      - feature/v56-7-home-map-entry
  pull_request:
    branches:
      - main

jobs:
  action-home-map-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l tests/Feature/CanoviaHomeSurfaceV432Test.php
          php -l tests/Feature/CanoviaHomeSurfacePreferenceV433Test.php
          php -l tests/Feature/MapExplorationSurfaceV554Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: Home surface regression
        run: php artisan test tests/Feature/CanoviaHomeSurfaceV432Test.php
      - name: Legacy preference regression
        run: php artisan test tests/Feature/CanoviaHomeSurfacePreferenceV433Test.php
      - name: Map exploration regression
        run: php artisan test tests/Feature/MapExplorationSurfaceV554Test.php
      - name: Action Home regression
        run: php artisan test tests/Feature/ActionHomeV513Test.php
      - name: V56.6 Workspace entry regression
        run: php artisan test tests/Feature/MobileWorkspaceModeEntryV566Test.php
