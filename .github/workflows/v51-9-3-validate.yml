name: V51.9.3 temporary validation

on:
  push:
    branches:
      - feature/v51-9-3-db-roundtrip-reduction

permissions:
  contents: read

jobs:
  db-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.9.3 and performance regressions
        run: >
          php artisan test
          tests/Feature/DatabaseRoundtripReductionV5193Test.php
          tests/Feature/HomeCoreBundleCostReductionV5192Test.php
          tests/Feature/ServerCostReductionV5191Test.php
          tests/Feature/NavigationBottleneckRemovalV519Test.php
          tests/Feature/InteractionPerformanceV518Test.php
          tests/Feature/SharedCoreContextV4122Test.php
          tests/Feature/InstantNavigationV4120Test.php
          tests/Feature/InstantNavigationFragmentV4121Test.php
          tests/Feature/ExecutionWorkspaceModesV512Test.php
          tests/Feature/RecommendationServiceTest.php
          tests/Feature/PrimaryNavigationCompanionV510Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
