name: Learning V6.23 Syllabus Human Review Workbook

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learning-v623-review-workbook.yml'
      - 'app/Services/StudyOfficialSyllabusReviewWorkbookService.php'
      - 'app/Console/Commands/ExportStudyOfficialSyllabusReviewWorkbook.php'
      - 'tests/Feature/StudyOfficialSyllabusReviewWorkbookV623Test.php'
      - 'app/Services/StudyOfficialSyllabusReviewPacketService.php'
      - 'app/Services/StudyOfficialSyllabusReviewSubmissionService.php'
      - 'config/study_official_syllabus.php'
      - 'docs/development/LEARNING_OFFICIAL_SYLLABUS_REVIEW_WORKBOOK_V6_23_2026_10_15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-workbook-v623:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up disposable offline Laravel environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "NATIVE_AI_DRIVER=disabled" >> .env
          php artisan key:generate --force --no-interaction
          php -l app/Services/StudyOfficialSyllabusReviewWorkbookService.php
          php -l app/Console/Commands/ExportStudyOfficialSyllabusReviewWorkbook.php
          php -l tests/Feature/StudyOfficialSyllabusReviewWorkbookV623Test.php
      - name: V6.23 and prior official syllabus regressions
        run: |
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array \
          php artisan test \
            tests/Feature/StudyOfficialSyllabusReviewWorkbookV623Test.php \
            tests/Feature/StudyOfficialSyllabusReviewSubmissionV622Test.php \
            tests/Feature/StudyOfficialSyllabusReviewPacketV621Test.php \
            tests/Feature/StudyOfficialSyllabusBridgeV620Test.php \
            tests/Feature/StudyLearningBankTopicCoverageV619Test.php
      - name: Clarify proof limits
        run: |
          echo "Verified only: synthetic blank workbook, Question SHA, offline restrictions and V6.22 rejection."
          echo "NOT verified: actual human transcription, identities, independent rights check, expert approval, official mapping, public deployment or devices."
