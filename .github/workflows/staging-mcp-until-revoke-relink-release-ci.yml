name: Isolated staging MCP indefinite consent and identity relink release verification

on:
  pull_request:
    branches: [staging/mcp-until-revoke-relink-live-base-20261014]
    paths:
      - 'app/Http/Controllers/McpDelegatedRevocationController.php'
      - 'app/Http/Controllers/McpOAuthAccountLinkController.php'
      - 'app/Http/Controllers/McpOAuthPlanConsentController.php'
      - 'app/Models/McpLinkedSubject.php'
      - 'app/Services/McpDelegatedPlanAccessPolicy.php'
      - 'app/Services/McpDelegatedRevocationService.php'
      - 'app/Services/McpExplicitPlanConsentService.php'
      - 'app/Services/McpOAuthAccountLinkCommitter.php'
      - 'app/Services/McpStagingLoginPilotPolicy.php'
      - 'database/migrations/2026_10_14_000100_allow_nonexpiring_mcp_grants.php'
      - 'database/migrations/2026_10_14_000200_preserve_historical_mcp_identity_links.php'
      - 'resources/views/auth/partials/mcp-delegated-access-revocation.blade.php'
      - 'resources/views/auth/partials/mcp-plan-consent-confirmation.blade.php'
      - 'resources/views/auth/staging-pilot-account.blade.php'
      - 'resources/views/workspace/development/partials/mcp-plan-consent.blade.php'
      - 'tests/Feature/McpDelegatedRevocationTest.php'
      - 'tests/Feature/McpExplicitPlanConsentTest.php'
      - 'tests/Feature/McpOAuthAccountLinkTest.php'
      - 'tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php'
      - '.github/workflows/staging-mcp-until-revoke-relink-release-ci.yml'
      - 'docs/development/MCP_STAGING_INDEFINITE_CONSENT_RELINK_RELEASE_2026_10_14.md'

permissions:
  contents: read

jobs:
  scoped-stage-guide-and-auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Locked dependencies without scripts or plugins
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Remove the temporary Plan-read diagnostic from this release
        run: |
          test ! -f app/Services/McpStagingPlanReadDenialDiagnostic.php
          ! grep -Fq 'McpStagingPlanReadDenialDiagnostic' app/Services/McpDelegatedPlanAccessPolicy.php
          ! grep -Fq 'McpStagingPlanReadDenialDiagnostic' app/Services/McpReadOnlyContextTool.php
          ! grep -Fq 'mcp_stage_plan_read_denied' app/Services/McpDelegatedPlanAccessPolicy.php
      - name: PHP and UI template syntax
        run: |
          php -l app/Http/Controllers/McpOAuthAccountLinkController.php
          php -l app/Http/Controllers/McpOAuthPlanConsentController.php
          php -l tests/Feature/McpStagingOAuthFailureDiagnosticTest.php
          php -l tests/Feature/McpStagingPilotUiTest.php
          php -l tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php
          php -l app/Services/McpDelegatedPlanAccessPolicy.php
          php -l app/Services/McpReadOnlyContextTool.php
      - name: Assert independent consent and link isolation still fail closed
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan view:cache
          php artisan test \
            tests/Feature/McpStagingOAuthFailureDiagnosticTest.php \
            tests/Feature/McpOAuthAccountLinkTest.php \
            tests/Feature/McpStagingPilotUiTest.php \
            tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php \
            tests/Feature/McpStagingSyntheticReadPilotTest.php \
            tests/Feature/McpDelegatedPlanAccessPolicyTest.php \
            tests/Feature/McpReadOnlyResourceTest.php \
            tests/Feature/McpExplicitPlanConsentTest.php \
            tests/Feature/McpSyntheticOAuthConsentReadLifecycleTest.php \
            tests/Feature/McpAuth0SealedStagingWiringTest.php \
            --colors=never

  isolated-stage-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact release's isolated Docker image
        run: docker build --progress=plain -f Dockerfile.mcp-staging -t canovia-mcp-guide-release:check .
      - name: Verify stage-only Nginx and PHP-fpm configuration
        run: |
          docker run --rm --entrypoint sh canovia-mcp-guide-release:check -c \
            'cp docker/nginx-mcp-staging-synthetic-read-pilot.conf /etc/nginx/nginx.conf && nginx -t'
          docker run --rm --entrypoint php canovia-mcp-guide-release:check -l \
            /var/www/html/app/Services/McpDelegatedPlanAccessPolicy.php
          docker run --rm --entrypoint php canovia-mcp-guide-release:check -l \
            /var/www/html/app/Services/McpReadOnlyContextTool.php

  postgres-real-migrations-and-owner-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canovia_stage_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: canovia_stage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canovia_stage_ci -d canovia_stage_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: canovia_stage_ci
      DB_USERNAME: canovia_stage_ci
      DB_PASSWORD: ci-only-not-a-real-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Apply migrations twice on a real disposable PostgreSQL 17
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-interaction
      - name: Exercise history preserving identity transfer and indefinite-grant revocation on PostgreSQL
        run: |
          php artisan test tests/Feature/McpOAuthAccountLinkTest.php tests/Feature/McpDelegatedRevocationTest.php tests/Feature/McpExplicitPlanConsentTest.php --colors=never
