name: V53.2 Validate

on:
  push:
    branches:
      - feature/v53-2-decision-readiness-engine

jobs:
  decision-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V53.2 PHP
        run: find app/Intelligence app/Models/IntelligenceDecisionTrace.php database/migrations/2026_10_04_000200_create_intelligence_decision_traces_table.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: V53.0 contract regression
        run: php artisan test tests/Unit/IntelligenceContractV530Test.php

      - name: V53.1 state evidence regression
        run: php artisan test tests/Feature/IntelligenceStateEvidenceV531Test.php

      - name: V53.2 decision readiness test
        run: php artisan test tests/Feature/IntelligenceDecisionReadinessV532Test.php

      - name: Execution Evidence regression
        run: php artisan test tests/Feature/ExecutionEvidenceFoundationV410Test.php

      - name: Study Practice regression
        run: php artisan test tests/Feature/StudyPracticeLearningLoopV393Test.php

      - name: GitHub Evidence regression
        run: php artisan test tests/Feature/GitHubEvidenceDecisionV468Test.php
