name: V41.19 performance step2 validation

on:
  push:
    branches:
      - feature/v41-19-session-sw-home-performance

jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php -l app/Services/DashboardPresentationService.php
      - run: php -l config/session.php
      - run: php artisan test tests/Feature/PerformanceStep2V4119Test.php tests/Feature/NavigationPerformanceV4118Test.php tests/Feature/PerformanceObservabilityV4117Test.php tests/Feature/DashboardGuidanceV395Test.php tests/Feature/DashboardCalendarNavigationTest.php tests/Feature/LivingRoadmapAccountTest.php tests/Feature/RecommendationServiceTest.php
      - run: node --test tests/js/instant-start-v391.test.mjs

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t canovia-v4119 .
      - run: docker run --rm canovia-v4119 php -m | grep -i '^redis$'
