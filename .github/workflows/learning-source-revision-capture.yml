name: Learning Source Revision Capture

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/LearningContextSourceCaptureService.php'
      - 'tests/Feature/LearningContextSourceCaptureTest.php'
      - 'docs/development/LEARNING_CONTEXT_SOURCE_REVISION_V02_2026_10_15.md'
      - '.github/workflows/learning-source-revision-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies without app hooks
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Lint source revision capture and integration tests
        run: |
          php -l app/Services/LearningContextSourceCaptureService.php
          php -l tests/Feature/LearningContextSourceCaptureTest.php
      - name: Run isolated real-table capture, correction and privacy tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan test tests/Feature/LearningContextSourceCaptureTest.php tests/Unit/LearningContextChangeDetectionServiceTest.php --colors=never
