name: V55.8 Validate

on:
  push:
    branches:
      - feature/v55-8-activity-integration

jobs:
  activity-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V55.8 PHP
        run: |
          php -l app/Http/Controllers/ExecutionValidationProviderController.php
          php -l app/Services/TaskEvidenceExecutionActivityProjector.php
          php -l routes/web.php
          php -l tests/Feature/ExecutionActivityIntegrationV558Test.php

      - name: Compile Blade
        run: php artisan view:cache

      - name: V55.8 activity integration
        run: php artisan test tests/Feature/ExecutionActivityIntegrationV558Test.php

      - name: V55.7 execution setup regression
        run: php artisan test tests/Feature/ExecutionSetupValidationV557Test.php tests/Unit/ExecutionProviderValidationRegistryV557Test.php

      - name: V55.6 execution ecosystem regression
        run: php artisan test tests/Feature/ExecutionEcosystemFoundationV556Test.php tests/Unit/ExecutionProviderRegistryV556Test.php

      - name: V53.5 Study Intelligence regression
        run: php artisan test tests/Feature/StudyIntelligenceV535Test.php

      - name: V53.6 Study Adaptive Action regression
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php

      - name: V54.3 Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php

      - name: Future design boundary smoke check
        run: |
          test -f docs/future/README.md
          test -f docs/future/DEVELOPER_PRO_AI_DEVELOPMENT_ORCHESTRATION.md
          grep -q "Future Design" docs/future/README.md
          grep -q "not implemented by this document" docs/future/DEVELOPER_PRO_AI_DEVELOPMENT_ORCHESTRATION.md
          grep -q "Do not treat .docs/future/.* as implemented behavior" AGENTS.md
