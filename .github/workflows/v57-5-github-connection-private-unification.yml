name: V57.5 GitHub Connection Private Repository Validation

on:
  push:
    branches:
      - feature/v57-5-github-connection-private-unification
  pull_request:
    branches:
      - main

jobs:
  github-connection-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/DevelopmentWorkspaceController.php
          php -l app/Http/Controllers/GitHubWorkflowController.php
          php -l app/Services/ExecutionGitHubHandoffService.php
          php -l app/Services/GitHubIntegrationReadinessService.php
          php -l app/Services/GitHubRepositoryInspector.php
          php -l app/Services/GitHubRepositoryWriter.php
          php -l tests/Feature/GitHubConnectionPrivateRepositoryV575Test.php
          php -l tests/Feature/GitHubAppConnectionV465Test.php
          php -l tests/Feature/GitHubRepositoryInspectionV463Test.php
          php -l tests/Feature/GitHubIntegrationStabilizationV570Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V57.5 connection and Private Repository
        run: php artisan test tests/Feature/GitHubConnectionPrivateRepositoryV575Test.php
      - name: GitHub App connection regression
        run: php artisan test tests/Feature/GitHubAppConnectionV465Test.php
      - name: Public preview regression
        run: php artisan test tests/Feature/GitHubRepositoryInspectionV463Test.php
      - name: GitHub workflow and handoff regression
        run: php artisan test tests/Feature/GitHubWorkflowHubV460Test.php tests/Feature/ExecutionGitHubHandoffV466Test.php
      - name: GitHub stabilization regression
        run: php artisan test tests/Feature/GitHubIntegrationStabilizationV570Test.php
      - name: Developer V1 regression
        run: php artisan test tests/Feature/DeveloperActivityObservationV571Test.php tests/Feature/DeveloperTaskAssociationV572Test.php tests/Feature/DeveloperHomeV573Test.php tests/Feature/DeveloperExecutionContextV574Test.php
      - name: Development Evidence and Readiness regression
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php tests/Feature/DeveloperReadinessV538Test.php
