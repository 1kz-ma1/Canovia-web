name: MCP Auth0 Sealed Stage Wiring Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/McpAuth0SealedStagingWiringReadiness.php'
      - 'app/Services/McpStagingLoginPilotPolicy.php'
      - 'app/Services/McpExplicitPlanConsentService.php'
      - 'app/Http/Controllers/McpOAuthPlanConsentController.php'
      - 'app/Http/Controllers/McpOAuthAccountLinkController.php'
      - 'app/Http/Controllers/McpDelegatedRevocationController.php'
      - 'tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php'
      - 'app/Http/Middleware/EnsureMcpStagingSyntheticPilotActor.php'
      - 'app/Http/Middleware/CloseUnopenedMcpStaging.php'
      - 'tests/Feature/McpStagingLoginPilotPolicyTest.php'
      - 'tests/Feature/McpStagingPilotUiTest.php'
      - 'resources/views/auth/staging-pilot-shell.blade.php'
      - 'resources/views/auth/staging-pilot-login.blade.php'
      - 'resources/views/auth/staging-pilot-account.blade.php'
      - 'app/Http/Controllers/AuthController.php'
      - 'tests/Feature/McpIsolatedStagingBootstrapTest.php'
      - 'tests/Feature/McpAuth0SealedStagingWiringTest.php'
      - 'routes/console.php'
      - 'docker/mcp-staging-start.sh'
      - 'docker/render-start.sh'
      - '.github/workflows/mcp-auth0-sealed-wiring.yml'

permissions:
  contents: read

jobs:
  auth0-sealed-config:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Lint offline wiring paths
        run: |
          php -l app/Services/McpAuth0SealedStagingWiringReadiness.php
          php -l tests/Feature/McpAuth0SealedStagingWiringTest.php
          php -l routes/console.php
          php -l app/Services/McpStagingLoginPilotPolicy.php
          php -l app/Services/McpExplicitPlanConsentService.php
          php -l app/Http/Controllers/McpOAuthPlanConsentController.php
          php -l app/Http/Controllers/McpOAuthAccountLinkController.php
          php -l app/Http/Controllers/McpDelegatedRevocationController.php
          php -l tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php
          php -l app/Http/Middleware/EnsureMcpStagingSyntheticPilotActor.php
          php -l app/Http/Middleware/CloseUnopenedMcpStaging.php
          php -l tests/Feature/McpStagingLoginPilotPolicyTest.php
          php -l tests/Feature/McpIsolatedStagingBootstrapTest.php
          sh -n docker/mcp-staging-start.sh
          sh -n docker/render-start.sh
      - name: Assert no stage access, tokens, network or credentials
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan test tests/Feature/McpAuth0SealedStagingWiringTest.php tests/Feature/McpStagingProviderPreflightTest.php tests/Feature/McpStagingLoginPilotPolicyTest.php tests/Feature/McpIsolatedStagingBootstrapTest.php tests/Feature/McpStagingPilotUiTest.php tests/Feature/McpStagingSyntheticPlanConsentPilotTest.php tests/Feature/McpExplicitPlanConsentTest.php --colors=never
