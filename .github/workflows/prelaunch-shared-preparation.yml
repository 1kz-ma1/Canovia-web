name: Shared DB Preparation Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app/Http/Controllers/PlanController.php'
      - 'app/Http/Controllers/HomeController.php'
      - 'app/Http/Controllers/CanoviaFutureController.php'
      - 'app/Http/Controllers/AuthController.php'
      - 'app/Http/Controllers/PersonalizationController.php'
      - 'app/Http/Middleware/EnsurePreparationSurface.php'
      - 'app/Http/Middleware/EnsureFirstRunStarted.php'
      - 'app/Services/ReleaseLevelService.php'
      - 'app/Services/PreparationExecutionGuard.php'
      - 'tests/Feature/PreparationWorkerStopTest.php'
      - 'app/Services/FeatureFlagService.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'app/Bus/**'
      - '.dockerignore'
      - 'docker/startup-migration-policy.sh'
      - 'tests/Feature/RenderStartupMigrationRetryV569Test.php'
      - 'scripts/ops/platform_release_preflight.py'
      - 'tests/ci/test_preparation_release_preflight.py'
      - 'app/Http/Controllers/PrelaunchInterestController.php'
      - 'app/Services/PrelaunchInterestContextService.php'
      - 'app/Services/PersonalizationContextService.php'
      - 'tests/Feature/PrelaunchInterestContextTest.php'
      - 'routes/web.php'
      - 'app/Jobs/**'
      - 'bootstrap/app.php'
      - 'config/release_levels.php'
      - 'resources/views/preparation/**'
      - 'resources/js/preparation.mjs'
      - 'resources/css/preparation.css'
      - 'resources/views/components/preparation-*'
      - 'public/images/preparation/**'
      - 'vite.config.js'
      - 'config/prelaunch_interest_diagnostic.php'
      - 'scripts/ci/preparation_interest_browser_smoke.mjs'
      - 'tests/Feature/PrelaunchInterestSurfaceTest.php'
      - 'resources/views/layouts/**'
      - 'tests/Feature/PreparationOnlyBoundaryTest.php'
      - 'tests/Feature/PasswordResetMailPrivacyTest.php'
      - 'tests/Feature/PreparationCompatibilityMatrixTest.php'
      - 'scripts/ci/preparation_mac*'
      - 'scripts/ci/preparation_cutover*'
      - 'scripts/ci/integration_freeze_manifest.py'
      - 'tests/ci/test_integration_freeze_manifest.py'
      - 'tests/ci/test_preparation_cutover_rehearsal.py'
      - 'scripts/ci/test_preparation_mac_lab.py'
      - 'scripts/ci/preparation_surface_browser_smoke.mjs'
      - 'app/Services/PlanOwnershipService.php'
      - 'app/Services/GuestPlanClaimService.php'
      - 'tests/Feature/PlanCreationReplayOwnershipTest.php'
      - 'scripts/ci/preparation_plan_ownership_browser_smoke.mjs'
      - 'scripts/ci/integration_browser_regression.py'
      - '.github/workflows/prelaunch-shared-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-and-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --ignore-scripts && npm run build
      - name: Locked application dependencies must have no High or Critical advisory
        run: npm audit --package-lock-only --audit-level=high
      - run: cp .env.example .env
      - name: Owner replay and existing preparation/session contracts
        run: >-
          php artisan test tests/Feature/PasswordResetMailPrivacyTest.php tests/Feature/PreparationCompatibilityMatrixTest.php tests/Feature/PreparationOnlyBoundaryTest.php tests/Feature/PreparationWorkerStopTest.php tests/Feature/RenderStartupMigrationRetryV569Test.php tests/Feature/PlanCreationReplayOwnershipTest.php
          tests/Feature/PlanActionFirstCreationV5866Test.php
          tests/Feature/PlanLifecyclePersonalizationV5829Test.php
          tests/Feature/PersonalizationBootstrapV5825Test.php
          tests/Feature/P0DatabaseSessionLoginRegressionTest.php
          tests/Feature/PrelaunchInterestContextTest.php tests/Feature/PrelaunchInterestSurfaceTest.php tests/Unit/PrelaunchInterestScoringServiceTest.php --colors=never
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: test -x /usr/bin/google-chrome
      - run: git diff --exit-code -- package.json package-lock.json
      - name: Real browser, synthetic SQLite only
        run: >-
          python3 scripts/ci/integration_browser_regression.py
          --journey preparation --browser-executable /usr/bin/google-chrome --artifacts "$RUNNER_TEMP/shared-preparation"

      - name: Preparation-only original Web journey (synthetic SQLite)
        run: >-
          python3 scripts/ci/integration_browser_regression.py
          --journey preparation_surface --browser-executable /usr/bin/google-chrome
          --artifacts "$RUNNER_TEMP/shared-preparation-surface"

      - name: Optional 30-item diagnosis to canonical Plan, L0 owner and conflict boundaries
        run: >-
          python3 scripts/ci/integration_browser_regression.py
          --journey preparation_interest --browser-executable /usr/bin/google-chrome
          --artifacts "$RUNNER_TEMP/shared-preparation-interest"

      - name: Mac interactive launcher lifecycle and L0 public / explicit L1 tester (synthetic only)
        run: |
          rm .env
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p test_preparation_mac_lab.py -v
          python3 scripts/ci/preparation_mac_lab.py --source-sha "$(git rev-parse HEAD)" --smoke --browser-executable /usr/bin/google-chrome

      - name: Isolated cutover rehearsal (synthetic only)
        run: |
          python3 -B -m unittest discover -s tests/ci -p test_preparation_cutover_rehearsal.py -v
          python3 -B -m unittest discover -s tests/ci -p test_integration_freeze_manifest.py -v
          mkdir -p "$RUNNER_TEMP/preparation-cutover"
          python3 -B scripts/ci/integration_freeze_manifest.py --base 15abdc9de6f24b5250fb255c579d1aa55facaf1a --candidate "$(git rev-parse HEAD)" --preparation-review > "$RUNNER_TEMP/preparation-cutover/unshipped-source-manifest.json"
          python3 -B scripts/ci/preparation_cutover_rehearsal.py --source-sha "$(git rev-parse HEAD)" --browser-executable /usr/bin/google-chrome --artifacts "$RUNNER_TEMP/preparation-cutover"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-cutover-rehearsal
          path: ${{ runner.temp }}/preparation-cutover
          retention-days: 7
          if-no-files-found: error

  mac-launcher-guardrails:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-network environment, source and owned-process guardrails on macOS
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/ci -p test_preparation_mac_lab.py -v
