name: Pre-Launch IA-1 Static Intro

on:
  pull_request:
    branches:
      - main
    paths:
      - 'static-welcome/index.html'
      - 'static-welcome/intro.html'
      - 'static-welcome/styles.css'
      - 'static-welcome/intro.css'
      - 'static-welcome/app.js'
      - 'static-welcome/config.js'
      - 'tests/js/prelaunch-static-intro.test.mjs'
      - 'tests/js/prelaunch-static-intro-browser.test.mjs'
      - 'tests/js/prelaunch-static-old-web-health-browser.test.mjs'
      - '.github/workflows/prelaunch-ia1-static-intro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse existing cold-start JavaScript
        run: node --check static-welcome/app.js
      - name: IA-1 public intro and cold-start regressions
        run: node --test tests/js/prelaunch-static-intro.test.mjs

  static-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned offline Chromium tools
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          git diff --exit-code -- package.json package-lock.json
      - name: Verify static intro in real offline Chromium, desktop and mobile viewport
        run: node --test tests/js/prelaunch-static-intro-browser.test.mjs
      - name: Synthetic old-Live-Web Ready and CORS integration in Chromium (zero Web HTTP)
        run: node --test tests/js/prelaunch-static-old-web-health-browser.test.mjs
