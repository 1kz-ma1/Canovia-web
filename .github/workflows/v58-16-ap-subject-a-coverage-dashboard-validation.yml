name: V58.16 AP Subject A Coverage Dashboard Validation

on:
  push:
    branches:
      - feature/v58-16-ap-subject-a-coverage-dashboard

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Intelligence/Study/ApSubjectACoverageDashboardService.php
          php -l app/Intelligence/Study/StudyWorkspaceSurfaceRegistry.php
          php -l app/Intelligence/Study/StudyWorkspaceSurfacePolicy.php
          php -l app/Http/Controllers/StudyWorkspaceController.php
          php -l app/Services/StudyWorkspaceViewService.php
          php -l tests/Feature/ApSubjectACoverageDashboardV5816Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.16 dedicated AP Subject A coverage contract
        run: php artisan test tests/Feature/ApSubjectACoverageDashboardV5816Test.php
      - name: V56.3 Question exposure rotation regression
        run: php artisan test tests/Feature/QuestionExposureRotationV563Test.php
      - name: V56.4 Study Practice routing regression
        run: php artisan test tests/Feature/StudyPracticeRoutingV564Test.php
      - name: V58.15 Study Method calibration regression
        run: php artisan test tests/Feature/StudyMethodOutcomeCalibrationV5815Test.php
      - name: V58.3 Study Workspace focused surfaces regression
        run: php artisan test tests/Feature/StudyWorkspaceFocusedSurfacesV583Test.php
      - name: V56.2 IPA official Question Pack regression
        run: php artisan test tests/Feature/IpaOfficialQuestionPackV562Test.php
