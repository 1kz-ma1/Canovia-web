name: V55.1 Validate

on:
  push:
    branches:
      - feature/v55-1-career-workspace-mode

jobs:
  career-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V55.1 PHP
        run: find app/Enums/WorkspaceMode.php app/Services/WorkspaceModeRegistry.php app/Services/WorkspaceModeResolver.php app/Services/WorkspaceModeOnboardingService.php app/Http/Controllers/WorkspaceModeController.php app/Http/Controllers/CareerModeWorkspaceController.php app/Http/Controllers/OverviewWorkspaceController.php app/Http/Controllers/PlanController.php app/Http/Controllers/BehaviorEventController.php app/Intelligence/Presentation/CareerIntelligencePresentationAdapter.php app/Intelligence/Presentation/PlanIntelligencePresentationService.php app/Intelligence/Presentation/IntelligenceStateChangeFeedbackService.php tests/Feature/CareerWorkspaceModeV551Test.php tests/Feature/WorkspaceModeResolverV540Test.php tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePersistenceV542Test.php tests/Unit/WorkspaceModeRegistryV540Test.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade
        run: php artisan view:cache

      - name: V55.1 Career Workspace Mode
        run: php artisan test tests/Feature/CareerWorkspaceModeV551Test.php

      - name: V55.0 Career Intelligence regression
        run: php artisan test tests/Feature/CareerIntelligenceV550Test.php

      - name: Existing Career regression
        run: php artisan test tests/Feature/CareerCaptureInterviewReviewV413Test.php

      - name: V54.8 telemetry regression
        run: php artisan test tests/Feature/WorkspaceModePolishTelemetryV548Test.php

      - name: V54.7 onboarding regression
        run: php artisan test tests/Feature/WorkspaceModeOnboardingV547Test.php

      - name: V54.6 State Change regression
        run: php artisan test tests/Feature/StateChangeFeedbackV546Test.php

      - name: V54.5 Overview regression
        run: php artisan test tests/Feature/OverviewWorkspaceV545Test.php

      - name: V54.4 Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php

      - name: V54.3 Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php

      - name: V54.2 Mode persistence regression
        run: php artisan test tests/Feature/WorkspaceModePersistenceV542Test.php

      - name: V54.1 Mode Bar regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php

      - name: V54.0 Resolver regression
        run: php artisan test tests/Feature/WorkspaceModeResolverV540Test.php

      - name: V54.0 Registry regression
        run: php artisan test tests/Unit/WorkspaceModeRegistryV540Test.php
