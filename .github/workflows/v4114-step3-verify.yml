name: V41.14 Step3 Verify

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Syntax Blade and routes
        run: |
          php -l app/Models/GuidedExecution.php
          php -l app/Services/GuidedExecutionPolicyService.php
          php -l app/Services/GuidedExecutionService.php
          php -l app/Http/Controllers/GuidedExecutionController.php
          php -l app/Services/PlanToolService.php
          php -l app/Services/ExecutionActionPolicyService.php
          php -l tests/Feature/GuidedExecutionV4114Test.php
          php artisan view:cache
          php artisan route:list --name=guided_execution
      - name: Focused regression
        run: |
          php artisan test \
            tests/Feature/GuidedExecutionV4114Test.php \
            tests/Feature/ActionHierarchyV4113Test.php \
            tests/Feature/ExecutionEvidenceFoundationV410Test.php \
            tests/Feature/NativeEvidenceSignalsV411Test.php \
            tests/Feature/ActionFirstV416Test.php \
            tests/Feature/AdaptiveGoalDiscoveryV4114Test.php \
            tests/Feature/InboxIntelligenceGuideV4113Test.php \
            tests/Feature/FeatureAccessV406Test.php
