name: E858 Isolated TLS and Remote Termination

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/e858_tls/**'
      - 'scripts/ci/e858_tls_host.py'
      - 'tests/ci/test_e858_isolated_tls.py'
      - '.github/workflows/e858-isolated-tls.yml'
      - 'docs/development/integration/2026-10-18-b/e858-real-audit-route-safety.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    name: Isolated TLS (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed test-only dependencies
        run: python3 -m pip install PyMySQL==1.1.2 cryptography==46.0.3
      - name: Offline boundaries and existing B guards
        run: |
          python3 -B -m unittest discover -s tests/ci -p test_e858_isolated_tls.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b_offline.py -v
      - name: Reuse unchanged legacy wire evidence
        id: wire-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Docs/new isolated profiles do not authorize a legacy full17/KILL run.
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- scripts/ci/e858_tls scripts/ci/e858_tls_host.py scripts/ci/e858_full94_tls.py scripts/ci/e858_b_offline.py scripts/ci/p0_mysql_metadata_grants_input.py tests/ci/test_e858_isolated_tls.py tests/ci/test_e858_full94_tls.py tests/ci/test_e858_b_control.py; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'LEGACY_WIRE_UNCHANGED_NOT_RUN'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Real isolated TLS sessions and independent server observations
        if: steps.wire-scope.outputs.run == 'true'
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -B scripts/ci/e858_tls_host.py --series "$SERIES" --tooling-sha "$(git rev-parse HEAD)"
      - name: Tracked source remains unchanged
        run: test -z "$(git status --porcelain)"
