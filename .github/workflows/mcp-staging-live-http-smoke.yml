name: MCP Live Staging HTTP Lockdown Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcp-staging-live-http-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-http-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_ORIGIN: https://canovia-mcp-staging.onrender.com
    steps:
      - name: Verify isolated staging health through public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          # Render Free can take ~60 seconds to wake from idle.
          # Do NOT run this as a recurring keepalive.
          for attempt in $(seq 1 18); do
            code=$(curl --silent --show-error --max-time 20 \
              --output /tmp/canovia-staging-up-response \
              --write-out '%{http_code}' \
              "$STAGING_ORIGIN/up" || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            echo "Staging is not ready (attempt $attempt; HTTP $code)"
            sleep 10
          done
          test "$ready" = "1"
          echo 'Live staging health: /up returned HTTP 200'

      - name: Verify account, OAuth and MCP stay closed from internet
        shell: bash
        run: |
          set -euo pipefail
          # Guard representative public, account, OAuth and MCP surfaces
          # against any accidental opening on the *deployed* Render instance.
          for path in / /welcome /workspace /admin/login \
            /login /register /forgot-password /account \
            /account/mcp/link/callback /api/mcp \
            /.well-known/oauth-protected-resource \
            /.well-known/oauth-protected-resource/api/mcp; do
            status=$(curl --silent --show-error --max-time 20 \
              --dump-header /tmp/canovia-staging-response-headers \
              --output /tmp/canovia-staging-response-body \
              --write-out '%{http_code}' \
              "$STAGING_ORIGIN$path")
            if [ "$status" != "503" ]; then
              echo "Unexpected public exposure on $path: HTTP $status"
              exit 1
            fi
            if ! grep -Fxq 'Staging service unavailable.' \
              /tmp/canovia-staging-response-body; then
              echo "Unexpected staging error body for $path"
              exit 1
            fi
            if ! grep -Eiq '^cache-control:[[:space:]]*no-store' \
              /tmp/canovia-staging-response-headers; then
              echo "No private no-store cache protection for $path"
              exit 1
            fi
            echo "$path: HTTP 503 (closed)"
          done

          # Also assert POST entry points stay denied, including CSRF-
          # protected account flows, without relying on any test identity.
          for path in /login /register /account/mcp/link/start /api/mcp; do
            status=$(curl --silent --show-error --max-time 20 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
              --dump-header /tmp/canovia-staging-response-headers \
              --output /tmp/canovia-staging-response-body \
              --write-out '%{http_code}' \
              "$STAGING_ORIGIN$path")
            if [ "$status" != "503" ]; then
              echo "Unexpected POST exposure on $path: HTTP $status"
              exit 1
            fi
            grep -Fxq 'Staging service unavailable.' \
              /tmp/canovia-staging-response-body
            grep -Eiq '^cache-control:[[:space:]]*no-store' \
              /tmp/canovia-staging-response-headers
            echo "POST $path: HTTP 503 (closed)"
          done
          echo 'External staging HTTP smoke: PASS (all public/account/OAuth/MCP GET/POST probes closed)'
