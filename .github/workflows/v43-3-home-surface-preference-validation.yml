name: V43.3 Home surface preference validation

on:
  push:
    branches:
      - feature/v43-3-home-surface-preference

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php -l app/Services/HomeSurfacePreference.php
      - run: php -l app/Http/Controllers/AuthController.php
      - run: php -l bootstrap/app.php
      - run: php artisan view:cache
      - run: node --test tests/js/living-map-v421.test.mjs tests/js/map-telemetry-v424.test.mjs tests/js/home-surface-preference-v433.test.mjs
      - run: php artisan test tests/Feature/CanoviaHomeSurfacePreferenceV433Test.php tests/Feature/CanoviaHomeSurfaceV432Test.php tests/Feature/CanoviaMapV420Test.php tests/Feature/CanoviaMapFocusV421Test.php tests/Feature/CanoviaMapLivingReevaluationV422Test.php tests/Feature/CanoviaMapContextualCompanionV423Test.php tests/Feature/CanoviaMapTelemetryV424Test.php tests/Feature/CanoviaMapUsabilityV430Test.php tests/Feature/CanoviaMapFocusSurfaceV431Test.php tests/Feature/FirstRunUxV4123Test.php tests/Feature/InstantNavigationV4120Test.php tests/Feature/InstantNavigationFragmentV4121Test.php tests/Feature/MutationIdempotencyV390Test.php
