name: V54.7 Validate

on:
  push:
    branches:
      - feature/v54-7-mode-onboarding

jobs:
  mode-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V54.7 PHP
        run: find app/Data/WorkspaceModeDefinitionData.php app/Services/WorkspaceModeRegistry.php app/Services/WorkspaceModeOnboardingService.php app/Http/Controllers/StudyWorkspaceController.php app/Http/Controllers/DevelopmentWorkspaceController.php app/Http/Controllers/OverviewWorkspaceController.php app/Http/Controllers/PlanController.php tests/Feature/WorkspaceModeOnboardingV547Test.php tests/Unit/WorkspaceModeRegistryV540Test.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade
        run: php artisan view:cache

      - name: V54.7 Mode Onboarding
        run: php artisan test tests/Feature/WorkspaceModeOnboardingV547Test.php

      - name: V54.6 State Change Feedback regression
        run: php artisan test tests/Feature/StateChangeFeedbackV546Test.php

      - name: V54.5 Overview regression
        run: php artisan test tests/Feature/OverviewWorkspaceV545Test.php

      - name: V54.4 Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php

      - name: V54.3 Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php

      - name: V54.2 Mode persistence regression
        run: php artisan test tests/Feature/WorkspaceModePersistenceV542Test.php

      - name: V54.0 Registry regression
        run: php artisan test tests/Unit/WorkspaceModeRegistryV540Test.php

      - name: First-run Gate regression
        run: php artisan test tests/Feature/FirstRunUxV4123Test.php

      - name: Plan creation idempotency regression
        run: php artisan test tests/Feature/MutationIdempotencyV390Test.php

      - name: Goal Context creation regression
        run: php artisan test tests/Feature/GoalContextFoundationV4114Test.php

      - name: Plan visual creation regression
        run: php artisan test tests/Feature/PlanVisualPreferencesTest.php
