name: V41.16 Validation

on:
  push:
    branches:
      - feature/v41-16-conversational-onboarding

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: find app tests database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan view:cache
      - run: php artisan route:list --name=goal_discovery
      - name: Full regression
        run: php artisan test
