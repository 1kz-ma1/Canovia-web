name: V51.9.7 temporary validation

on:
  push:
    branches:
      - feature/v51-9-7-action-home-density

permissions:
  contents: read

jobs:
  action-home-density:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.9.7 and Home regressions
        run: >
          php artisan test
          tests/Feature/ActionHomeDensityV5197Test.php
          tests/Feature/ActionHomeV513Test.php
          tests/Feature/DashboardGuidanceV395Test.php
          tests/Feature/HomeQueryCollapseV5194Test.php
          tests/Feature/HomeCoreBundleCostReductionV5192Test.php
          tests/Feature/ModelReuseV5195Test.php
          tests/Feature/BehaviorTrackingTest.php
          tests/Feature/InteractionPerformanceV518Test.php
          tests/Feature/InstantNavigationV4120Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
