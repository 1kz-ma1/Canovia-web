name: Render migration recovery validation

on:
  push:
    branches:
      - fix/render-migration-recovery

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php -l database/migrations/2026_09_26_120000_create_practice_question_candidates_table.php
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Feature/PracticeDemandCandidatesV419Test.php tests/Feature/InboxFoundationV4113Test.php tests/Feature/ConversationalOnboardingV4116Test.php
      - run: node --test tests/js/instant-start-v391.test.mjs

  mysql-partial-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: canovia_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: canovia_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Fresh migration succeeds with short FK names
        run: php artisan migrate:fresh --force
      - name: Simulate the production partial migration state
        run: |
          mysql -h127.0.0.1 -uroot -proot canovia_test <<'SQL'
          ALTER TABLE practice_question_candidates
            DROP FOREIGN KEY pqc_first_demand_fk,
            DROP FOREIGN KEY pqc_latest_demand_fk,
            DROP FOREIGN KEY pqc_native_ai_run_fk,
            DROP FOREIGN KEY pqc_pack_fk,
            DROP FOREIGN KEY pqc_question_fk,
            DROP FOREIGN KEY pqc_reviewer_fk;
          ALTER TABLE practice_question_candidates
            DROP INDEX practice_question_candidates_last_seen_at_index,
            DROP INDEX practice_candidate_status_seen_idx;
          DELETE FROM migrations
          WHERE migration = '2026_09_26_120000_create_practice_question_candidates_table';
          SQL
      - name: Pending migration repairs the existing table
        run: php artisan migrate --force
      - name: Verify repaired constraints and indexes
        run: |
          test "$(mysql -N -h127.0.0.1 -uroot -proot canovia_test -e "SELECT COUNT(*) FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='canovia_test' AND TABLE_NAME='practice_question_candidates' AND CONSTRAINT_NAME IN ('pqc_first_demand_fk','pqc_latest_demand_fk','pqc_native_ai_run_fk','pqc_pack_fk','pqc_question_fk','pqc_reviewer_fk');")" = "6"
          test "$(mysql -N -h127.0.0.1 -uroot -proot canovia_test -e "SELECT COUNT(DISTINCT INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='canovia_test' AND TABLE_NAME='practice_question_candidates' AND INDEX_NAME IN ('practice_question_candidates_last_seen_at_index','practice_candidate_status_seen_idx');")" = "2"
          test "$(mysql -N -h127.0.0.1 -uroot -proot canovia_test -e "SELECT COUNT(*) FROM migrations WHERE migration='2026_09_26_120000_create_practice_question_candidates_table';")" = "1"
