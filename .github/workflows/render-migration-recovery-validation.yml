name: Render migration recovery validation

on:
  push:
    branches:
      - fix/render-migration-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php -l database/migrations/2026_09_26_120000_create_practice_question_candidates_table.php
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Feature/PracticeDemandCandidatesV419Test.php tests/Feature/InboxFoundationV4113Test.php tests/Feature/ConversationalOnboardingV4116Test.php
