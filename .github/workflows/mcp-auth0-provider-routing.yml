name: MCP Auth0 JWT Provider Routing

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/McpExternalTokenVerifier.php'
      - 'app/Services/McpDelegatedPlanAccessPolicy.php'
      - 'app/Services/McpOAuthAccountLinkCommitter.php'
      - 'tests/Feature/McpReadOnlyResourceTest.php'
      - 'app/Services/McpReadOnlyStudyContextTool.php'
      - 'app/Services/LearningContextSnapshotService.php'
      - 'app/Services/McpReadOnlyLearningContextSnapshotTool.php'
      - 'resources/views/auth/partials/mcp-delegated-access-revocation.blade.php'
      - 'app/Services/McpStudyPilotAccessPolicy.php'
      - 'app/Services/McpProtectedResourceConfiguration.php'
      - 'app/Services/McpReadOnlyStudyPracticeSummaryTool.php'
      - 'app/Services/McpProposeStudyResultTool.php'
      - 'app/Services/McpStudyResultProposalService.php'
      - 'app/Models/McpStudyResultProposal.php'
      - 'app/Http/Controllers/McpStudyResultDecisionController.php'
      - 'resources/views/auth/partials/mcp-study-result-proposals.blade.php'
      - 'database/migrations/2026_10_15_070000_create_mcp_study_result_proposals_table.php'
      - 'app/Services/McpExplicitPlanConsentService.php'
      - 'resources/views/workspace/study/partials/mcp-plan-consent.blade.php'
      - 'resources/views/workspace/study/index.blade.php'
      - 'resources/views/auth/partials/mcp-plan-consent-confirmation.blade.php'
      - 'tests/Feature/McpExplicitPlanConsentTest.php'
      - 'tests/Feature/McpOAuthAccountLinkTest.php'
      - 'app/Http/Controllers/McpOAuthPlanConsentController.php'
      - 'resources/views/auth/partials/mcp-plan-consent-confirmation.blade.php'
      - 'tests/Feature/McpDelegatedPlanAccessPolicyTest.php'
      - 'app/Services/McpAuth0JwtTokenVerifier.php'
      - 'app/Services/McpOAuthAccountLinkConfiguration.php'
      - 'app/Services/McpOAuthAccountLinkProvider.php'
      - 'app/Http/Controllers/McpOAuthAccountLinkController.php'
      - 'app/Http/Controllers/McpOAuthPlanConsentController.php'
      - 'resources/views/auth/partials/mcp-account-link.blade.php'
      - 'config/canovia_mcp.php'
      - 'app/Http/Controllers/McpReadOnlyResourceController.php'
      - 'config/canovia_mcp.php'
      - 'tests/Feature/McpAuth0JwtProviderRoutingTest.php'
      - '.github/workflows/mcp-auth0-provider-routing.yml'

permissions:
  contents: read

jobs:
  provider-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install reviewed locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Validate routing and PHP syntax
        run: |
          php -l app/Services/McpExternalTokenVerifier.php
          php -l app/Services/McpDelegatedPlanAccessPolicy.php
          php -l app/Services/McpOAuthAccountLinkCommitter.php
          php -l tests/Feature/McpOAuthAccountLinkTest.php
          php -l tests/Feature/McpReadOnlyResourceTest.php
          php -l tests/Feature/McpDelegatedPlanAccessPolicyTest.php
          php -l app/Services/McpAuth0JwtTokenVerifier.php
          php -l app/Services/McpOAuthAccountLinkConfiguration.php
          php -l app/Services/McpOAuthAccountLinkProvider.php
          php -l app/Http/Controllers/McpOAuthAccountLinkController.php
          php -l app/Http/Controllers/McpOAuthPlanConsentController.php
          php -l app/Http/Controllers/McpReadOnlyResourceController.php
          php -l app/Services/McpReadOnlyStudyContextTool.php
          php -l app/Services/LearningContextSnapshotService.php
          php -l app/Services/McpReadOnlyLearningContextSnapshotTool.php
          php -l app/Services/McpStudyPilotAccessPolicy.php
          php -l app/Services/McpProtectedResourceConfiguration.php
          php -l app/Services/McpReadOnlyStudyPracticeSummaryTool.php
          php -l app/Services/McpStudyResultProposalService.php
          php -l app/Services/McpProposeStudyResultTool.php
          php -l app/Models/McpStudyResultProposal.php
          php -l app/Http/Controllers/McpStudyResultDecisionController.php
          php -l app/Services/McpExplicitPlanConsentService.php
          php -l tests/Feature/McpAuth0JwtProviderRoutingTest.php
      - name: Verify JWT and legacy OAuth read-only regression
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan test tests/Feature/McpAuth0JwtProviderRoutingTest.php tests/Feature/McpAuth0JwtTokenVerifierTest.php tests/Feature/McpReadOnlyResourceTest.php tests/Feature/McpOAuthAccountLinkTest.php tests/Feature/McpDelegatedPlanAccessPolicyTest.php tests/Feature/McpDelegatedRevocationTest.php tests/Feature/McpSyntheticOAuthConsentReadLifecycleTest.php tests/Feature/McpExplicitPlanConsentTest.php --colors=never
