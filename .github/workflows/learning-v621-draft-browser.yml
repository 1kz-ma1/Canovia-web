name: Learning V6.21 Disposable Legacy Draft Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learning-v621-draft-browser.yml'
      - 'scripts/ci/learning_v621_draft_browser_smoke.mjs'
      - 'scripts/ci/learning_v621_draft_readonly.php'
      - 'scripts/ci/learning_v621_synthetic_task.php'
      - 'resources/js/app.js'
      - 'resources/views/study_practice/show.blade.php'
      - 'app/Http/Controllers/StudyPracticeController.php'
      - 'app/Services/StudyPracticeAttemptReviewService.php'
      - 'app/Services/StudyPracticeReviewReferenceService.php'
      - 'app/Services/QuestionBankGrader.php'
      - 'app/Http/Controllers/StudyPracticeReviewController.php'
      - 'resources/views/study_practice/**'
      - 'tests/Feature/StudyPracticeRetryTest.php'
      - 'app/Services/StudyPracticeRetryService.php'
      - 'app/Http/Controllers/StudyPracticeRetryController.php'
      - 'tests/Feature/StudyPracticeAttemptReviewTest.php'
      - 'app/Services/StudyPracticeQuestionIntegrityService.php'
      - 'app/Services/NativeAiStudyPracticeQuestionProvider.php'
      - 'app/Services/StudyPracticeNativeAiSchema.php'
      - 'app/Services/StudyPracticePromptService.php'
      - 'tests/Feature/StudyPracticeQuestionIntegrityTest.php'
      - 'config/release_levels.php'
      - 'app/Services/ReleaseLevelService.php'
      - 'app/Services/FeatureAccessService.php'
      - 'docs/development/LEARNING_FIRST_DRAFT_CONTINUITY_V621_2026_10_15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-chromium-v621:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application deps
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --ignore-scripts
          npm run build
      - name: Question integrity and existing draft/native/assessment regressions
        run: php artisan test --compact tests/Feature/StudyPracticeQuestionIntegrityTest.php tests/Feature/StudyPracticeDraftPersistenceV4071Test.php tests/Feature/StudyPracticeLearningLoopV393Test.php tests/Feature/NativeAiPracticeV418Test.php tests/Feature/StudyPracticeAttemptReviewTest.php tests/Feature/QuestionBankV402Test.php tests/Feature/StudyPracticeRetryTest.php tests/Feature/StudyLearningDistinctFollowupV616Test.php tests/Feature/StudyLearningDelayedRecheckV617Test.php
      - name: Pin disposable local SQLite and disable provider effects
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_ENV=testing" >> "$GITHUB_ENV"
          # Exercise Study at its minimum public level in this disposable fixture.
          echo "CANOVIA_PUBLIC_RELEASE_LEVEL=1" >> "$GITHUB_ENV"
          echo "APP_DEBUG=false" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:8799" >> "$GITHUB_ENV"
          echo "CANOVIA_LEARNING_V621_BASE_URL=http://127.0.0.1:8799" >> "$GITHUB_ENV"
          echo "CANOVIA_LEARNING_V621_FIXTURE=1" >> "$GITHUB_ENV"
          echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
          echo "DB_DATABASE=$RUNNER_TEMP/learning-v621-browser.sqlite" >> "$GITHUB_ENV"
          echo "SESSION_DRIVER=file" >> "$GITHUB_ENV"
          echo "CACHE_STORE=file" >> "$GITHUB_ENV"
          echo "QUEUE_CONNECTION=sync" >> "$GITHUB_ENV"
          echo "MAIL_MAILER=array" >> "$GITHUB_ENV"
          echo "NATIVE_AI_DRIVER=disabled" >> "$GITHUB_ENV"
          cp .env.example .env
          touch "$RUNNER_TEMP/learning-v621-browser.sqlite"
      - name: Migrate only disposable SQLite and syntax-check test helpers
        run: |
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php -l scripts/ci/learning_v621_draft_readonly.php
          php -l scripts/ci/learning_v621_synthetic_task.php
          node --check scripts/ci/learning_v621_draft_browser_smoke.mjs
      - name: Install pinned headless Chromium (CI only)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          git diff --exit-code -- package-lock.json package.json
      - name: Serve isolated app on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup php artisan serve --host=127.0.0.1 --port=8799 > "$RUNNER_TEMP/learning-v621-php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/learning-v621-php-server.pid"
          for i in $(seq 1 40); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8799/register; then exit 0; fi
            sleep 1
          done
          echo "Disposable browser server failed to start" >&2
          exit 1
      - name: Real mobile-sized Chromium draft and assessed Attempt from isolated synthetic Task
        run: node scripts/ci/learning_v621_draft_browser_smoke.mjs
      - name: Record verification boundary
        run: |
          echo "Owner synthetic browser journey: UI Plan + registration; pinned disposable test fixture adds one Task; real UI imports JSON, draft 204/419, reload without localStorage, explicit synthetic assessment."
          echo "No Plan/Answer/Attempt DB seed; one disposable synthetic Task fixture (first Task action NOT proven); no live AI provider or public question corpus."
          echo "Not proven: Safari/iPhone, human usability, Render/Aiven/production, quality of AI-produced grading, deployment or release."
