name: Adaptive Context G3 Recall Extraction Commit Fence

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/StudyRecallExtractionCommitFence.php'
      - 'app/Services/StudyRecallCandidateExtractionService.php'
      - 'app/Services/InboxRecallMaterialTransferGuard.php'
      - 'app/Services/InboxRoutingService.php'
      - 'app/Http/Controllers/InboxController.php'
      - 'tests/Feature/InboxRecallMaterialTransferG3Test.php'
      - 'tests/Feature/InboxRecallTransferPostgresG3Test.php'
      - 'app/Services/StudyRecallCandidateReviewFence.php'
      - 'app/Http/Controllers/StudyRecallCandidateController.php'
      - 'app/Models/StudyRecallCandidate.php'
      - 'resources/views/study_recall/show.blade.php'
      - 'database/migrations/2026_10_13_200000_add_recall_candidate_review_provenance.php'
      - 'tests/Feature/StudyRecallCandidateV4112Test.php'
      - 'tests/Feature/StudyRecallBatchIngestV588Test.php'
      - 'app/Services/StudyRecallBatchCandidateExtractionService.php'
      - 'app/Services/NativeAiPurposeAuthorizationGuard.php'
      - 'tests/Feature/RecallAiCommitFenceV05Test.php'
      - 'tests/Feature/RecallInputFileRacePostgresG3Test.php'
      - '.github/workflows/adaptive-context-g3-recall-commit-fence.yml'

jobs:
  recall-ai-post-provider-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/StudyRecallExtractionCommitFence.php
          php -l app/Services/StudyRecallCandidateExtractionService.php
          php -l app/Services/InboxRecallMaterialTransferGuard.php
          php -l app/Services/InboxRoutingService.php
          php -l tests/Feature/InboxRecallMaterialTransferG3Test.php
          php -l tests/Feature/InboxRecallTransferPostgresG3Test.php
          php -l app/Services/StudyRecallCandidateReviewFence.php
          php -l app/Http/Controllers/StudyRecallCandidateController.php
          php -l app/Models/StudyRecallCandidate.php
          php -l database/migrations/2026_10_13_200000_add_recall_candidate_review_provenance.php
          php -l tests/Feature/StudyRecallCandidateV4112Test.php
          php -l tests/Feature/StudyRecallBatchIngestV588Test.php
          php -l app/Services/StudyRecallBatchCandidateExtractionService.php
          php -l tests/Feature/RecallAiCommitFenceV05Test.php
          php -l tests/Feature/RecallInputFileRacePostgresG3Test.php
      - name: G3 Inbox-to-Recall exact source byte transfer, epoch and post-AI status
        run: php artisan test tests/Feature/InboxRecallMaterialTransferG3Test.php tests/Feature/InboxIntelligenceGuideV4113Test.php --stop-on-failure
      - name: G3 Recall after-provider revoke, source change and atomic commit
        run: php artisan test tests/Feature/RecallAiCommitFenceV05Test.php
      - name: Existing Recall single, batch, retry and resource handoff
        run: |
          php artisan test \
            tests/Feature/StudyRecallCandidateV4112Test.php \
            tests/Feature/StudyRecallBatchIngestV588Test.php \
            tests/Feature/NativeAiPurposeGrantFenceV05Test.php
