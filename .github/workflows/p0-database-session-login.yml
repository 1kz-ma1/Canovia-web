name: P0 Database Session Login Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Http/Controllers/AuthController.php'
      - 'bootstrap/app.php'
      - 'config/session.php'
      - 'tests/Feature/P0DatabaseSessionLoginRegressionTest.php'
      - 'scripts/ci/p0_http_auth_seed.php'
      - 'scripts/ci/p0_real_http_session_e2e.py'
      - 'scripts/ci/p0_https_cookie_origin_e2e.py'
      - '.github/workflows/p0-database-session-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-session-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, xml
          coverage: none
      - name: Install pinned PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax check
        run: php -l tests/Feature/P0DatabaseSessionLoginRegressionTest.php
      - name: Persistent database session login and logout regression
        run: php artisan test tests/Feature/P0DatabaseSessionLoginRegressionTest.php --fail-on-skipped
      - name: Existing auth failure and onboarding route regression
        run: php artisan test tests/Feature/FirstRunUxV4123Test.php --filter='test_(existing_account_can_log_in_from_welcome_without_being_forced_back_to_first_run|login_failure_message_is_visible_after_redirect|unfinished_new_account_returns_to_welcome_after_logout_and_login)' --fail-on-skipped

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real login view assets for loopback HTTP
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Real HTTP login, DB session persistence, PHP restart, logout and re-login
        env:
          CANOVIA_P0_DISPOSABLE_HTTP_CI: '1'
          APP_URL: http://127.0.0.1:18789
          DB_DATABASE: ${{ github.workspace }}/database/p0_auth_http_ci.sqlite
          DB_CONNECTION: sqlite
          DB_URL: ''
          SESSION_DRIVER: database
          SESSION_SECURE_COOKIE: 'false'
          SESSION_DOMAIN: ''
        run: |
          set -euo pipefail
          touch database/p0_auth_http_ci.sqlite
          php -l scripts/ci/p0_http_auth_seed.php
          python3 -m py_compile scripts/ci/p0_real_http_session_e2e.py
          php artisan migrate --force --no-interaction >/dev/null
          php scripts/ci/p0_http_auth_seed.php
          python3 scripts/ci/p0_real_http_session_e2e.py

      - name: Real HTTPS Secure Cookie host isolation and cross-process restart
        env:
          CANOVIA_TRUSTED_PROXY_IPS: 127.0.0.1
          CANOVIA_P0_DISPOSABLE_HTTP_CI: '1'
          APP_URL: https://localhost:18790
          DB_DATABASE: ${{ github.workspace }}/database/p0_auth_http_ci.sqlite
          DB_CONNECTION: sqlite
          DB_URL: ''
          SESSION_DRIVER: database
          SESSION_SECURE_COOKIE: 'true'
          SESSION_DOMAIN: ''
        run: |
          set -euo pipefail
          php -l bootstrap/app.php
          python3 -m py_compile scripts/ci/p0_https_cookie_origin_e2e.py
          python3 scripts/ci/p0_https_cookie_origin_e2e.py
