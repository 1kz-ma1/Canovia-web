name: V41.15 Step2 Verify

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Syntax Blade and routes
        run: |
          php -l app/Services/CompanionMutationApplyService.php
          php -l app/Http/Controllers/CompanionController.php
          php -l app/Services/CompanionConversationService.php
          php -l app/Models/CompanionMutationCandidate.php
          php -l tests/Feature/CanoviaCompanionMutationApplyV4115Test.php
          php artisan view:cache
          php artisan route:list --name=companion
      - name: Focused regression
        run: |
          php artisan test \
            tests/Feature/CanoviaCompanionMutationApplyV4115Test.php \
            tests/Feature/CanoviaCompanionV4115Test.php \
            tests/Feature/EconomyFoundationV415Test.php \
            tests/Feature/AdminPremiumExperienceV417Test.php \
            tests/Feature/GoalContextFoundationV4114Test.php \
            tests/Feature/AdaptiveGoalDiscoveryV4114Test.php \
            tests/Feature/GuidedExecutionV4114Test.php \
            tests/Feature/ActionHierarchyV4113Test.php
