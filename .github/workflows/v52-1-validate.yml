name: V52.1 temporary validation

on:
  push:
    branches:
      - feature/v52-1-ios-shell-prototype

permissions:
  contents: read

jobs:
  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V52.1 and native bridge regressions
        run: >
          php artisan test
          tests/Feature/IosShellPrototypeV521Test.php
          tests/Feature/IosReadinessFoundationV520Test.php
          tests/Feature/InteractionSmoothnessV5110Test.php
          tests/Feature/WebRealDeviceFinishV5198Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Native bridge JS regressions
        run: >
          node --test
          tests/js/client-runtime-v520.test.mjs
          tests/js/instant-start-v391.test.mjs

      - name: Validate plist
        run: python3 -c "import plistlib; plistlib.load(open('ios/CanoviaNative/Resources/Info.plist','rb')); print('Info.plist ok')"

      - name: Validate project yaml
        run: ruby -e "require 'yaml'; YAML.load_file('ios/CanoviaNative/project.yml'); puts 'project.yml ok'"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/CanoviaNative
        run: make project

      - name: Build iOS Simulator prototype
        working-directory: ios/CanoviaNative
        run: >
          xcodebuild
          -project CanoviaNative.xcodeproj
          -scheme CanoviaNative
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
