name: V57.6 Context-aware Implementation Brief Validation

on:
  push:
    branches:
      - feature/v57-6-context-aware-implementation-brief
  pull_request:
    branches:
      - main

jobs:
  implementation-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/DevelopmentWorkspaceController.php
          php -l app/Services/DevelopmentImplementationBriefService.php
          php -l tests/Feature/DeveloperImplementationBriefV576Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V57.6 implementation brief
        run: php artisan test tests/Feature/DeveloperImplementationBriefV576Test.php
      - name: V57.4 execution context regression
        run: php artisan test tests/Feature/DeveloperExecutionContextV574Test.php
      - name: Developer Home regression
        run: php artisan test tests/Feature/DeveloperHomeV573Test.php
      - name: Task association and observation regression
        run: php artisan test tests/Feature/DeveloperTaskAssociationV572Test.php tests/Feature/DeveloperActivityObservationV571Test.php
      - name: Evidence and readiness regression
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php tests/Feature/DeveloperReadinessV538Test.php
      - name: GitHub V57.5 connection regression
        run: php artisan test tests/Feature/GitHubConnectionPrivateRepositoryV575Test.php tests/Feature/GitHubAppConnectionV465Test.php
      - name: Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php tests/Feature/WorkspaceModeOnboardingV547Test.php
