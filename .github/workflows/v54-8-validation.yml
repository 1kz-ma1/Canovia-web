name: V54.8 Validate

on:
  push:
    branches:
      - feature/v54-8-polish-telemetry-ios

jobs:
  workspace-mode-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V54.8 PHP
        run: find app/Enums/BehaviorEventType.php app/Http/Controllers/BehaviorEventController.php tests/Feature/WorkspaceModePolishTelemetryV548Test.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade
        run: php artisan view:cache

      - name: V54.8 Workspace Mode polish and telemetry
        run: php artisan test tests/Feature/WorkspaceModePolishTelemetryV548Test.php

      - name: V54.7 Mode onboarding regression
        run: php artisan test tests/Feature/WorkspaceModeOnboardingV547Test.php

      - name: V54.6 State Change Feedback regression
        run: php artisan test tests/Feature/StateChangeFeedbackV546Test.php

      - name: V54.5 Overview regression
        run: php artisan test tests/Feature/OverviewWorkspaceV545Test.php

      - name: V54.4 Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php

      - name: V54.3 Study Workspace regression
        run: php artisan test tests/Feature/StudyWorkspaceV543Test.php

      - name: V54.2 persistence regression
        run: php artisan test tests/Feature/WorkspaceModePersistenceV542Test.php

      - name: V54.1 Mode Bar regression
        run: php artisan test tests/Feature/WorkspaceModeBarV541Test.php

      - name: V54.0 Registry regression
        run: php artisan test tests/Unit/WorkspaceModeRegistryV540Test.php

      - name: V54.0 Resolver regression
        run: php artisan test tests/Unit/WorkspaceModeResolverV540Test.php

      - name: V51.9.8 real-device regression
        run: php artisan test tests/Feature/WebRealDeviceFinishV5198Test.php

      - name: V52.0 iOS readiness regression
        run: php artisan test tests/Feature/IosReadinessFoundationV520Test.php
