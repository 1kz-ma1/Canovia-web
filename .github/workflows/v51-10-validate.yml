name: V51.10 temporary validation

on:
  push:
    branches:
      - feature/v51-10-interaction-smoothness

permissions:
  contents: read

jobs:
  interaction-smoothness:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.10 and navigation regressions
        run: >
          php artisan test
          tests/Feature/InteractionSmoothnessV5110Test.php
          tests/Feature/InteractionPerformanceV518Test.php
          tests/Feature/InstantNavigationV4120Test.php
          tests/Feature/InstantNavigationFragmentV4121Test.php
          tests/Feature/WebRealDeviceFinishV5198Test.php
          tests/Feature/ActionHomeDensityV5197Test.php
          tests/Feature/RealDeviceUiRefinementV5196Test.php
          tests/Feature/PrimaryNavigationCompanionV510Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
