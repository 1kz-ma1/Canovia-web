name: V56.1 iOS Soft Launch Web Validate

on:
  push:
    branches:
      - feature/v56-1-ios-soft-launch-web-readiness

jobs:
  web-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: PHP lint
        run: |
          php -l app/Http/Controllers/LegalController.php
          php -l app/Http/Controllers/AuthController.php
          php -l app/Services/AccountDeletionService.php
          php -l routes/web.php
          php -l config/canovia.php
          php -l tests/Feature/IosSoftLaunchWebReadinessV561Test.php

      - run: php artisan view:cache
      - run: php artisan migrate --force

      - name: V56.1 soft launch web readiness
        run: php artisan test tests/Feature/IosSoftLaunchWebReadinessV561Test.php

      - name: Account regression
        run: php artisan test tests/Feature/LivingRoadmapAccountTest.php tests/Feature/AdminPremiumExperienceV417Test.php

      - name: Inbox private-file regression
        run: php artisan test tests/Feature/InboxFoundationV4113Test.php --filter=image_or_pdf_is_stored_privately

      - name: Study upload regressions
        run: php artisan test tests/Feature/StudyRecallCandidateV4112Test.php tests/Feature/StudyScopeCaptureV534Test.php

      - name: iOS Web boundary regression
        run: php artisan test tests/Feature/IosReadinessFoundationV520Test.php
