name: Local-first Preview
on:
  pull_request:
    branches: [main]
    paths: ['local-preview/**', 'tests/browser/local_preview.mjs', 'scripts/ci/local_preview_serve.py', '.github/workflows/local-first-preview.yml', 'docs/development/LOCAL_FIRST_PREVIEW*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test local-preview/test/*.test.mjs
      - run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 scripts/ci/local_preview_serve.py > /tmp/local-preview-server.log 2>&1 &
          node tests/browser/local_preview.mjs
      - run: test -z "$(git status --porcelain)"
