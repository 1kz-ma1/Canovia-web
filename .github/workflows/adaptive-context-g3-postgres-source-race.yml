name: Adaptive Context G3 PostgreSQL Companion Source Race

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/CompanionDerivedEvidenceSourceGuard.php'
      - 'app/Services/CompanionEntitlementCommitGuard.php'
      - 'app/Services/CompanionMutationApplyService.php'
      - 'app/Services/CompanionMembershipCommitGuard.php'
      - 'app/Services/StudyPracticeGenerationCommitFence.php'
      - 'app/Services/StudyPracticeAssessmentCommitFence.php'
      - 'app/Services/InboxAiSuggestionCommitFence.php'
      - 'app/Services/InboxIntelligenceService.php'
      - 'app/Services/StudyRecallExtractionCommitFence.php'
      - 'app/Services/StudyRecallCandidateExtractionService.php'
      - 'app/Services/StudyRecallCandidateReviewFence.php'
      - 'app/Services/PlanActionDraftApprovalSourceGuard.php'
      - 'tests/Feature/PlanActionDraftApprovalLockOrderPostgresG3Test.php'
      - 'app/Http/Controllers/StudyRecallCandidateController.php'
      - 'app/Models/StudyRecallCandidate.php'
      - 'resources/views/study_recall/show.blade.php'
      - 'database/migrations/2026_10_13_200000_add_recall_candidate_review_provenance.php'
      - 'tests/Feature/StudyRecallCandidateV4112Test.php'
      - 'tests/Feature/StudyRecallBatchIngestV588Test.php'
      - 'app/Services/StudyRecallBatchCandidateExtractionService.php'
      - 'tests/Feature/RecallAiCommitFenceV05Test.php'
      - 'tests/Feature/RecallInputFileRacePostgresG3Test.php'
      - 'app/Services/StudyScopeCaptureCommitFence.php'
      - 'app/Services/StudyScopeCaptureAnalysisService.php'
      - 'app/Http/Controllers/StudyScopeCaptureController.php'
      - 'tests/Feature/StudyScopeAiCommitFenceG3Test.php'
      - 'tests/Feature/StudyScopeSourceFileRacePostgresG3Test.php'
      - 'app/Services/ExecutionPacketCommitFence.php'
      - 'app/Services/ExecutionOrchestrationContextService.php'
      - 'app/Http/Controllers/ExecutionOrchestrationController.php'
      - 'tests/Feature/ExecutionPacketAiCommitFenceG3Test.php'
      - 'app/Services/ExecutionRequestHandoffService.php'
      - 'app/Services/DevelopmentCodingAgentHandoffService.php'
      - 'app/Services/ExecutionGitHubHandoffService.php'
      - 'app/Services/ExecutionDistributionService.php'
      - 'tests/Feature/DeveloperCodingAgentHandoffV578Test.php'
      - 'tests/Feature/InboxAiSuggestionCommitFenceG3Test.php'
      - 'tests/Feature/StudyPracticeGenerationCommitFenceG3Test.php'
      - 'tests/Feature/StudyAssessmentAiCommitFenceG3Test.php'
      - 'app/Models/Plan.php'
      - 'app/Models/PlanMember.php'
      - 'app/Services/GuestPlanClaimService.php'
      - 'database/migrations/2026_10_13_110000_add_authorization_epochs_to_collaborative_plans.php'
      - 'database/migrations/2026_10_13_120000_enforce_authorization_epochs_in_database.php'
      - 'database/migrations/2026_10_13_130000_immutable_plan_member_binding.php'
      - 'tests/Feature/AuthorizationEpochDatabaseTriggerG3Test.php'
      - 'app/Http/Controllers/PlanCollaborationController.php'
      - 'app/Services/CompanionConversationService.php'
      - 'tests/Feature/CompanionPostgresSourceRaceG3Test.php'
      - 'tests/Feature/CompanionGrantRevocationPostgresG3Test.php'
      - 'tests/Feature/CompanionMembershipRevocationPostgresG3Test.php'
      - 'tests/Feature/CollaborationInviteJoinPostgresG3Test.php'
      - '.github/workflows/adaptive-context-g3-postgres-source-race.yml'

jobs:
  postgres-source-race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canovia_g3_race
          POSTGRES_USER: canovia_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canovia_ci -d canovia_g3_race"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: canovia_g3_race
      DB_USERNAME: canovia_ci
      DB_PASSWORD: local_ci_only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql,pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Source guard and PostgreSQL integration lint
        run: |
          php -l app/Services/CompanionDerivedEvidenceSourceGuard.php
          php -l app/Services/CompanionEntitlementCommitGuard.php
          php -l app/Services/CompanionMutationApplyService.php
          php -l app/Services/CompanionConversationService.php
          php -l app/Services/CompanionMembershipCommitGuard.php
          php -l app/Services/StudyPracticeGenerationCommitFence.php
          php -l app/Services/StudyPracticeAssessmentCommitFence.php
          php -l app/Services/InboxAiSuggestionCommitFence.php
          php -l app/Services/InboxIntelligenceService.php
          php -l tests/Feature/InboxAiSuggestionCommitFenceG3Test.php
          php -l app/Services/StudyRecallExtractionCommitFence.php
          php -l app/Services/StudyRecallCandidateExtractionService.php
          php -l app/Services/StudyRecallCandidateReviewFence.php
          php -l app/Services/PlanActionDraftApprovalSourceGuard.php
          php -l tests/Feature/PlanActionDraftApprovalLockOrderPostgresG3Test.php
          php -l app/Http/Controllers/StudyRecallCandidateController.php
          php -l app/Models/StudyRecallCandidate.php
          php -l database/migrations/2026_10_13_200000_add_recall_candidate_review_provenance.php
          php -l tests/Feature/StudyRecallCandidateV4112Test.php
          php -l tests/Feature/StudyRecallBatchIngestV588Test.php
          php -l app/Services/StudyRecallBatchCandidateExtractionService.php
          php -l tests/Feature/RecallAiCommitFenceV05Test.php
          php -l tests/Feature/RecallInputFileRacePostgresG3Test.php
          php -l app/Services/StudyScopeCaptureCommitFence.php
          php -l app/Services/StudyScopeCaptureAnalysisService.php
          php -l app/Http/Controllers/StudyScopeCaptureController.php
          php -l tests/Feature/StudyScopeAiCommitFenceG3Test.php
          php -l tests/Feature/StudyScopeSourceFileRacePostgresG3Test.php
          php -l app/Services/ExecutionPacketCommitFence.php
          php -l app/Services/ExecutionOrchestrationContextService.php
          php -l app/Http/Controllers/ExecutionOrchestrationController.php
          php -l tests/Feature/ExecutionPacketAiCommitFenceG3Test.php
          php -l app/Services/ExecutionRequestHandoffService.php
          php -l app/Services/DevelopmentCodingAgentHandoffService.php
          php -l app/Services/ExecutionGitHubHandoffService.php
          php -l app/Services/ExecutionDistributionService.php
          php -l tests/Feature/DeveloperCodingAgentHandoffV578Test.php
          php -l tests/Feature/StudyPracticeGenerationCommitFenceG3Test.php
          php -l tests/Feature/StudyAssessmentAiCommitFenceG3Test.php
          php -l app/Models/Plan.php
          php -l app/Models/PlanMember.php
          php -l app/Services/GuestPlanClaimService.php
          php -l database/migrations/2026_10_13_110000_add_authorization_epochs_to_collaborative_plans.php
          php -l database/migrations/2026_10_13_120000_enforce_authorization_epochs_in_database.php
          php -l database/migrations/2026_10_13_130000_immutable_plan_member_binding.php
          php -l tests/Feature/AuthorizationEpochDatabaseTriggerG3Test.php
          php -l app/Http/Controllers/PlanCollaborationController.php
          php -l tests/Feature/CompanionPostgresSourceRaceG3Test.php
          php -l tests/Feature/CompanionGrantRevocationPostgresG3Test.php
          php -l tests/Feature/CompanionMembershipRevocationPostgresG3Test.php
          php -l tests/Feature/CollaborationInviteJoinPostgresG3Test.php
      - name: Independent PostgreSQL sessions source race
        run: php artisan test tests/Feature/CompanionPostgresSourceRaceG3Test.php --stop-on-failure
      - name: Independent PostgreSQL sessions entitlement revocation race
        run: php artisan test tests/Feature/CompanionGrantRevocationPostgresG3Test.php --stop-on-failure
      - name: Independent PostgreSQL sessions membership removal and role downgrade race
        run: php artisan test tests/Feature/CompanionMembershipRevocationPostgresG3Test.php --stop-on-failure
      - name: Direct SQL authorization epoch trigger regression (PostgreSQL 16)
        run: |
          php artisan migrate --force --no-interaction
          php artisan test tests/Feature/AuthorizationEpochDatabaseTriggerG3Test.php --stop-on-failure
      - name: Study Native generation and assessment authorization epoch regression on PostgreSQL 16
        run: php artisan test tests/Feature/StudyPracticeGenerationCommitFenceG3Test.php tests/Feature/StudyAssessmentAiCommitFenceG3Test.php --stop-on-failure
      - name: Inbox AI membership epochs on PostgreSQL 16
        run: php artisan test tests/Feature/InboxAiSuggestionCommitFenceG3Test.php --stop-on-failure
      - name: Recall single and batch membership epochs on PostgreSQL 16
        run: php artisan test tests/Feature/RecallAiCommitFenceV05Test.php --stop-on-failure
      - name: Action Draft approval parent-first lock and repository revocation on PostgreSQL 16
        run: php artisan test tests/Feature/PlanActionDraftApprovalLockOrderPostgresG3Test.php --stop-on-failure
      - name: Recall exact provider input file bytes and independent Source race on PostgreSQL 16
        run: php artisan test tests/Feature/RecallInputFileRacePostgresG3Test.php --stop-on-failure
      - name: Recall human approval signed provenance on PostgreSQL 16
        run: php artisan test tests/Feature/StudyRecallCandidateV4112Test.php tests/Feature/StudyRecallBatchIngestV588Test.php --stop-on-failure
      - name: Study Scope physical file deletion and input-byte race on independent PostgreSQL 16 sessions
        run: php artisan test tests/Feature/StudyScopeSourceFileRacePostgresG3Test.php --stop-on-failure
      - name: Study Scope authorization epoch and stale failure regression on PostgreSQL 16
        run: php artisan test tests/Feature/StudyScopeAiCommitFenceG3Test.php --stop-on-failure
      - name: Execution Packet authorization epochs on PostgreSQL 16
        run: php artisan test tests/Feature/ExecutionPacketAiCommitFenceG3Test.php --stop-on-failure
      - name: Developer Brief handoff epoch and source lineage on PostgreSQL 16
        run: php artisan test tests/Feature/DeveloperCodingAgentHandoffV578Test.php --stop-on-failure
      - name: Independent PostgreSQL sessions invitation join and revoke race
        run: php artisan test tests/Feature/CollaborationInviteJoinPostgresG3Test.php --stop-on-failure
