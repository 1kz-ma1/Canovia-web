name: V51.7 temporary validation

on:
  push:
    branches:
      - feature/v51-7-constellation-shape-grammar

permissions:
  contents: read

jobs:
  constellation-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.7 and constellation regressions
        run: >
          php artisan test
          tests/Feature/ConstellationShapeGrammarV517Test.php
          tests/Feature/SurfaceRefinementPhase1V516Test.php
          tests/Feature/ConstellationRoadmapV511Test.php
          tests/Feature/RoadmapSpatialMapV480Test.php
          tests/Feature/PrimaryNavigationCompanionV510Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
