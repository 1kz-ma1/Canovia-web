name: Prelaunch Indirect Interest Scoring v0

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/PrelaunchInterestScoringService.php'
      - 'config/prelaunch_interest_diagnostic.php'
      - 'tests/Unit/PrelaunchInterestScoringServiceTest.php'
      - '.github/workflows/prelaunch-interest-scoring-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax checks
        run: |
          php -l config/prelaunch_interest_diagnostic.php
          php -l app/Services/PrelaunchInterestScoringService.php
          php -l tests/Unit/PrelaunchInterestScoringServiceTest.php
      - name: Install only project-defined development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Scoring contract, unknown/missing and stable percentages
        run: vendor/bin/phpunit tests/Unit/PrelaunchInterestScoringServiceTest.php --colors=never
