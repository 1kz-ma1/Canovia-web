name: Future Native API isolated lab
on:
  push:
    branches: [feature/future-support-native-api-20261116]
    paths:
      - 'app/**'
      - 'config/future_support.php'
      - 'experiments/FutureSupport/**'
      - 'routes/api.php'
      - 'tests/Feature/FutureNativeSupportTest.php'
      - 'scripts/ci/future_support_lab.php'
      - '.github/workflows/future-native-api.yml'
permissions:
  contents: read
jobs:
  disposable-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm run build
      - name: Native authority negatives and existing Web Support regression
        run: |
          set -euo pipefail
          python3 - <<'PYENV'
          from pathlib import Path
          with Path('.env').open('x') as output:
              output.write('APP_ENV=testing\n')
          PYENV
          php artisan test --display-warnings --fail-on-warning tests/Feature/FutureNativeSupportTest.php tests/Feature/CanoviaFutureV407Test.php tests/Feature/CanoviaFutureCarouselTest.php
