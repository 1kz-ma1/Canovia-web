name: MCP Auth0 JP Tenant Public Metadata Observation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcp-auth0-jp-tenant-observation.yml'

permissions:
  contents: read

jobs:
  auth0-tenant-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auth0 probe regression checks (synthetic only)
        run: python3 -m unittest discover -s tests/ci -p test_mcp_auth0_metadata_characterization.py -v
      - name: Observe owner's public Auth0 JP tenant discovery (no authentication)
        # A false outcome signals metadata incompatibility or a network issue;
        # neither result authorizes activation. Never obtain a token or secret.
        continue-on-error: true
        run: python3 scripts/ci/mcp_auth0_metadata_characterization.py --tenant-domain canovia-mcp-dev.jp.auth0.com
      - name: Observe public metadata capability names only (no raw body)
        # Print an allowlist of public protocol metadata, not account/user data.
        continue-on-error: true
        env:
          AUTH0_TENANT_DOMAIN: canovia-mcp-dev.jp.auth0.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          domain = os.environ["AUTH0_TENANT_DOMAIN"]
          request = urllib.request.Request(
              "https://" + domain + "/.well-known/openid-configuration",
              headers={"Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=8) as response:
                  doc = json.loads(response.read(12289))
              allowed = ("issuer", "code_challenge_methods_supported",
                         "authorization_response_iss_parameter_supported",
                         "token_endpoint_auth_methods_supported",
                         "client_id_metadata_document_supported",
                         "registration_endpoint", "introspection_endpoint",
                         "scopes_supported")
              print(json.dumps({k: doc.get(k, "not_advertised") for k in allowed}, sort_keys=True))
          except Exception as e:
              # Never log URLs/response bodies; classify the error only.
              print("public_discovery_fetch_class=" + type(e).__name__)
              raise SystemExit(1)
          PY
