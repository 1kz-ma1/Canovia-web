name: V58.1 Developer Navigation IA Validation

on:
  push:
    branches:
      - feature/v58-1-developer-navigation-ia
  pull_request:
    branches:
      - main

jobs:
  developer-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/DevelopmentWorkspaceSurfaceService.php
          php -l tests/Feature/DeveloperNavigationIAV581Test.php
          php -l tests/Feature/DeveloperWorkspaceSurfacesV580Test.php
          php -l tests/Feature/DeveloperHomeV573Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.1 navigation IA
        run: php artisan test tests/Feature/DeveloperNavigationIAV581Test.php
      - name: V58.0 focused surfaces regression
        run: php artisan test tests/Feature/DeveloperWorkspaceSurfacesV580Test.php
      - name: Developer Home regression
        run: php artisan test tests/Feature/DeveloperHomeV573Test.php
      - name: Development Workspace regression
        run: php artisan test tests/Feature/DevelopmentWorkspaceV544Test.php
      - name: Developer implementation chain regression
        run: php artisan test tests/Feature/DeveloperImplementationBriefV576Test.php tests/Feature/DeveloperProviderTriageV577Test.php tests/Feature/DeveloperCodingAgentHandoffV578Test.php
      - name: Desktop and Workspace shell regression
        run: php artisan test tests/Feature/DesktopHeaderDensityV579Test.php tests/Feature/WorkspaceModeBarV541Test.php tests/Feature/WorkspaceModePersistenceV542Test.php tests/Feature/MobileWorkspaceModeEntryV566Test.php
