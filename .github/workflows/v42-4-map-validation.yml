name: V42.4 Map validation telemetry

on:
  push:
    branches:
      - feature/v42-4-map-validation-telemetry

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php -l app/Enums/BehaviorEventType.php
      - run: php -l app/Http/Controllers/BehaviorEventController.php
      - run: php -l app/Http/Controllers/WorkSessionController.php
      - run: php -l app/Http/Controllers/AdminDashboardController.php
      - run: php -l app/Services/MapTelemetryService.php
      - run: php artisan view:cache
      - run: node --test tests/js/living-map-v421.test.mjs tests/js/map-telemetry-v424.test.mjs
      - run: php artisan test tests/Feature/BehaviorTrackingTest.php --filter=test_work_session_start_records_the_observable_start_events
      - run: php artisan test tests/Feature/BehaviorTrackingTest.php --filter=test_client_event_cannot_reference_a_plan_the_browser_does_not_own
      - run: php artisan test tests/Feature/CanoviaMapV420Test.php tests/Feature/CanoviaMapFocusV421Test.php tests/Feature/CanoviaMapLivingReevaluationV422Test.php tests/Feature/CanoviaMapContextualCompanionV423Test.php tests/Feature/CanoviaMapTelemetryV424Test.php tests/Feature/AdminPremiumExperienceV417Test.php tests/Feature/FirstRunUxV4123Test.php tests/Feature/InstantNavigationV4120Test.php tests/Feature/InstantNavigationFragmentV4121Test.php


  baseline-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Feature/BehaviorTrackingTest.php
