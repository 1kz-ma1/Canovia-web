name: Release20 Transition Safety

on:
  pull_request:
    branches: [main, fix/release20-private-schema-diagnostics]
    paths:
      - 'app/Support/Release20*'
      - 'resources/release20_pending_schema_contract.json'
      - 'database/migrations/**'
      - 'scripts/ci/release20*'
      - 'tests/ci/test_release20*'
      - 'tests/Feature/Release20TransitionPreflightTest.php'
      - '.github/workflows/release20-transition-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Transition PHP and offline safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: >-
          php artisan test tests/Feature/Release20TransitionPreflightTest.php
          tests/Feature/IntegratedRelease20MigrationSafetyTest.php
          tests/Feature/ReleaseSchemaLedgerFenceTest.php --colors=never
      - run: python3 -B -m unittest discover -s tests/ci -p 'test_integrated_release20*.py' -v
      - run: python3 -B -m unittest discover -s tests/ci -p 'test_release20*.py' -v
      - run: python3 -B scripts/ci/release20_proposal_packet.py --proposal-sha "$(git rev-parse HEAD)"
  transition:
    name: All20 alias transition (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Own disposable loopback MySQL only
        env:
          SERIES: ${{ matrix.series }}
        run: |
          set -euo pipefail
          if [ "$SERIES" = '8.0' ]; then name=canovia-integration-80; port=13380; else name=canovia-integration-84; port=13384; fi
          docker run -d --name "$name" --label canovia.integration=2026-10-16 \
            -p "127.0.0.1:$port:3306" -e MYSQL_ROOT_PASSWORD=ci-only-root-password \
            -e MYSQL_DATABASE=canovia_p0_ci -e MYSQL_USER=canovia_ci \
            -e MYSQL_PASSWORD=ci-only-ephemeral-password "mysql:$SERIES" --log-bin-trust-function-creators=1
          for attempt in $(seq 1 60); do
            if docker exec -e MYSQL_PWD=ci-only-ephemeral-password "$name" mysql --protocol=TCP -h127.0.0.1 -u canovia_ci -Nse 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Rehearse aliases, collisions, retained data, interruptions and replay
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -B scripts/ci/release20_transition_mysql.py --series "$SERIES"
