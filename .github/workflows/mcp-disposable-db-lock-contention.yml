name: MCP Disposable DB Lock Contention

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/Feature/McpDatabaseLockContentionTest.php'
      - 'tests/Feature/McpMigrationRollbackSafetyTest.php'
      - 'app/Services/McpReadOnlyContextTool.php'
      - 'app/Services/McpDelegatedPlanAccessPolicy.php'
      - 'app/Services/McpStudyPilotAccessPolicy.php'
      - 'app/Services/McpDelegatedRevocationService.php'
      - 'app/Services/McpOAuthAccountLinkCommitter.php'
      - 'database/migrations/2026_10_14_000100_allow_nonexpiring_mcp_grants.php'
      - 'database/migrations/2026_10_14_000200_preserve_historical_mcp_identity_links.php'
      - '.github/workflows/mcp-disposable-db-lock-contention.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-real-db-contention:
    name: 'MCP row locks (${{ matrix.label }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: 'PostgreSQL 17', driver: 'pgsql', image: 'postgres:17-alpine', port: 5432, health: 'pg_isready -U canovia_ci -d canovia_mcp_lock_ci'}
          - {label: 'MySQL 8.0', driver: 'mysql', image: 'mysql:8.0', port: 3306, health: 'mysqladmin ping --silent'}
          - {label: 'MySQL 8.4', driver: 'mysql', image: 'mysql:8.4', port: 3306, health: 'mysqladmin ping --silent'}
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: canovia_mcp_lock_ci
          POSTGRES_USER: canovia_ci
          POSTGRES_PASSWORD: ci-only-disposable-pass
          MYSQL_ROOT_PASSWORD: ci-only-root-pass
          MYSQL_DATABASE: canovia_mcp_lock_ci
          MYSQL_USER: canovia_ci
          MYSQL_PASSWORD: ci-only-disposable-pass
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: ${{ matrix.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: canovia_mcp_lock_ci
      DB_USERNAME: canovia_ci
      DB_PASSWORD: ci-only-disposable-pass
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CANOVIA_MCP_DISPOSABLE_LOCK_CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Assert target is disposable and loopback-only
        run: |
          set -euo pipefail
          test "$APP_ENV" = 'testing'
          test "$CANOVIA_MCP_DISPOSABLE_LOCK_CI" = '1'
          test "$DB_HOST" = '127.0.0.1'
          test "$DB_DATABASE" = 'canovia_mcp_lock_ci'
          case "$DB_CONNECTION:$DB_PORT" in
            mysql:3306|pgsql:5432) ;;
            *) echo 'MCP CI database target mismatch' >&2; exit 1 ;;
          esac
      - name: Allow disposable MySQL database trigger DDL
        if: matrix.driver == 'mysql'
        env:
          MYSQL_PWD: ci-only-root-pass
        run: |
          set -euo pipefail
          mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
            --user=root --database=canovia_mcp_lock_ci \
            -e 'SET GLOBAL log_bin_trust_function_creators = 1'
      - name: Install dependencies without external credentials
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Lint concurrency matrix
        run: |
          php -l tests/Feature/McpDatabaseLockContentionTest.php
          php -l tests/Feature/McpMigrationRollbackSafetyTest.php
      - name: Migrate ONLY the CI disposable database
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate --force --no-interaction
      - name: Verify real two-connection MCP lock and uniqueness behavior
        run: php artisan test tests/Feature/McpDatabaseLockContentionTest.php tests/Feature/McpMigrationRollbackSafetyTest.php --fail-on-skipped --stop-on-failure --colors=never
