name: V56.5 Study Practice Resume Validation

on:
  push:
    branches:
      - feature/v56-5-study-practice-resume-fast-path

jobs:
  resume-fast-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/StudyPracticeController.php
          php -l routes/web.php
          php -l tests/Feature/StudyPracticeResumeFastPathV565Test.php
          php -l tests/Feature/StudyPracticeDraftPersistenceV4071Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V56.5 resume fast path
        run: php artisan test tests/Feature/StudyPracticeResumeFastPathV565Test.php
      - name: V40.7.1 draft persistence
        run: php artisan test tests/Feature/StudyPracticeDraftPersistenceV4071Test.php
      - name: V40.7.3 result recovery
        run: php artisan test tests/Feature/StudyPracticeResultRecoveryV4073Test.php
      - name: V40.7.4 guided flow
        run: php artisan test tests/Feature/StudyPracticeGuidedFlowV4074Test.php
      - name: V56.4 routing
        run: php artisan test tests/Feature/StudyPracticeRoutingV564Test.php
      - name: Question Bank
        run: php artisan test tests/Feature/QuestionBankV402Test.php
      - name: Native AI Practice
        run: php artisan test tests/Feature/NativeAiPracticeV418Test.php
      - name: Study Workspace
        run: php artisan test tests/Feature/StudyWorkspaceV4186Test.php
