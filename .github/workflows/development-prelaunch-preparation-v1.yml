name: Development Prelaunch Preparation V1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax preflight
        run: |
          php -l app/Services/DevelopmentPrelaunchPreparationService.php
          php -l app/Services/DevelopmentOperationalEvidenceService.php
          php -l app/Services/DevelopmentOperationalAttestationService.php
          php -l app/Services/DevelopmentOperationalProviderBoundaryService.php
          php -l app/Services/DevelopmentOperationalProviderCapabilityService.php
          php -l app/Services/DevelopmentOperationalOperatorHandoffService.php
          php -l app/Services/DevelopmentOperationalOperatorReadinessService.php
          php -l app/Models/DevelopmentOperationalTarget.php
          php -l app/Http/Controllers/DevelopmentOperationalTargetController.php
          php -l database/migrations/2026_10_14_164000_create_development_operational_targets_table.php
          php -l database/migrations/2026_10_14_185000_add_manual_service_check_to_development_operational_targets_table.php
          php -l app/Models/DevelopmentOperationalProfile.php
          php -l app/Http/Controllers/DevelopmentOperationalProfileController.php
          php -l database/migrations/2026_10_14_154500_create_development_operational_profiles_table.php
          php -l app/Http/Controllers/DevelopmentWorkspaceController.php
          php -l tests/Unit/DevelopmentPrelaunchPreparationServiceTest.php
          php -l tests/Feature/DevelopmentPrelaunchPreparationV1Test.php
          php -l tests/Unit/DevelopmentOperationalEvidenceServiceTest.php
          php -l tests/Feature/DevelopmentOperationalEvidenceV2Test.php
          php -l tests/Unit/DevelopmentOperationalProfileV3Test.php
          php -l tests/Feature/DevelopmentOperationalProfileV3FeatureTest.php
          php -l tests/Unit/DevelopmentOperationalAttestationV4Test.php
          php -l tests/Unit/DevelopmentOperationalProviderBoundaryV5Test.php
          php -l tests/Unit/DevelopmentOperationalProviderCapabilityV51Test.php
          php -l tests/Unit/DevelopmentOperationalOperatorHandoffV52Test.php
          php -l tests/Unit/DevelopmentOperationalOperatorReadinessV54Test.php
          php -l tests/Feature/DevelopmentOperationalAttestationV4FeatureTest.php
          php -l tests/Feature/DevelopmentOperationalAcceptanceV55Test.php
          php -l tests/Feature/DevelopmentOperationalConflictV56Test.php
      - name: Compile Blade templates
        run: php artisan view:cache
      - name: Targeted behavior and Workspace regression
        run: |
          php artisan test \
            tests/Unit/DevelopmentPrelaunchPreparationServiceTest.php \
            tests/Unit/DevelopmentOperationalEvidenceServiceTest.php \
            tests/Unit/DevelopmentOperationalProfileV3Test.php \
            tests/Unit/DevelopmentOperationalAttestationV4Test.php \
            tests/Unit/DevelopmentOperationalProviderBoundaryV5Test.php \
            tests/Unit/DevelopmentOperationalProviderCapabilityV51Test.php \
            tests/Unit/DevelopmentOperationalOperatorHandoffV52Test.php \
            tests/Unit/DevelopmentOperationalOperatorReadinessV54Test.php \
            tests/Feature/DevelopmentPrelaunchPreparationV1Test.php \
            tests/Feature/DevelopmentOperationalEvidenceV2Test.php \
            tests/Feature/DevelopmentOperationalProfileV3FeatureTest.php \
            tests/Feature/DevelopmentOperationalAttestationV4FeatureTest.php \
            tests/Feature/DevelopmentOperationalAcceptanceV55Test.php \
            tests/Feature/DevelopmentOperationalConflictV56Test.php \
            tests/Feature/DevelopmentWorkspaceV544Test.php \
            tests/Feature/DeveloperHomeV573Test.php \
            tests/Feature/DeveloperWorkspaceSurfacesV580Test.php
