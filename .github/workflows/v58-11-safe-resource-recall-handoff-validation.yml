name: V58.11 Safe Resource Recall Handoff Validation

on:
  push:
    branches:
      - feature/v58-11-safe-resource-recall-handoff

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Models/StudyRecallSource.php
          php -l app/Models/PlanResource.php
          php -l app/Http/Controllers/StudyRecallController.php
          php -l app/Http/Controllers/StudyRecallCandidateController.php
          php -l database/migrations/2026_10_06_101500_add_plan_resource_id_to_study_recall_sources.php
          php -l tests/Feature/SafePlanResourceRecallHandoffV5811Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.11 dedicated safe Resource Recall handoff
        run: php artisan test tests/Feature/SafePlanResourceRecallHandoffV5811Test.php
      - name: V41.12 direct Recall Candidate regression
        run: php artisan test tests/Feature/StudyRecallCandidateV4112Test.php
      - name: V58.7 Recall Source retry regression
        run: php artisan test tests/Feature/StudyRecallSourceRetryV587Test.php
      - name: V58.8 Recall batch ingest regression
        run: php artisan test tests/Feature/StudyRecallBatchIngestV588Test.php
      - name: V58.9 Recall Candidate outcome regression
        run: php artisan test tests/Feature/StudyRecallCandidateOutcomeTraceV589Test.php
      - name: Account deletion storage cleanup regression
        run: php artisan test --filter=AccountDeletion
