name: Learning V6.25 AP80 Revision Recheck

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learning-v625-ap80-revision-recheck.yml'
      - 'app/Services/ApExamCandidateRevisionComparisonService.php'
      - 'app/Console/Commands/CompareApExamCandidateHumanRevisions.php'
      - 'tests/Feature/ApExamCandidateRevisionComparisonV625Test.php'
      - 'app/Services/ApExamCandidateHumanReviewIntakeService.php'
      - 'app/Services/ApExamCandidateRevisionPreviewService.php'
      - 'app/Services/ApExamCandidateQualityReviewService.php'
      - 'resources/question_packs/ap/ap-a-2026-cbt-80-candidate-v2.json'
      - 'resources/learning_review/**'
      - 'docs/development/LEARNING_AP80_REVISION_RECHECK_V6_25_2026_10_15.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ap80-revision-v625:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up disposable offline Laravel environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "NATIVE_AI_DRIVER=disabled" >> .env
          php artisan key:generate --force --no-interaction
          php -l app/Services/ApExamCandidateRevisionComparisonService.php
          php -l app/Console/Commands/CompareApExamCandidateHumanRevisions.php
          php -l tests/Feature/ApExamCandidateRevisionComparisonV625Test.php
      - name: New revision comparison and unchanged original review gates
        run: |
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array \
          php artisan test \
            tests/Feature/ApExamCandidateRevisionComparisonV625Test.php \
            tests/Feature/ApExamCandidateHumanReviewIntakeV624Test.php \
            tests/Feature/ApExamCandidateQualityReviewTest.php \
            tests/Feature/ApExamCandidateRevisionPreviewTest.php \
            tests/Feature/ApExamCandidateBundleAuditTest.php
      - name: Explicit proof limit
        run: |
          echo "Structural SHA/field comparison only: no real reviewer identity, changed Draft file, independent signoff, import, publishing, Render or device."
