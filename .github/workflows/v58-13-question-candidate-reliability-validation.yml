name: V58.13 Question Candidate Reliability Validation

on:
  push:
    branches:
      - feature/v58-13-question-candidate-reliability

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Services/PracticeQuestionCandidateReliabilitySignalService.php
          php -l app/Services/StudyPracticeReliabilityService.php
          php -l tests/Feature/QuestionCandidateReliabilityV5813Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.13 dedicated Candidate Reliability contract
        run: php artisan test tests/Feature/QuestionCandidateReliabilityV5813Test.php
      - name: V41.9 Candidate operations regression
        run: php artisan test tests/Feature/PracticeDemandCandidatesV419Test.php
      - name: V41.10 Practice Reliability regression
        run: php artisan test tests/Feature/StudyActivityPolicyV4110Test.php
      - name: V58.12 Activity outcome observation regression
        run: php artisan test tests/Feature/StudyActivityOutcomeObservationV5812Test.php
      - name: V56.5 Practice resume UI regression
        run: php artisan test tests/Feature/StudyPracticeResumeFastPathV565Test.php
