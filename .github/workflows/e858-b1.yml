name: E858 B1 Integrated Boundaries
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/e858_phase1/**'
      - 'scripts/ci/e858_b1_host.py'
      - 'scripts/ci/e858_practical_host.py'
      - 'tests/ci/test_e858_practical.py'
      - 'tests/ci/test_e858_practical_stop.py'
      - 'tests/ci/test_e858_phase1_application.py'
      - 'tests/ci/test_e858_opener_candidate.py'
      - 'tests/ci/test_e858_backend_launcher.py'
      - 'tests/ci/test_e858_owned_activation.py'
      - 'tests/ci/test_e858_tls_handoff.py'
      - 'tests/ci/test_e858_b2_signature_fixture.py'
      - 'tests/ci/test_e858_b2_p256_synthetic_interop.py'
      - 'tests/ci/test_e858_b2_owner_briefing.py'
      - 'tests/ci/test_e858_b1_attempt_reservation.py'
      - 'tests/ci/test_e858_b_procedural_attempt.py'
      - 'tests/ci/test_e858_b2_synthetic_consumption.py'
      - 'tests/ci/test_e858_b1_*.py'
      - '.github/workflows/e858-b1.yml'
      - 'docs/development/integration/2026-10-18-b/e858-real-audit-route-safety.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: B1 package and entry (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-15, python: '3.12'}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python3 -m pip install --no-compile PyMySQL==1.1.2 cryptography==46.0.3
          echo "B1_BUILD_DIR=$RUNNER_TEMP/b1-review" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/b1-review"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/b1-review" PyMySQL==1.1.2
      - name: Own a synthetic Linux directory under trusted ancestors
        if: runner.os == 'Linux'
        run: |
          B1_TEST_PARENT="/canovia-b1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$B1_TEST_PARENT"
          echo "B1_SYNTHETIC_PARENT=$B1_TEST_PARENT" >> "$GITHUB_ENV"
      - run: |
          # setup-python injects this Linux loader override. Start the test
          # interpreter without it; Program must keep rejecting overrides.
          unset LD_LIBRARY_PATH
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_operator.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_integrity.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_bundle.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_practical.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_practical_stop.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_phase1_application.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_opener_candidate.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_backend_launcher.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_owned_activation.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_tls_handoff.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b2_signature_fixture.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b2_p256_synthetic_interop.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b2_owner_briefing.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_attempt_reservation.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b_procedural_attempt.py -v
          PYTHONPATH=scripts/ci python3 -S -B -m e858_phase1.b2_owner_briefing --print-public-briefing | grep -F 'PRODUCTION_NO_GO_HOLD'
          PYTHONPATH=scripts/ci python3 -S -B -m e858_phase1.b2_owner_briefing --print-public-briefing | grep -F '不一致・異常時の対応:'
          ! (PYTHONPATH=scripts/ci python3 -S -B -m e858_phase1.b2_owner_briefing --print-public-briefing --target PRIVATE_VALUE_TO_BE_REDACTED 2>&1 | grep -F PRIVATE_VALUE_TO_BE_REDACTED)
          python3 -B -m unittest discover -s tests/ci -p test_e858_b2_synthetic_consumption.py -v
      - name: Read-only macOS B2 candidate capability inventory (not owner GO)
        if: runner.os == 'macOS'
        run: |
          swift scripts/ci/e858_phase1/b2_mac_capability_probe.swift | python3 -c '
          import json,sys
          obj=json.load(sys.stdin)
          assert set(obj) == {
            "kind", "secure_enclave_available", "biometric_policy_evaluable",
            "signing_key_created", "owner_identity_verified",
            "fresh_owner_consent_verified", "independent_authority_verified",
            "revocation_verified", "durable_one_shot_verified",
            "execution_allowed", "real_aiven_connected", "production_go"
          }
          assert obj["kind"] == "E858_B2_MAC_LOCAL_CAPABILITY_REVIEW_V0"
          assert type(obj["secure_enclave_available"]) is bool
          assert type(obj["biometric_policy_evaluable"]) is bool
          for key in obj:
            if key not in ("kind", "secure_enclave_available", "biometric_policy_evaluable"):
              assert obj[key] is False, key
          print("MAC_CAPABILITY_ONLY_NOT_AUTHORIZED")
          '
      - name: Verify synthetic software CryptoKit P256 x963/DER via Python
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          swift scripts/ci/e858_phase1/b2_p256_software_interop.swift | python3 -c '
          import json,sys
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec,utils
          packet=json.load(sys.stdin)
          assert set(packet) == {
              "kind", "message", "public_key_x963_hex", "signature_der_hex",
              "secure_enclave_used", "key_persisted", "owner_authenticated",
              "execution_allowed", "production_go"
          }
          assert packet["kind"]=="E858_B2_SYNTHETIC_SOFTWARE_P256_INTEROP_V0"
          assert packet["message"]=="CANOVIA_E858_B2_SYNTHETIC_SOFTWARE_P256_INTEROP_V0"
          for name in ("secure_enclave_used", "key_persisted",
                       "owner_authenticated", "execution_allowed", "production_go"):
              assert packet[name] is False, name
          public_bytes=bytes.fromhex(packet["public_key_x963_hex"])
          signature=bytes.fromhex(packet["signature_der_hex"])
          assert len(public_bytes)==65 and public_bytes[0]==4
          r,s=utils.decode_dss_signature(signature)
          assert utils.encode_dss_signature(r,s)==signature
          public=ec.EllipticCurvePublicKey.from_encoded_point(ec.SECP256R1(),public_bytes)
          public.verify(signature,packet["message"].encode("ascii"),ec.ECDSA(hashes.SHA256()))
          try:
              public.verify(signature,packet["message"].encode("ascii")+b"!",ec.ECDSA(hashes.SHA256()))
          except Exception:
              pass
          else:
              raise AssertionError("TAMPER_NOT_REJECTED")
          print("SYNTHETIC_SOFTWARE_P256_INTEROP_ONLY_NOT_OWNER_GO")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: b1-offline-bundle-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/b1-review/b1-candidate.zip
          if-no-files-found: error
          retention-days: 7
  mysql:
    name: B1 Full94 real driver (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          python3 -m pip install PyMySQL==1.1.2 cryptography==46.0.3
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Synthetic files to TTY to Control/Data to strict comparator
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -I -B scripts/ci/e858_practical_host.py --series "$SERIES" --tooling-sha "$(git rev-parse HEAD)"
      - run: test -z "$(git status --porcelain)"
