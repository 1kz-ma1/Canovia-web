name: E858 B1 Integrated Boundaries
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/e858_phase1/**'
      - 'scripts/ci/e858_b1_host.py'
      - 'scripts/ci/e858_practical_host.py'
      - 'tests/ci/test_e858_practical.py'
      - 'tests/ci/test_e858_practical_stop.py'
      - 'tests/ci/test_e858_phase1_application.py'
      - 'tests/ci/test_e858_opener_candidate.py'
      - 'tests/ci/test_e858_b1_*.py'
      - '.github/workflows/e858-b1.yml'
      - 'docs/development/integration/2026-10-18-b/e858-real-audit-route-safety.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: B1 package and entry (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-15, python: '3.12'}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python3 -m pip install --no-compile PyMySQL==1.1.2 cryptography==46.0.3
          echo "B1_BUILD_DIR=$RUNNER_TEMP/b1-review" >> "$GITHUB_ENV"
          mkdir -m 700 "$RUNNER_TEMP/b1-review"
          python3 -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/b1-review" PyMySQL==1.1.2
      - name: Own a synthetic Linux directory under trusted ancestors
        if: runner.os == 'Linux'
        run: |
          B1_TEST_PARENT="/canovia-b1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$B1_TEST_PARENT"
          echo "B1_SYNTHETIC_PARENT=$B1_TEST_PARENT" >> "$GITHUB_ENV"
      - run: |
          # setup-python injects this Linux loader override. Start the test
          # interpreter without it; Program must keep rejecting overrides.
          unset LD_LIBRARY_PATH
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_operator.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_integrity.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_b1_bundle.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_practical.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_practical_stop.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_phase1_application.py -v
          python3 -B -m unittest discover -s tests/ci -p test_e858_opener_candidate.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: b1-offline-bundle-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/b1-review/b1-candidate.zip
          if-no-files-found: error
          retention-days: 7
  mysql:
    name: B1 Full94 real driver (MySQL ${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        series: ['8.0','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          python3 -m pip install PyMySQL==1.1.2 cryptography==46.0.3
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Synthetic files to TTY to Control/Data to strict comparator
        env:
          SERIES: ${{ matrix.series }}
        run: python3 -I -B scripts/ci/e858_practical_host.py --series "$SERIES" --tooling-sha "$(git rev-parse HEAD)"
      - run: test -z "$(git status --porcelain)"
