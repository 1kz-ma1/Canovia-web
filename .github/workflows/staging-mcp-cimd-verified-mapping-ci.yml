name: Staging MCP signed CIMD client binding

on:
  pull_request:
    branches: [staging/mcp-azp-id-form-diagnostic-20261014]
    paths:
      - 'config/canovia_staging.php'
      - 'app/Services/McpAuth0JwtTokenVerifier.php'
      - 'tests/Feature/McpAuth0JwtTokenVerifierTest.php'
      - 'tests/Feature/McpAuth0JwtProviderRoutingTest.php'
      - '.github/workflows/staging-mcp-cimd-verified-mapping-ci.yml'

permissions:
  contents: read

jobs:
  isolated-signature-and-binding-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, tokenizer, openssl
          tools: composer:v2
          coverage: none
      - name: Use lockfile dependencies, never Composer scripts
        run: |
          composer validate --strict --no-interaction
          composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins
      - name: Syntax check exact scope
        run: |
          php -l config/canovia_staging.php
          php -l app/Services/McpAuth0JwtTokenVerifier.php
          php -l tests/Feature/McpAuth0JwtTokenVerifierTest.php
          php -l tests/Feature/McpAuth0JwtProviderRoutingTest.php
      - name: Signed JWT and Plan-policy negative tests
        run: |
          php artisan test tests/Feature/McpAuth0JwtTokenVerifierTest.php tests/Feature/McpAuth0JwtProviderRoutingTest.php tests/Feature/McpStagingAuthFailureDiagnosticTest.php tests/Unit/McpJwtClaimConstraintsTest.php tests/Feature/McpReadOnlyResourceTest.php --colors=never
