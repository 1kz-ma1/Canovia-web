name: V54.0 Validate

on:
  push:
    branches:
      - feature/v54-0-workspace-mode-contract

jobs:
  workspace-mode-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Lint V54.0 PHP
        run: find app/Enums/WorkspaceMode.php app/Enums/WorkspaceModeSource.php app/Data/WorkspaceModeDefinitionData.php app/Data/WorkspaceModeContextData.php app/Services/WorkspaceModeRegistry.php app/Services/WorkspaceModeResolver.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: V54.0 Registry
        run: php artisan test tests/Unit/WorkspaceModeRegistryV540Test.php

      - name: V54.0 Resolver
        run: php artisan test tests/Feature/WorkspaceModeResolverV540Test.php

      - name: Plan category profile regression
        run: php artisan test tests/Feature/AdaptiveSurfaceEngineV412Test.php

      - name: V53.9 Intelligence UX regression
        run: php artisan test tests/Feature/IntelligenceUxV539Test.php

      - name: V53.8 Developer Readiness regression
        run: php artisan test tests/Feature/DeveloperReadinessV538Test.php

      - name: V53.6 Study Adaptive Action regression
        run: php artisan test tests/Feature/StudyAdaptiveActionV536Test.php
