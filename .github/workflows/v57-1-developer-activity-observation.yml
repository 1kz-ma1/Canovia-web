name: V57.1 Developer Activity Observation Validation

on:
  push:
    branches:
      - feature/v57-1-developer-activity-observation
  pull_request:
    branches:
      - main

jobs:
  developer-activity-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/GitHubWorkflowController.php
          php -l app/Jobs/BootstrapGitHubDevelopmentActivity.php
          php -l app/Jobs/ProcessGitHubWebhookDelivery.php
          php -l app/Models/DevelopmentActivityObservation.php
          php -l app/Services/GitHubDevelopmentObservationService.php
          php -l app/Services/GitHubRepositoryWriter.php
          php -l database/migrations/2026_10_06_020000_create_development_activity_observations_table.php
          php -l tests/Feature/DeveloperActivityObservationV571Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V57.1 observation
        run: php artisan test tests/Feature/DeveloperActivityObservationV571Test.php
      - name: Developer Evidence regression
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php
      - name: Developer Readiness regression
        run: php artisan test tests/Feature/DeveloperReadinessV538Test.php
      - name: GitHub connection regression
        run: php artisan test tests/Feature/GitHubAppConnectionV465Test.php tests/Feature/GitHubIntegrationStabilizationV570Test.php
