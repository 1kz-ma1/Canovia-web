name: Adaptive Context G3 Developer Source Freshness

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Services/DevelopmentDerivedContextFreshnessGuard.php'
      - 'app/Services/DevelopmentPersonalizationSignalService.php'
      - 'app/Services/PersonalizationContextService.php'
      - 'app/Services/PersonalizationLivingProfileService.php'
      - 'app/Services/GitHubTaskEvidenceCommitGuard.php'
      - 'app/Services/GitHubDevelopmentEvidenceService.php'
      - 'app/Services/GitHubReturnEvidenceService.php'
      - 'app/Jobs/ProcessGitHubWebhookDelivery.php'
      - 'tests/Feature/CandidateEvidenceReopenV5832Test.php'
      - 'tests/Feature/DeveloperEvidenceSyncV537Test.php'
      - 'tests/Feature/GitHubWebhookReturnSyncV4610Test.php'
      - '.github/workflows/adaptive-context-g3-dev-freshness.yml'

jobs:
  developer-source-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          php -l app/Services/DevelopmentDerivedContextFreshnessGuard.php
          php -l app/Services/DevelopmentPersonalizationSignalService.php
          php -l app/Services/PersonalizationContextService.php
          php -l app/Services/PersonalizationLivingProfileService.php
          php -l app/Services/GitHubTaskEvidenceCommitGuard.php
          php -l app/Services/GitHubDevelopmentEvidenceService.php
          php -l app/Services/GitHubReturnEvidenceService.php
          php -l app/Jobs/ProcessGitHubWebhookDelivery.php
      - name: Development Living Profile and confirmed decision regression
        run: php artisan test tests/Feature/CandidateEvidenceReopenV5832Test.php tests/Feature/CapabilityActivationV5826Test.php
      - name: GitHub non-PR and PR queued evidence regressions
        run: php artisan test tests/Feature/DeveloperEvidenceSyncV537Test.php tests/Feature/GitHubWebhookReturnSyncV4610Test.php
      - name: Actor and provider source isolation
        run: php artisan test tests/Feature/ProviderConnectionActivityIntakeV559Test.php tests/Feature/DeveloperActivityObservationV571Test.php
      - name: Living Profile freshness and MCP revoke regression
        run: php artisan test tests/Feature/StudyBehaviorPersonalizationV5828Test.php tests/Feature/McpSyntheticOAuthConsentReadLifecycleTest.php
