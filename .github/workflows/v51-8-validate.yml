name: V51.8 temporary validation

on:
  push:
    branches:
      - feature/v51-8-stability-interaction-performance

permissions:
  contents: read

jobs:
  stability-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: V51.8 and core navigation regressions
        run: >
          php artisan test
          tests/Feature/InteractionPerformanceV518Test.php
          tests/Feature/PerformanceObservabilityV4117Test.php
          tests/Feature/InstantNavigationV4120Test.php
          tests/Feature/InstantNavigationFragmentV4121Test.php
          tests/Feature/SharedCoreContextV4122Test.php
          tests/Feature/SurfaceRefinementPhase1V516Test.php
          tests/Feature/ConstellationShapeGrammarV517Test.php
          tests/Feature/PrimaryNavigationCompanionV510Test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
