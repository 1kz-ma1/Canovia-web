name: Canovia Future Carousel

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/future-carousel.yml'
      - 'app/Http/Controllers/CanoviaFutureController.php'
      - 'app/Services/PublicRoadmapProjectionService.php'
      - 'app/Services/ReleaseLevelService.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'config/canovia*roadmap*'
      - 'config/canovia_future_media.php'
      - 'resources/views/feedback/**'
      - 'resources/views/components/future-*'
      - 'resources/js/future-carousel.mjs'
      - 'resources/js/app.js'
      - 'resources/css/future-carousel.css'
      - 'resources/css/app.css'
      - 'public/images/future/**'
      - 'scripts/ci/future_carousel*'
      - 'scripts/ci/integration_browser_regression.py'
      - 'scripts/ops/platform_release_preflight.py'
      - 'tests/ci/test_preparation_release_preflight.py'
      - 'scripts/ci/preparation_interest_browser_smoke.mjs'
      - 'resources/views/preparation/**'
      - 'resources/js/preparation.mjs'
      - 'resources/css/preparation.css'
      - 'resources/views/components/preparation-*'
      - 'public/images/preparation/**'
      - 'app/Http/Controllers/PrelaunchInterestController.php'
      - 'app/Services/PrelaunchInterestContextService.php'
      - 'tests/Feature/CanoviaFuture*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Seal application dependency files before tooling setup
        run: sha256sum package.json package-lock.json > "$RUNNER_TEMP/future-app-dependencies.sha256"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --ignore-scripts && npm run build
      - name: Existing publication, voting and new carousel PHP regressions
        run: php artisan test --compact tests/Feature/CanoviaFutureV407Test.php tests/Feature/CanoviaFutureCarouselTest.php
      - name: Install pinned test browser without changing lockfiles
        run: |
          npm install --prefix "$RUNNER_TEMP/future-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/future-browser/node_modules/playwright" node_modules/playwright
          node --input-type=module -e "import {chromium, webkit} from 'playwright'; import {existsSync} from 'node:fs'; if (![chromium, webkit].every(engine => existsSync(engine.executablePath()))) process.exit(1);"
          sha256sum --check "$RUNNER_TEMP/future-app-dependencies.sha256"
      - name: L0 local-only disposable browser journey
        run: python3 scripts/ci/integration_browser_regression.py --journey future --browser-engine ${{ matrix.engine }} --artifacts "$RUNNER_TEMP/future-artifacts"
      - name: Preparation interest to canonical Plan (synthetic Chromium/WebKit, not real Safari)
        run: >-
          python3 scripts/ci/integration_browser_regression.py --journey preparation_interest
          --browser-engine ${{ matrix.engine }} --artifacts "$RUNNER_TEMP/future-artifacts/interest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-${{ matrix.engine }}
          path: ${{ runner.temp }}/future-artifacts
          if-no-files-found: error
          retention-days: 7
