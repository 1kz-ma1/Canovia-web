name: V58.19 Weakness Intervention Outcomes Validation

on:
  push:
    branches:
      - feature/v58-19-weakness-intervention-outcomes

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: PHP lint
        run: |
          php -l app/Intelligence/Study/StudyWeaknessInterventionOutcomeService.php
          php -l app/Intelligence/Study/StudyWorkspaceSurfaceRegistry.php
          php -l app/Intelligence/Study/StudyWorkspaceSurfacePolicy.php
          php -l app/Http/Controllers/StudyWorkspaceController.php
          php -l tests/Feature/WeaknessInterventionOutcomesV5819Test.php
      - run: php artisan view:cache
      - run: php artisan migrate --force
      - name: V58.19 dedicated weakness intervention outcome contract
        run: php artisan test tests/Feature/WeaknessInterventionOutcomesV5819Test.php
      - name: V56.0 Study Exam Convergence regression
        run: php artisan test tests/Feature/StudyExamConvergencePolicyV560Test.php
      - name: V56.4 Study Practice routing regression
        run: php artisan test tests/Feature/StudyPracticeRoutingV564Test.php
      - name: V58.18 Plan-wide weakness handoff regression
        run: php artisan test tests/Feature/PlanWideWeaknessHandoffV5818Test.php
      - name: V58.16 AP coverage regression
        run: php artisan test tests/Feature/ApSubjectACoverageDashboardV5816Test.php
      - name: V58.17 cumulative checkpoint regression
        run: php artisan test tests/Feature/StudyPracticeCumulativeCheckpointV5817Test.php
      - name: V58.3 Study Workspace focused surfaces regression
        run: php artisan test tests/Feature/StudyWorkspaceFocusedSurfacesV583Test.php
